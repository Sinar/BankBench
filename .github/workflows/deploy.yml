name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "eval-scorecard/unified_scorecard_dashboard.html"
      - "eval-scorecard/README.md"
      - public/outreach/ops/**
      - public/outreach/uni/**
      - deploy.sh
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site output
        run: |
          OUT=dist
          rm -rf "$OUT" && mkdir -p "$OUT"
          cp -R site/. "$OUT"/
          mkdir -p "$OUT/eval-scorecard"
          cp eval-scorecard/unified_scorecard_dashboard.html "$OUT/eval-scorecard/"
          cp eval-scorecard/README.md "$OUT/eval-scorecard/" 2>/dev/null || true
          # Public outreach microsite — static files only. The worker/ folder is
          # deployed separately with `wrangler deploy`, so it stays out of Pages.
          mkdir -p "$OUT/outreach"
          cp -R public/outreach/ops "$OUT/outreach/ops"
          rm -rf "$OUT/outreach/ops/worker"
          # Public outreach microsite — Uni eval pages (static files only).
          # NOTE: cp -R creates the target dir itself; mkdir-ing it first makes
          # cp nest the source inside (uni/uni/*.html), so never pre-create it.
          cp -R public/outreach/uni "$OUT/outreach/uni"
          # Also mirror under /public/... so full repo-path URLs work too.
          mkdir -p "$OUT/public/outreach"
          cp -R public/outreach/uni "$OUT/public/outreach/uni"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name bankbench-sinar
