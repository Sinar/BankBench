<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CETALab Uni — Epistemic Awareness for RKFF 0413</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f7f6f3; color: #1a1a1a;
    min-height: 100vh; display: flex; justify-content: center;
    padding: 32px 20px 80px;
  }
  .app { width: 100%; max-width: 780px; }

  .topbar {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 10px;
    font-size: 11.5px; letter-spacing: 0.06em; text-transform: uppercase;
    color: #8a8580;
  }
  .progress { display: flex; gap: 3px; margin-bottom: 36px; }
  .progress span {
    height: 3px; flex: 1; background: #e0ded8;
    border-radius: 2px; transition: background 0.4s;
  }
  .progress span.active { background: #1a1a1a; }
  .progress span.done   { background: #1a1a1a; }

  .screen { display: none; animation: fadeUp 0.35s ease both; }
  .screen.visible { display: block; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .kicker {
    font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
    color: #8a8580; margin-bottom: 10px;
  }
  h1 { font-size: 25px; font-weight: 600; line-height: 1.3; margin-bottom: 8px; letter-spacing: -0.01em; }
  h2 { font-size: 18px; font-weight: 600; line-height: 1.35; margin-bottom: 10px; }
  .sub { font-size: 14.5px; color: #6b6660; line-height: 1.55; margin-bottom: 24px; }

  /* Intro cards */
  .intro-card {
    background: #fff; border: 1px solid #e8e5df; border-radius: 16px;
    padding: 26px 28px; margin-bottom: 18px;
  }
  .intro-card h3 {
    font-size: 15px; font-weight: 600; margin-bottom: 12px;
    display: flex; align-items: center; gap: 10px;
  }
  .intro-card h3 .ico {
    display: inline-flex; width: 26px; height: 26px;
    border-radius: 7px; background: #1a1a1a; color: #fff;
    align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700; flex-shrink: 0;
    font-family: "SF Mono", monospace;
  }
  .intro-card ul { list-style: none; padding: 0; margin-bottom: 4px; }
  .intro-card li {
    font-size: 13.5px; line-height: 1.6; color: #4a4640;
    padding: 8px 0 8px 22px; position: relative;
    border-bottom: 1px solid #f0ede8;
  }
  .intro-card li:last-child { border-bottom: none; }
  .intro-card li::before {
    content: "→"; position: absolute; left: 0;
    color: #a09b95; font-family: "SF Mono", monospace;
  }
  .intro-card p { font-size: 13.5px; line-height: 1.7; color: #4a4640; }
  .intro-card p:last-child { margin-bottom: 0; }

  /* Models list */
  .models-grid {
    display: grid; grid-template-columns: repeat(2, 1fr);
    gap: 10px; margin-top: 14px;
  }
  @media (max-width: 560px) { .models-grid { grid-template-columns: 1fr; } }
  .model-vendor {
    background: #faf9f6; border: 1px solid #ebe8e2;
    border-radius: 10px; padding: 12px 14px;
  }
  .model-vendor .mv-name {
    font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
    color: #8a8580; font-weight: 700; margin-bottom: 8px;
    font-family: "SF Mono", monospace;
  }
  .model-vendor .mv-item {
    font-size: 12.5px; line-height: 1.5; color: #1a1a1a;
    font-family: "SF Mono", monospace;
    padding: 2px 0;
    word-break: break-all;
  }

  /* Epistemic states */
  .intro-states {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px;
  }
  @media (max-width: 560px) { .intro-states { grid-template-columns: 1fr; } }
  .intro-state {
    padding: 12px 14px; border-radius: 10px;
    border: 1px solid #e8e5df; background: #faf9f6;
  }
  .intro-state .is-name {
    font-size: 13px; font-weight: 700; margin-bottom: 3px;
    display: flex; align-items: baseline; gap: 6px;
  }
  .intro-state .is-arabic { font-size: 12px; font-weight: 400; color: #a09b95; }
  .intro-state.yaqeen .is-name { color: #2a5a2a; }
  .intro-state.zann   .is-name { color: #8a6510; }
  .intro-state.shak   .is-name { color: #3a5a7a; }
  .intro-state.wahm   .is-name { color: #7a2020; }
  .intro-state .is-desc { font-size: 12px; line-height: 1.5; color: #6b6660; }

  /* Assignment map */
  .assign-map {
    background: #fff; border: 1px solid #e8e5df; border-radius: 14px;
    padding: 20px 24px; margin-bottom: 18px;
  }
  .assign-map h4 {
    font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase;
    color: #8a8580; margin-bottom: 12px; font-weight: 700;
  }
  .assign-row {
    display: grid; grid-template-columns: 90px 1fr; gap: 14px;
    padding: 9px 0; border-bottom: 1px solid #f0ede8;
    align-items: baseline; font-size: 13px;
  }
  .assign-row:last-child { border-bottom: none; }
  .assign-tag {
    font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase;
    font-weight: 700; padding: 3px 8px; border-radius: 5px;
    text-align: center; font-family: "SF Mono", monospace;
  }
  .assign-tag.aqidah   { background: #e6ecf5; color: #2a3a6a; }
  .assign-tag.shariah  { background: #f0e6d4; color: #6a4a10; }
  .assign-topics { color: #4a4640; line-height: 1.55; font-size: 12.5px; }

  /* Scenario */
  .scenario {
    background: #fff; border: 1px solid #e8e5df; border-radius: 14px;
    padding: 22px 24px; margin-bottom: 14px;
  }
  .scenario .mode-chips {
    display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px;
  }
  .scenario .mode-chip {
    font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase;
    color: #6b6660; background: #f0ede8; padding: 3px 9px;
    border-radius: 5px; font-weight: 600;
  }
  .scenario .mode-chip.primary { background: #1a1a1a; color: #fff; }
  .scenario .mode-chip.aqidah  { background: #e6ecf5; color: #2a3a6a; }
  .scenario .mode-chip.shariah { background: #f0e6d4; color: #6a4a10; }
  .scenario .q-label {
    font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase;
    color: #a09b95; margin-bottom: 6px;
  }
  .scenario p { font-size: 16px; line-height: 1.5; font-weight: 500; color: #1a1a1a; }

  /* System prompt disclosure */
  .sysprompt-box {
    background: #faf9f6; border: 1px solid #e8e5df;
    border-radius: 10px; margin-bottom: 14px; overflow: hidden;
  }
  .sysprompt-box summary {
    padding: 12px 18px; cursor: pointer;
    font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
    color: #8a8580; font-weight: 700; list-style: none;
    display: flex; justify-content: space-between; align-items: center;
    font-family: "SF Mono", monospace;
  }
  .sysprompt-box summary::-webkit-details-marker { display: none; }
  .sysprompt-box summary::after {
    content: "▾"; color: #a09b95; font-size: 12px;
    transition: transform 0.2s;
  }
  .sysprompt-box[open] summary::after { transform: rotate(180deg); }
  .sysprompt-box .sp-body {
    padding: 14px 18px 18px; border-top: 1px solid #f0ede8; background: #fff;
  }
  .sysprompt-box .sp-body .sp-text {
    font-family: "SF Mono", "Monaco", monospace;
    font-size: 11.5px; line-height: 1.7; color: #4a4640;
    background: #faf9f6; padding: 12px 14px; border-radius: 8px;
    border-left: 3px solid #a09b95;
    white-space: pre-wrap; word-break: break-word;
  }
  .sysprompt-box .sp-body .sp-note {
    font-size: 11.5px; line-height: 1.6; color: #8a8580;
    margin-top: 10px; font-style: italic;
  }

  /* Runs */
  .runs { display: flex; flex-direction: column; gap: 10px; margin-bottom: 24px; }
  .run {
    background: #fff; border: 1px solid #e8e5df; border-radius: 12px;
    padding: 16px 18px;
  }
  .run .tag {
    font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase;
    color: #a09b95; margin-bottom: 7px;
    font-family: "SF Mono", monospace;
  }
  .run p {
    font-size: 14px; line-height: 1.6; color: #3a3632;
    white-space: pre-wrap; word-wrap: break-word;
  }

  /* Options */
  .opts {
    display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px;
    margin-bottom: 24px;
  }
  @media (max-width: 560px) { .opts { grid-template-columns: 1fr; } }
  .opt {
    background: #fff; border: 1.5px solid #e0ded8; border-radius: 10px;
    padding: 14px 12px; cursor: pointer;
    font-size: 13.5px; font-weight: 500; color: #1a1a1a;
    font-family: inherit; text-align: center;
    transition: border-color 0.2s, background 0.2s, color 0.2s, transform 0.15s;
    line-height: 1.35;
  }
  .opt:hover { border-color: #b0aba5; transform: translateY(-1px); }
  .opt.selected { border-color: #1a1a1a; background: #1a1a1a; color: #fff; }

  /* Reveal */
  .reveal {
    background: #1a1a1a; color: #fff; border-radius: 12px;
    padding: 20px 24px; margin-bottom: 22px;
    animation: fadeUp 0.3s ease both;
  }
  .reveal .rk {
    font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase;
    color: #a09b95; margin-bottom: 8px;
    font-family: "SF Mono", monospace;
  }
  .reveal p { font-size: 14px; line-height: 1.6; color: #d5d0ca; }
  .reveal strong { color: #fff; }

  /* States */
  .states {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
    margin-bottom: 22px; animation: fadeUp 0.3s ease both;
  }
  @media (max-width: 560px) { .states { grid-template-columns: 1fr; } }
  .state {
    background: #fff; border: 1.5px solid #e0ded8; border-radius: 12px;
    padding: 16px 18px; cursor: pointer;
    transition: border-color 0.2s, background 0.2s, color 0.2s, transform 0.15s;
    text-align: left; font-family: inherit;
  }
  .state:hover { border-color: #b0aba5; transform: translateY(-1px); }
  .state.selected { border-color: #1a1a1a; background: #1a1a1a; color: #fff; }
  .state .sn { font-size: 14.5px; font-weight: 600; margin-bottom: 2px; }
  .state .sa { font-size: 12px; color: #a09b95; margin-bottom: 6px; font-weight: 400; }
  .state .sd { font-size: 12.5px; line-height: 1.45; color: #8a8580; }
  .state.selected .sa, .state.selected .sd { color: #a09b95; }

  /* Feedback */
  .feedback {
    border-radius: 12px; padding: 20px 24px; margin-bottom: 18px;
    animation: fadeUp 0.3s ease both;
    font-size: 14px; line-height: 1.65;
  }
  .feedback.match { background: #eef5ee; border: 1px solid #cfe3cf; color: #2a4a2a; }
  .feedback.miss  { background: #fdf3e7; border: 1px solid #f0dcc0; color: #5a4328; }
  .feedback .fb-head {
    font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase;
    font-weight: 600; margin-bottom: 8px; opacity: 0.7;
  }
  .feedback strong { font-weight: 700; }
  .feedback .fb-assign {
    display: block; margin-top: 12px; padding-top: 12px;
    border-top: 1px dashed rgba(0,0,0,0.12);
    font-size: 13px; line-height: 1.6;
  }
  .feedback .fb-assign .fba-label {
    font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase;
    font-weight: 700; opacity: 0.65; margin-bottom: 4px; display: block;
    font-family: "SF Mono", monospace;
  }

  /* Model reveal */
  .model-reveal {
    background: #f0ede8; border-radius: 12px; padding: 18px 22px;
    margin-bottom: 22px;
    animation: fadeUp 0.3s ease both;
    animation-delay: 0.1s;
  }
  .model-reveal .mr-label {
    font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
    color: #8a8580; margin-bottom: 6px;
    font-family: "SF Mono", monospace; font-weight: 700;
  }
  .model-reveal .mr-name {
    font-size: 15px; font-weight: 700;
    font-family: "SF Mono", monospace; color: #1a1a1a;
    margin-bottom: 10px; word-break: break-all;
  }
  .model-reveal .mr-note { font-size: 13px; line-height: 1.6; color: #4a4640; }

  /* Buttons */
  .btn-row {
    display: flex; gap: 12px; align-items: center;
    margin-bottom: 16px; flex-wrap: wrap;
  }
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    background: #1a1a1a; color: #fff; border: none; border-radius: 10px;
    padding: 13px 26px; font-size: 14.5px; font-weight: 600;
    cursor: pointer; font-family: inherit;
    transition: background 0.2s, transform 0.15s, opacity 0.2s;
  }
  .btn:hover { background: #333; transform: translateY(-1px); }
  .btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }
  .btn.ghost {
    background: transparent; color: #1a1a1a; border: 1.5px solid #d5d0ca;
  }
  .btn.ghost:hover { border-color: #1a1a1a; }

  /* Summary */
  .summary-grid {
    display: flex; flex-direction: column; gap: 8px; margin-bottom: 26px;
  }
  .sum-row {
    display: grid; grid-template-columns: 34px 1fr auto; gap: 12px;
    align-items: center; background: #fff;
    border: 1px solid #e8e5df; border-radius: 10px;
    padding: 12px 16px; font-size: 13.5px;
  }
  .sum-row .num {
    font-size: 12px; color: #a09b95; font-weight: 600;
    font-family: "SF Mono", monospace;
  }
  .sum-row .sum-body { min-width: 0; }
  .sum-row .sum-topic {
    font-weight: 600; color: #1a1a1a; font-size: 13.5px; margin-bottom: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .sum-row .sum-meta {
    font-size: 11px; color: #8a8580; letter-spacing: 0.02em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .sum-row .sum-model {
    font-family: "SF Mono", monospace; color: #6b6660; font-size: 10.5px;
  }
  .sum-row .chip {
    font-size: 11px; padding: 3px 10px; border-radius: 5px;
    background: #f0ede8; color: #6b6660;
    font-weight: 700; letter-spacing: 0.04em; white-space: nowrap;
    text-transform: uppercase; font-family: "SF Mono", monospace;
  }
  .sum-row .chip.yaqeen { background: #dcecdc; color: #2a5a2a; }
  .sum-row .chip.zann   { background: #f0e6c8; color: #6a5010; }
  .sum-row .chip.shak   { background: #dce6f0; color: #2a4a6a; }
  .sum-row .chip.wahm   { background: #f0dcdc; color: #6a2a2a; }
  .sum-row .chip.correct { border: 1.5px solid currentColor; }

  .tally {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
    margin-bottom: 26px;
  }
  @media (max-width: 560px) { .tally { grid-template-columns: 1fr 1fr; } }
  .tally-item {
    background: #fff; border: 1px solid #e8e5df; border-radius: 10px;
    padding: 14px; text-align: center;
  }
  .tally-item .tn {
    font-size: 22px; font-weight: 700; margin-bottom: 2px;
    font-family: "SF Mono", monospace;
  }
  .tally-item .tl {
    font-size: 10.5px; letter-spacing: 0.05em; text-transform: uppercase;
    color: #8a8580; font-weight: 600;
  }

  .cat-breakdown {
    background: #fff; border: 1px solid #e8e5df; border-radius: 12px;
    padding: 20px 24px; margin-bottom: 22px;
  }
  .cat-breakdown h3 { font-size: 14px; font-weight: 600; margin-bottom: 6px; }
  .cat-breakdown .cat-sub {
    font-size: 12px; color: #8a8580; margin-bottom: 16px; line-height: 1.55;
  }
  .cat-row {
    display: grid; grid-template-columns: 180px 1fr 60px; gap: 14px;
    align-items: center; padding: 9px 0;
    border-bottom: 1px solid #f0ede8; font-size: 13px;
  }
  .cat-row:last-child { border-bottom: none; }
  @media (max-width: 560px) {
    .cat-row { grid-template-columns: 1fr auto; gap: 8px; }
    .cat-row .cat-bar-wrap { grid-column: 1 / -1; }
  }
  .cat-name { color: #4a4640; font-weight: 500; }
  .cat-bar-wrap {
    height: 6px; background: #f0ede8; border-radius: 3px; overflow: hidden;
  }
  .cat-bar {
    height: 100%; background: #1a1a1a; border-radius: 3px;
    transition: width 0.6s cubic-bezier(0.34, 1.2, 0.64, 1);
  }
  .cat-count {
    font-size: 11.5px; color: #8a8580; font-family: "SF Mono", monospace;
    text-align: right; font-weight: 600;
  }

  .closing {
    background: #1a1a1a; color: #fff; border-radius: 14px;
    padding: 26px 28px; margin-bottom: 22px;
  }
  .closing h3 { font-size: 17px; font-weight: 600; margin-bottom: 12px; }
  .closing p {
    font-size: 14px; line-height: 1.7; color: #c5c0ba; margin-bottom: 10px;
  }
  .closing p:last-child { margin-bottom: 0; }
  .closing strong { color: #fff; }
  .closing em { color: #e0ded8; font-style: italic; }

  .checklist {
    background: #faf9f6; border: 1px solid #e8e5df; border-radius: 12px;
    padding: 20px 24px; margin-bottom: 22px;
  }
  .checklist h4 {
    font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase;
    color: #8a8580; margin-bottom: 12px; font-weight: 700;
  }
  .checklist ul { list-style: none; padding: 0; }
  .checklist li {
    font-size: 13px; line-height: 1.6; color: #4a4640;
    padding: 6px 0 6px 24px; position: relative;
  }
  .checklist li::before {
    content: "□"; position: absolute; left: 0;
    color: #a09b95; font-size: 14px;
  }

  .methods-note {
    background: #faf9f6; border: 1px solid #e8e5df; border-radius: 12px;
    padding: 18px 22px; margin-bottom: 20px;
    font-size: 12.5px; line-height: 1.65; color: #6b6660;
  }
  .methods-note strong { color: #4a4640; }
  .methods-note code {
    font-family: "SF Mono", monospace; background: #f0ede8;
    padding: 1px 5px; border-radius: 3px;
    font-size: 11.5px; color: #4a4640;
  }
</style>
</head>
<body>

<div class="app">
  <div class="topbar">
    <span id="topLeft">CETALab Uni · RKFF 0413</span>
    <span id="topRight"></span>
  </div>
  <div class="progress" id="progress"></div>
  <div id="screen"></div>
</div>

<script>
/* ═══════════════════════════════════════════════════
   STATES
   ═══════════════════════════════════════════════════ */

const STATES = {
  yaqeen: { name: "Yaqeen", arabic: "يقين", gloss: "Certainty", short: "Certainty",
    desc: "Stable, consistent runs grounded in well-established knowledge." },
  zann:   { name: "Zann",   arabic: "ظن",   gloss: "Conjecture", short: "Conjecture",
    desc: "Runs lean the same way, with variation. Reasoned from partial knowledge." },
  shak:   { name: "Shak",   arabic: "شك",   gloss: "Doubt", short: "Doubt",
    desc: "Runs disagree, and the model admits uncertainty. Honest doubt." },
  wahm:   { name: "Wahm",   arabic: "وهم",  gloss: "Illusion", short: "Illusion",
    desc: "Runs sound confident but cannot all be true. Certainty without grounding." }
};

/* ═══════════════════════════════════════════════════
   SYSTEM PROMPT
   ═══════════════════════════════════════════════════ */

const SYSTEM_PROMPT = "You are an academic research assistant answering a question from a Malaysian university student for a course on Islamic studies. Answer in 3 to 5 sentences. Be direct.";
const COLLECTED_ON = "2026-09-23";

/* ═══════════════════════════════════════════════════
   MODELS EVALUATED — unique set
   ═══════════════════════════════════════════════════ */

const MODELS_BY_VENDOR = [
  { vendor: "OpenAI",    models: ["openai/gpt-4o", "openai/gpt-4o-mini"] },
  { vendor: "Anthropic", models: ["anthropic/claude-sonnet-5"] },
  { vendor: "Google",    models: ["google/gemini-2.5-pro", "google/gemini-3.1-flash-lite"] },
  { vendor: "DeepSeek",  models: ["deepseek/deepseek-v4-flash-0731"] },
  { vendor: "Alibaba",   models: ["qwen/qwen3.8-flash"] },
  { vendor: "Meta",      models: ["meta-llama/llama-3.3-70b-instruct"] }
];

/* ═══════════════════════════════════════════════════
   10 QUESTIONS — cleaned answers, one model each
   ═══════════════════════════════════════════════════ */

const QUESTIONS = [
  /* ── Q1 · YAQEEN ──────────────────────────── */
  {
    id: 1, mode: "Definition & Background", assignment: "shariah",
    topic: "Tabarruj", category: "Meaning & Understanding",
    model: "openai/gpt-4o",
    prompt: "What is tabarruj in Islam, and which Qur'anic verses address it?",

let currentQ = 0;
let phase = "intro"; // intro | confidence | classify | feedback | summary
let answers = [];
let currentConfidence = null;
let currentClassification = null;

// Scroll-position tracking
let lastRenderedQ = -1;
let lastRenderedPhase = "";

const screenEl = document.getElementById("screen");
const progressEl = document.getElementById("progress");
const topLeft = document.getElementById("topLeft");
const topRight = document.getElementById("topRight");

/* ═══════════════════════════════════════════════════
   RENDER
   ═══════════════════════════════════════════════════ */

function render() {
  renderProgress();
  screenEl.innerHTML = "";

  const prevQ = lastRenderedQ;
  const prevPhase = lastRenderedPhase;

  if (phase === "intro") {
    renderIntro();
    window.scrollTo({ top: 0, behavior: "auto" });
    lastRenderedQ = -1;
    lastRenderedPhase = phase;
    return;
  }
  if (phase === "summary") {
    renderSummary();
    window.scrollTo({ top: 0, behavior: "auto" });
    lastRenderedQ = -1;
    lastRenderedPhase = phase;
    return;
  }

  renderQuestion();

  lastRenderedQ = currentQ;
  lastRenderedPhase = phase;

  // Only scroll when the QUESTION changes — not on every phase change within the same question
  if (currentQ !== prevQ) {
    requestAnimationFrame(() => {
      const el = document.querySelector(".scenario");
      if (el) {
        const y = el.getBoundingClientRect().top + window.pageYOffset - 24;
        window.scrollTo({ top: Math.max(0, y), behavior: "auto" });
      }
    });
  }
}

function renderProgress() {
  progressEl.innerHTML = "";
  if (phase === "intro") {
    topLeft.textContent = "CETALab Uni · RKFF 0413";
    topRight.textContent = "Introduction";
    return;
  }
  for (let i = 0; i < QUESTIONS.length; i++) {
    const s = document.createElement("span");
    if (i < currentQ) s.className = "done";
    else if (i === currentQ) s.className = "active";
    progressEl.appendChild(s);
  }
  topLeft.textContent = "CETALab Uni · RKFF 0413";
  topRight.textContent = `Question ${currentQ + 1} of ${QUESTIONS.length}`;
}

        </div>
        <div class="intro-state zann">
          <div class="is-name">Zann <span class="is-arabic">ظن</span></div>
          <div class="is-desc">Leans a direction with variation. A reasoned guess — verify before citing.</div>
        </div>
        <div class="intro-state shak">
          <div class="is-name">Shak <span class="is-arabic">شك</span></div>
          <div class="is-desc">Disagrees or admits uncertainty. The AI is telling you to verify.</div>
        </div>
        <div class="intro-state wahm">
          <div class="is-name">Wahm <span class="is-arabic">وهم</span></div>
          <div class="is-desc">Sounds confident but is fabricated. The failure mode that destroys assignments.</div>
        </div>
      </div>
    </div>

    <div class="intro-card">
      <h3><span class="ico">3</span>Models evaluated in this module</h3>
      <p style="margin-bottom:0;">
        ${totalModels} models from six developers. Each question in the module was answered
        by <strong>one</strong> model, run three times. You will see which model was used
        <em>after</em> you classify it, so that your judgement of the answers is not coloured
        by brand familiarity.
      </p>
      ${modelsHTML}
    </div>

    <div class="intro-card">
      <h3><span class="ico">4</span>How the data was collected</h3>
      <p style="margin-bottom:10px;">
        Every question was sent with the same system prompt, at a temperature high enough
        to produce variation across runs. The outputs you will read are the raw, unedited
        responses — except for a few that were cut off mid-sentence by the token limit, which
        have been trimmed back to their last complete sentence.
      </p>
      <p style="margin-bottom:0;">
        The models span frontier and open-weight systems from OpenAI, Anthropic, Google,
        DeepSeek, Alibaba, and Meta. Together they show that the four epistemic states are
        not a property of any one developer's model — they are a property of how language
        models behave.
      </p>
    </div>

    <div class="assign-map">
      <h4>Where these 10 questions come from</h4>
      <div class="assign-row">
        <span class="assign-tag aqidah">Aqidah</span>
        <span class="assign-topics">
          Group Presentation — <em>Issues in 'Aqidah</em>. Topics covered here: Ulek Mayang,
          Yoga, Rain Rave Music Festival, Horoscope.
        </span>
      </div>
      <div class="assign-row">
        <span class="assign-tag shariah">Shari'ah</span>
        <span class="assign-topics">
          Group Assignment — <em>Al-Shari'ah (Maqasid &amp; Purposes of 'Ibadah)</em>. Topics
          covered here: Tabarruj, Doomscrolling, Cosmetic Plastic Surgery, BNPL,
          Claw Machine Games, Mukbang.
        </span>
      </div>
    </div>

    <div class="methods-note">
      <strong>Data collection note.</strong> Collected <code>${COLLECTED_ON}</code> via OpenRouter.
      System prompt used for all questions: <code>"${SYSTEM_PROMPT}"</code>.
    </div>

    <div class="btn-row">
      <button class="btn" id="startBtn">Begin · ${QUESTIONS.length} questions</button>
    </div>
  `;

  screenEl.appendChild(wrap);
  wrap.querySelector("#startBtn").addEventListener("click", () => {
    currentQ = 0;
    phase = "confidence";
    answers = [];
    currentConfidence = null;
    currentClassification = null;
    render();
  });
}

/* ── Question ─────────────────────────────────── */
function renderQuestion() {
  const q = QUESTIONS[currentQ];
  const wrap = document.createElement("div");
  wrap.className = "screen visible";

  const assignLabel = q.assignment === "aqidah" ? "Aqidah Presentation" : "Shari'ah Assignment";

  let html = `
    <div class="kicker">${q.mode}</div>
    <div class="scenario">
      <div class="mode-chips">
        <span class="mode-chip primary">${q.mode}</span>
        <span class="mode-chip ${q.assignment}">${assignLabel}</span>
        <span class="mode-chip">Topic: ${q.topic}</span>
      </div>
      <div class="q-label">Question to the AI</div>
      <p>"${escapeHTML(q.prompt)}"</p>
    </div>

    <details class="sysprompt-box">
      <summary>System prompt used for this question</summary>
      <div class="sp-body">
        <div class="sp-text">${escapeHTML(SYSTEM_PROMPT)}</div>
        <div class="sp-note">
          This is the instruction given to the model before every user question. It sets the persona
          ("academic research assistant"), the audience ("Malaysian university student"), and the
          style ("answer in 3 to 5 sentences. Be direct."). Notice when the model ignores the length
          instruction.
        </div>
      </div>
    </details>

    <div class="runs">
  `;

  q.runs.forEach((r, i) => {
    const label = ["Response A", "Response B", "Response C"][i] || `Run ${i + 1}`;
    html += `
      <div class="run">
        <div class="tag">${label}</div>
        <p>${escapeHTML(r)}</p>
      </div>
    `;
  });

  html += `</div>`;

  if (phase === "confidence") {
    html += `
      <h2>Did their confidence differ?</h2>
      <p class="sub" style="margin-bottom:16px;">Pick one to continue.</p>
      <div class="opts" id="confOpts">
        <button class="opt" data-val="same">Same</button>
        <button class="opt" data-val="slightly">Slightly</button>
        <button class="opt" data-val="alot">A lot</button>
      </div>
    `;
  }

  if (phase === "classify" || phase === "feedback") {
    html += `
      <div class="reveal">
        <div class="rk">What you just read</div>
        <p><strong>Same model. Same prompt. Run three times.</strong> The differences between the runs are the ordinary non-determinism of a single system. This is what an AI research assistant actually produces when you ask it about your topic.</p>
      </div>
      <h2>Classify the set.</h2>
      <p class="sub" style="margin-bottom:16px;">Given all three runs together, which state describes this distribution?</p>
      <div class="states" id="stateOpts">
    `;

    Object.keys(STATES).forEach(key => {
      const s = STATES[key];
      html += `
        <button class="state" data-state="${key}">
          <div class="sn">${s.name} <span style="font-weight:400;color:#a09b95;">${s.arabic}</span></div>
          <div class="sa">${s.gloss}</div>
          <div class="sd">${s.desc}</div>
        </button>
      `;
    });

    html += `</div>`;
  }

  if (phase === "feedback") {
    const expected = STATES[q.state];
    const match = currentClassification === q.state;
    const userState = STATES[currentClassification];

    html += `
      <div class="feedback ${match ? "match" : "miss"}">
        <div class="fb-head">${match ? "Your read matches" : "The expected read"}</div>
        <p style="margin-bottom:8px;">
          You classified this as <strong>${userState.name}</strong>.
          ${match
            ? "That's the intended pattern."
            : `The clearest read is <strong>${expected.name} — ${expected.gloss}</strong>.`}
        </p>
        <p style="margin-bottom:0;">${q.why}</p>
        <span class="fb-assign">
          <span class="fba-label">For your assignment</span>
          ${q.assignNote}
        </span>
      </div>

      <div class="model-reveal">
        <div class="mr-label">Model used for this question</div>
        <div class="mr-name">${escapeHTML(q.model)}</div>
        <div class="mr-note">
          This question was answered by <strong>${escapeHTML(q.model)}</strong>. The 10 questions
          in this module were answered by ${MODELS_BY_VENDOR.reduce((a,g) => a + g.models.length, 0)}
          different models from six developers. The four epistemic states are not a property of
          any one model. They are a property of how language models behave.
        </div>
      </div>

      <div class="btn-row">
        <button class="btn" id="nextBtn">
          ${currentQ < QUESTIONS.length - 1 ? "Next question →" : "See summary →"}
        </button>
      </div>
    `;
  }

  wrap.innerHTML = html;
  screenEl.appendChild(wrap);

  // Wire events
  if (phase === "confidence") {
    const opts = wrap.querySelectorAll("#confOpts .opt");
    opts.forEach(o => {
      o.addEventListener("click", () => {
        opts.forEach(x => x.classList.remove("selected"));
        o.classList.add("selected");
        currentConfidence = o.dataset.val;
        setTimeout(() => { phase = "classify"; render(); }, 220);
      });
    });
  }

  if (phase === "classify") {
    const cards = wrap.querySelectorAll("#stateOpts .state");
    cards.forEach(c => {
      c.addEventListener("click", () => {
        cards.forEach(x => x.classList.remove("selected"));
        c.classList.add("selected");
        currentClassification = c.dataset.state;
        answers[currentQ] = {
          confidence: currentConfidence,
          classification: currentClassification
        };
        setTimeout(() => { phase = "feedback"; render(); }, 220);
      });
    });
  }

  if (phase === "feedback") {
    const btn = wrap.querySelector("#nextBtn");
    if (btn) {
      btn.addEventListener("click", () => {
        if (currentQ < QUESTIONS.length - 1) {
          currentQ++;
          phase = "confidence";
          currentConfidence = null;
          currentClassification = null;
          render();
        } else {
          phase = "summary";
          render();
        }
      });
    }
  }
}

/* ── Summary ──────────────────────────────────── */
function renderSummary() {
  const wrap = document.createElement("div");
  wrap.className = "screen visible";

  const tally = { yaqeen: 0, zann: 0, shak: 0, wahm: 0 };
  answers.forEach(a => { if (a) tally[a.classification]++; });

  const catStats = {};
  QUESTIONS.forEach((q, i) => {
    const a = answers[i];
    if (!a) return;
    const cat = q.category;
    if (!catStats[cat]) catStats[cat] = { correct: 0, total: 0 };
    catStats[cat].total++;
    if (a.classification === q.state) catStats[cat].correct++;
  });

  const assignStats = { aqidah: { c: 0, t: 0 }, shariah: { c: 0, t: 0 } };
  QUESTIONS.forEach((q, i) => {
    const a = answers[i];
    if (!a) return;
    assignStats[q.assignment].t++;
    if (a.classification === q.state) assignStats[q.assignment].c++;
  });

  let html = `
    <div class="kicker">Summary · ${QUESTIONS.length} questions</div>
    <h1>You read ${QUESTIONS.length} distributions.</h1>
    <p class="sub">
      Each question showed three responses from a single AI research assistant, same prompt — using
      the topics from your own RKFF 0413 assignments, collected from different language models.
      You classified the set, not any single answer.
    </p>

    <div class="summary-grid">
  `;

  QUESTIONS.forEach((q, i) => {
    const a = answers[i] || {};
    const cls = a.classification || "—";
    const expected = q.state;
    const isCorrect = cls === expected;
    const s = STATES[cls];
    const label = s ? s.short : "—";
    const assignLabel = q.assignment === "aqidah" ? "Aqidah" : "Shari'ah";

    html += `
      <div class="sum-row">
        <span class="num">${String(i + 1).padStart(2, "0")}</span>
        <span class="sum-body">
          <div class="sum-topic">${q.topic}</div>
          <div class="sum-meta">${assignLabel} · ${q.category} · <span class="sum-model">${escapeHTML(q.model)}</span></div>
        </span>
        <span class="chip ${cls}${isCorrect ? " correct" : ""}">${label}</span>
      </div>
    `;
  });

  html += `</div>`;

  html += `
    <h2>Your distribution</h2>
    <p class="sub" style="margin-bottom:14px;">How many of the ${QUESTIONS.length} you read as each state.</p>
    <div class="tally">
      <div class="tally-item"><div class="tn" style="color:#2a5a2a;">${tally.yaqeen}</div><div class="tl">Yaqeen</div></div>
      <div class="tally-item"><div class="tn" style="color:#8a6510;">${tally.zann}</div><div class="tl">Zann</div></div>
      <div class="tally-item"><div class="tn" style="color:#3a5a7a;">${tally.shak}</div><div class="tl">Shak</div></div>
      <div class="tally-item"><div class="tn" style="color:#7a2020;">${tally.wahm}</div><div class="tl">Wahm</div></div>
    </div>

    <div class="cat-breakdown">
      <h3>Awareness by sourcing skill</h3>
      <p class="cat-sub">Where your epistemic awareness is strong, and where it needs practice.</p>
  `;

  Object.keys(catStats).forEach(cat => {
    const s = catStats[cat];
    const pct = Math.round((s.correct / s.total) * 100);
    html += `
      <div class="cat-row">
        <span class="cat-name">${cat}</span>
        <div class="cat-bar-wrap"><div class="cat-bar" style="width:${pct}%;"></div></div>
        <span class="cat-count">${s.correct}/${s.total}</span>
      </div>
    `;
  });

  html += `</div>`;

  html += `
    <div class="cat-breakdown">
      <h3>Awareness by assignment</h3>
      <p class="cat-sub">How you did on each of the two RKFF 0413 assignments.</p>
      <div class="cat-row">
        <span class="cat-name">Aqidah Presentation</span>
        <div class="cat-bar-wrap"><div class="cat-bar" style="width:${Math.round((assignStats.aqidah.c / Math.max(1, assignStats.aqidah.t)) * 100)}%;"></div></div>
        <span class="cat-count">${assignStats.aqidah.c}/${assignStats.aqidah.t}</span>
      </div>
      <div class="cat-row">
        <span class="cat-name">Shari'ah Assignment</span>
        <div class="cat-bar-wrap"><div class="cat-bar" style="width:${Math.round((assignStats.shariah.c / Math.max(1, assignStats.shariah.t)) * 100)}%;"></div></div>
        <span class="cat-count">${assignStats.shariah.c}/${assignStats.shariah.t}</span>
      </div>
    </div>
  `;

  html += `
    <div class="checklist">
      <h4>Before you submit — check every source</h4>
      <ul>
        <li>Open every journal article the AI names. Confirm it exists in the actual journal or a database.</li>
        <li>Look up every hadith in the original collection. Check the number and the grading.</li>
        <li>Verify every fatwa or authority claim against the official record (e-fatwa.gov.my, JAKIM, state religious councils).</li>
        <li>If the AI cites a book or author, search for it in your library catalogue or Google Books.</li>
        <li>When in doubt, treat the AI's answer as a starting point for a search — not as a citable source.</li>
      </ul>
    </div>
  `;

  html += `
    <div class="closing">
      <h3>What this exercise was about</h3>
      <p>
        You did not judge the AI. You read its <strong>distribution</strong>. Every question showed
        the same model, the same prompt, run three times — and in every question, the runs varied.
      </p>
      <p>
        Sometimes they converged on well-grounded knowledge (<em>yaqeen</em>). Sometimes they
        reasoned carefully from partial knowledge (<em>zann</em>). Sometimes they honestly admitted
        that a specific fatwa could not be verified, or declined to fabricate a citation
        (<em>shak</em>). And sometimes — the most dangerous case for your assignments — they
        fabricated a JAKIM fatwa (<em>wahm</em>), or invented a contradictory 2022 National
        Fatwa Council ruling (<em>wahm</em>).
      </p>
      <p>
        The four states are properties of a <strong>set of runs</strong>, not of any single
        answer. You cannot see them if you look only once.
      </p>
      <p style="margin-bottom:0;">
        <strong>For RKFF 0413, one AI answer is not evidence. It is a sample — and a sample of
        one tells you almost nothing about the distribution it came from.</strong>
      </p>
    </div>

    <div class="btn-row">
      <button class="btn ghost" id="restartBtn">Run it again</button>
    </div>
  `;

  wrap.innerHTML = html;
  screenEl.appendChild(wrap);

  topLeft.textContent = "CETALab Uni · RKFF 0413";
  topRight.textContent = "Summary";

  progressEl.innerHTML = "";
  for (let i = 0; i < QUESTIONS.length; i++) {
    const s = document.createElement("span");
    s.className = "done";
    progressEl.appendChild(s);
  }

  wrap.querySelector("#restartBtn").addEventListener("click", () => {
    currentQ = 0;
    phase = "intro";
    answers = [];
    currentConfidence = null;
    currentClassification = null;
    render();
  });
}

/* ═══════════════════════════════════════════════════
   UTIL
   ═══════════════════════════════════════════════════ */

function escapeHTML(s) {
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

/* ═══════════════════════════════════════════════════
   INIT
   ═══════════════════════════════════════════════════ */

render();
</script>
</body>
</html>
