<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Confidence Meter — Uni Cetavals</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f6f4ef;
    color: #1a1a1a;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 32px 16px 80px;
  }

  .app { width: 100%; max-width: 640px; }

  /* ── Top bar ─────────────────────────────────── */
  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 28px;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #8a8378;
    font-family: "SF Mono", "Monaco", "Courier New", monospace;
  }

  /* ── Screens ─────────────────────────────────── */
  .screen { display: none; animation: fade 0.35s ease both; }
  .screen.visible { display: block; }

  @keyframes fade {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ── Typography ──────────────────────────────── */
  h1 { font-size: 22px; font-weight: 600; line-height: 1.3; margin-bottom: 8px; letter-spacing: -0.01em; }
  h2 { font-size: 16px; font-weight: 600; line-height: 1.35; margin-bottom: 10px; }

  .sub {
    font-size: 14px;
    color: #6b6660;
    line-height: 1.6;
    margin-bottom: 22px;
  }

  .kicker {
    font-size: 10.5px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #a09b95;
    margin-bottom: 10px;
    font-family: "SF Mono", "Monaco", "Courier New", monospace;
  }

  /* ── Domain list ─────────────────────────────── */
  .domains {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 24px;
  }

  .domain {
    background: #fff;
    border: 1.5px solid #e5e1d8;
    border-radius: 12px;
    padding: 18px 22px;
    cursor: pointer;
    text-align: left;
    font-family: inherit;
    transition: border-color 0.2s, transform 0.15s, box-shadow 0.2s;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
  }
  .domain:hover {
    border-color: #b0aba5;
    transform: translateY(-1px);
    box-shadow: 0 4px 14px rgba(0,0,0,0.05);
  }
  .domain .d-left { flex: 1; }
  .domain .d-name {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 3px;
  }
  .domain .d-desc {
    font-size: 12.5px;
    color: #8a8378;
    line-height: 1.5;
  }
  .domain .d-icon {
    font-size: 20px;
    color: #c5c0ba;
    flex-shrink: 0;
    width: 36px;
    height: 36px;
    border-radius: 8px;
    background: #f6f4ef;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ── Answer card ─────────────────────────────── */
  .query-box {
    background: #fff;
    border: 1px solid #e5e1d8;
    border-radius: 12px;
    padding: 18px 22px;
    margin-bottom: 14px;
  }
  .query-box .q-label {
    font-size: 10.5px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #a09b95;
    margin-bottom: 8px;
    font-family: "SF Mono", "Monaco", "Courier New", monospace;
  }
  .query-box .q-text {
    font-size: 15.5px;
    font-weight: 500;
    line-height: 1.5;
  }

  .answer-box {
    background: #fff;
    border: 1px solid #e5e1d8;
    border-radius: 12px;
    padding: 20px 22px;
    margin-bottom: 22px;
  }
  .answer-box .a-label {
    font-size: 10.5px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #a09b95;
    margin-bottom: 10px;
    font-family: "SF Mono", "Monaco", "Courier New", monospace;
  }
  .answer-box p {
    font-size: 14.5px;
    line-height: 1.7;
    color: #3a3632;
  }

  /* ── Spectrum ────────────────────────────────── */
  .spectrum-wrap {
    background: #fff;
    border: 1px solid #e5e1d8;
    border-radius: 14px;
    padding: 24px 22px 20px;
    margin-bottom: 18px;
    user-select: none;
    -webkit-user-select: none;
  }

  .spectrum-heading {
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 4px;
    color: #3a3632;
  }
  .spectrum-hint {
    font-size: 12px;
    color: #a09b95;
    margin-bottom: 18px;
  }

  .spectrum {
    position: relative;
    height: 180px;
    cursor: ew-resize;
    touch-action: none;
  }

  /* Zone labels (top) */
  .zone-labels {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 24px;
    display: flex;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.6s ease 0.5s;
  }
  .spectrum.revealed .zone-labels { opacity: 1; }

  .zlabel {
    flex: 1;
    text-align: center;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-weight: 700;
    font-family: "SF Mono", "Monaco", "Courier New", monospace;
    transition: color 0.4s;
  }
  .zlabel .z-arabic {
    display: block;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0;
    text-transform: none;
    color: #a09b95;
    margin-top: 1px;
    font-family: inherit;
  }
  .zlabel.shak   { color: #3a5a7a; }
  .zlabel.zann   { color: #7a5a1a; }
  .zlabel.yaqeen { color: #2a5a2a; }
  .zlabel.wahm   { color: #7a2020; }

  /* Marker layer */
  .marker-layer {
    position: absolute;
    top: 26px;
    left: 0;
    right: 0;
    bottom: 40px;
  }

  /* User marker (triangle) */
  .user-marker {
    position: absolute;
    top: 0;
    transform: translateX(-50%);
    transition: left 0.06s linear;
    pointer-events: none;
    z-index: 5;
  }
  .user-marker .um-tri {
    width: 0;
    height: 0;
    border-left: 8px solid transparent;
    border-right: 8px solid transparent;
    border-top: 11px solid #1a1a1a;
    margin: 0 auto;
  }
  .user-marker .um-stem {
    width: 2px;
    height: 50px;
    background: #1a1a1a;
    margin: 0 auto;
    opacity: 0.35;
  }
  .user-marker .um-label {
    position: absolute;
    top: -20px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-weight: 700;
    color: #1a1a1a;
    white-space: nowrap;
    font-family: "SF Mono", "Monaco", "Courier New", monospace;
  }

  /* Model run markers (dots on the track) */
  .model-marker {
    position: absolute;
    top: 100px;
    transform: translateX(-50%);
    pointer-events: none;
    z-index: 4;
    opacity: 0;
  }
  .spectrum.revealed .model-marker {
    animation: drop 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }
  @keyframes drop {
    0%   { transform: translate(-50%, -40px); opacity: 0; }
    70%  { transform: translate(-50%, 3px);   opacity: 1; }
    100% { transform: translate(-50%, 0);     opacity: 1; }
  }
  .model-marker .mm-dot {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #1a1a1a;
    border: 2.5px solid #fff;
    box-shadow: 0 2px 6px rgba(0,0,0,0.18);
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 9px;
    font-weight: 700;
    font-family: "SF Mono", "Monaco", "Courier New", monospace;
  }
  .model-marker .mm-label {
    position: absolute;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 9.5px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #6b6660;
    white-space: nowrap;
    font-family: "SF Mono", "Monaco", "Courier New", monospace;
  }

  /* Ground truth marker (dashed line) */
  .truth-marker {
    position: absolute;
    top: -8px;
    bottom: -30px;
    transform: translateX(-50%);
    pointer-events: none;
    z-index: 3;
    opacity: 0;
  }
  .spectrum.revealed .truth-marker {
    animation: truthIn 0.7s ease forwards;
    animation-delay: 0.8s;
  }
  @keyframes truthIn {
    from { opacity: 0; transform: translate(-50%, 6px); }
    to   { opacity: 1; transform: translate(-50%, 0); }
  }
  .truth-marker .tm-line {
    width: 0;
    height: 100%;
    border-left: 2px dashed #c47a2a;
    margin: 0 auto;
  }
  .truth-marker .tm-label {
    position: absolute;
    top: -18px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-weight: 700;
    color: #c47a2a;
    white-space: nowrap;
    font-family: "SF Mono", "Monaco", "Courier New", monospace;
  }

  /* Track */
  .track {
    position: absolute;
    left: 0;
    right: 0;
    top: 128px;
    height: 10px;
    background: #e5e1d8;
    border-radius: 5px;
    overflow: hidden;
  }
  .zones {
    display: flex;
    height: 100%;
    opacity: 0;
    transition: opacity 0.6s ease 0.4s;
  }
  .spectrum.revealed .zones { opacity: 1; }

  .zone { height: 100%; }
  .zone-shak   { flex: 0 0 35%; background: #a8c0d6; }
  .zone-zann   { flex: 0 0 20%; background: #e0c88a; }
  .zone-yaqeen { flex: 0 0 25%; background: #8ab88a; }
  .zone-wahm   { flex: 0 0 20%; background: #d68a8a; }

  /* Axis labels (bottom) */
  .axis-labels {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    letter-spacing: 0.04em;
    color: #a09b95;
    text-transform: uppercase;
    font-family: "SF Mono", "Monaco", "Courier New", monospace;
  }

  /* instruction pill */
  .drag-hint {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-top: 12px;
    font-size: 12px;
    color: #a09b95;
  }
  .drag-hint .dot-pulse {
    width: 6px; height: 6px; border-radius: 50%;
    background: #c5c0ba;
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.4; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.3); }
  }

  /* ── Comparison card ─────────────────────────── */
  .comparison {
    background: #2a2622;
    color: #fff;
    border-radius: 12px;
    padding: 22px 24px;
    margin-bottom: 18px;
    opacity: 0;
    animation: fadeUp 0.5s ease forwards;
    animation-delay: 1.2s;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .comparison .c-kicker {
    font-size: 10.5px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #a09b95;
    margin-bottom: 12px;
    font-family: "SF Mono", "Monaco", "Courier New", monospace;
  }
  .comparison .c-state {
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin-bottom: 4px;
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  .comparison .c-state .c-arabic {
    font-size: 16px;
    font-weight: 500;
    color: #a09b95;
    letter-spacing: 0;
  }
  .comparison .c-state-gloss {
    font-size: 13px;
    color: #c5c0ba;
    margin-bottom: 16px;
  }
  .comparison .c-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px 20px;
    padding-top: 14px;
    border-top: 1px solid #4a4640;
  }
  .comparison .c-item {
    font-size: 12.5px;
    line-height: 1.45;
  }
  .comparison .c-item .ci-label {
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #8a8378;
    margin-bottom: 4px;
    font-family: "SF Mono", "Monaco", "Courier New", monospace;
  }
  .comparison .c-item .ci-val {
    font-weight: 600;
    color: #fff;
    font-size: 13.5px;
  }
  .comparison .c-item .ci-val .zone-pill {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.03em;
    text-transform: uppercase;
  }

  .zone-pill.shak   { background: #a8c0d6; color: #1a3048; }
  .zone-pill.zann   { background: #e0c88a; color: #4a3a0a; }
  .zone-pill.yaqeen { background: #8ab88a; color: #1a3a1a; }
  .zone-pill.wahm   { background: #d68a8a; color: #4a1010; }

  /* ── Insight card ────────────────────────────── */
  .insight {
    background: #fff;
    border: 1px solid #e5e1d8;
    border-radius: 12px;
    padding: 20px 22px;
    margin-bottom: 18px;
    opacity: 0;
    animation: fadeUp 0.5s ease forwards;
    animation-delay: 1.5s;
  }
  .insight h3 {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 10px;
  }
  .insight p {
    font-size: 13.5px;
    line-height: 1.7;
    color: #4a4640;
    margin-bottom: 10px;
  }
  .insight p:last-child { margin-bottom: 0; }
  .insight strong { color: #1a1a1a; font-weight: 700; }
  .insight em { font-style: italic; color: #2a2622; }

  /* ── Raw runs details ───────────────────────── */
  details.raw-runs {
    background: #fff;
    border: 1px solid #e5e1d8;
    border-radius: 12px;
    margin-bottom: 18px;
    overflow: hidden;
    opacity: 0;
    animation: fadeUp 0.5s ease forwards;
    animation-delay: 1.7s;
  }
  details.raw-runs summary {
    padding: 15px 22px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    list-style: none;
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: #4a4640;
  }
  details.raw-runs summary::-webkit-details-marker { display: none; }
  details.raw-runs summary::after {
    content: "▾";
    color: #a09b95;
    transition: transform 0.2s;
  }
  details.raw-runs[open] summary::after { transform: rotate(180deg); }
  details.raw-runs .details-body {
    padding: 0 22px 20px;
    border-top: 1px solid #f0ece4;
    padding-top: 16px;
  }
  details.raw-runs .run-block { margin-bottom: 14px; }
  details.raw-runs .run-block:last-child { margin-bottom: 0; }
  details.raw-runs .run-block .rb-label {
    font-size: 10.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #a09b95;
    margin-bottom: 6px;
    font-family: "SF Mono", "Monaco", "Courier New", monospace;
  }
  details.raw-runs .run-block p {
    font-size: 13.5px;
    line-height: 1.65;
    color: #4a4640;
  }

  /* ── Buttons ─────────────────────────────────── */
  .btn-row {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
    margin-bottom: 16px;
    opacity: 0;
    animation: fadeUp 0.5s ease forwards;
    animation-delay: 1.9s;
  }
  .btn-row.immediate {
    opacity: 1;
    animation: none;
    margin-top: 4px;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: #1a1a1a;
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 13px 24px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.2s, transform 0.15s, opacity 0.2s;
  }
  .btn:hover { background: #333; transform: translateY(-1px); }
  .btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }
  .btn.ghost {
    background: transparent;
    color: #1a1a1a;
    border: 1.5px solid #d5d0ca;
  }
  .btn.ghost:hover { border-color: #1a1a1a; }

  /* ── Log table ───────────────────────────────── */
  .log-table {
    background: #fff;
    border: 1px solid #e5e1d8;
    border-radius: 12px;
    padding: 6px 0;
    margin-bottom: 20px;
    overflow: hidden;
  }
  .log-row {
    display: flex;
    justify-content: space-between;
    padding: 12px 22px;
    border-bottom: 1px solid #f0ece4;
    font-size: 13.5px;
    gap: 16px;
  }
  .log-row:last-child { border-bottom: none; }
  .log-row .k { color: #8a8378; flex-shrink: 0; }
  .log-row .v {
    font-weight: 600;
    text-align: right;
    font-family: "SF Mono", "Monaco", "Courier New", monospace;
    font-size: 12.5px;
  }

  .closing {
    background: #2a2622;
    color: #fff;
    border-radius: 12px;
    padding: 24px 26px;
    margin-bottom: 20px;
  }
  .closing h3 {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 12px;
  }
  .closing p {
    font-size: 13.5px;
    line-height: 1.7;
    color: #c5c0ba;
    margin-bottom: 10px;
  }
  .closing p:last-child { margin-bottom: 0; }
  .closing strong { color: #fff; }
  .closing em { font-style: italic; color: #e0ded8; }

  /* ── Session tally ───────────────────────────── */
  .tally-strip {
    display: flex;
    gap: 8px;
    margin-bottom: 22px;
    flex-wrap: wrap;
  }
  .tally-chip {
    font-size: 11px;
    padding: 5px 10px;
    border-radius: 6px;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    font-family: "SF Mono", "Monaco", "Courier New", monospace;
  }
  .tally-chip.shak   { background: #a8c0d6; color: #1a3048; }
  .tally-chip.zann   { background: #e0c88a; color: #4a3a0a; }
  .tally-chip.yaqeen { background: #8ab88a; color: #1a3a1a; }
  .tally-chip.wahm   { background: #d68a8a; color: #4a1010; }
  .tally-chip.empty  { background: #f0ece4; color: #a09b95; }
</style>
</head>
<body>

<div class="app">
  <div class="topbar">
    <span id="topLeft">Uni Cetavals</span>
    <span id="topRight">The Confidence Meter</span>
  </div>
  <div id="screen"></div>
</div>

<script>
/* ═══════════════════════════════════════════════════
   DATA — 8 scenarios, IIUM-contextualised
   ═══════════════════════════════════════════════════ */

const ZONES = [
  { key: "shak",   name: "Shak",   arabic: "شك",   gloss: "Doubt",       min: 0.00, max: 0.35 },
  { key: "zann",   name: "Zann",   arabic: "ظن",   gloss: "Conjecture",  min: 0.35, max: 0.55 },
  { key: "yaqeen", name: "Yaqeen", arabic: "يقين", gloss: "Certainty",   min: 0.55, max: 0.80 },
  { key: "wahm",   name: "Wahm",   arabic: "وهم",  gloss: "Illusion",    min: 0.80, max: 1.00 }
];

function zoneOf(pos) {
  for (const z of ZONES) if (pos >= z.min && pos < z.max) return z;
  return ZONES[ZONES.length - 1];
}

const DOMAINS = [
  {
    id: "halal",
    name: "Halal Food",
    icon: "☪",
    tagline: "A confident answer about halal certification.",
    prompt: "Is it permissible to eat at a restaurant that doesn't display a halal certificate?",
    run1: "Yes, you can eat there. In Malaysia, all restaurants are required by law to follow halal standards, so even without a certificate, the food is generally halal. The government inspects all food establishments regularly. Most Muslim scholars agree that if you don't see any haram ingredients, you can eat there.",
    run2: "This depends. Without a halal certificate, you should be cautious. Some restaurants may still serve halal food, but without certification there's no guarantee. Look for Muslim-owned establishments or ask about the ingredients directly.",
    run3: "Generally, no — you shouldn't assume it's halal. The halal certificate is the primary assurance in Malaysia. Without it, you can't be sure the meat is halal, the preparation is clean, or that there's no cross-contamination. Better to choose a certified place.",
    positions: [0.88, 0.45, 0.55],
    groundTruth: 0.45,
    state: "wahm",
    insight: "Run 1 invented legal facts to sound certain — there is no Malaysian law requiring all restaurants to be halal, and no scholarly consensus about eating at uncertified places. The model's own spread includes an overconfident outlier far from the grounded position. This is <em>wahm</em> — the illusion of certainty, in a single run."
  },
  {
    id: "zakat",
    name: "Zakat on Savings",
    icon: "۞",
    tagline: "A textbook answer about zakat calculation.",
    prompt: "How do I calculate zakat on my savings?",
    run1: "Zakat on savings is 2.5% of the total savings held for one lunar year (haul) that exceed the nisab threshold — equivalent to 85 grams of gold. If your savings exceed this amount for a full year, you pay 2.5% of the total.",
    run2: "Zakat on savings is 2.5% of savings held for one lunar year, provided they exceed nisab (85g gold or 595g silver). In Malaysia, most state zakat bodies use the gold nisab. You can check your state's zakat portal for the current value.",
    run3: "2.5% of qualifying savings after one haul, if above nisab. In Malaysia this is typically calculated by your state zakat body — PPZ for the Federal Territory, or your state's religious council. They publish the current nisab monthly.",

/* ═══════════════════════════════════════════════════
   STATE
   ═══════════════════════════════════════════════════ */

const S = {
  phase: "domain",      // domain | meter | log
  domainId: null,
  userPos: 0.5,
  hasDragged: false,
  revealed: false,
  dragging: false,
  log: []               // completed sessions
};

const screenEl = document.getElementById("screen");
const topLeft = document.getElementById("topLeft");
const topRight = document.getElementById("topRight");

/* ═══════════════════════════════════════════════════
   HELPERS
   ═══════════════════════════════════════════════════ */

function currentDomain() {
  return DOMAINS.find(d => d.id === S.domainId);
}

function el(tag, cls, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html !== undefined) e.innerHTML = html;
  return e;
}

function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

/* ═══════════════════════════════════════════════════
   RENDER DISPATCH
   ═══════════════════════════════════════════════════ */

function render() {
  screenEl.innerHTML = "";
  topLeft.textContent = "Uni Cetavals";
  topRight.textContent = "The Confidence Meter";

  switch (S.phase) {
    case "domain": renderDomain(); break;
    case "meter":  renderMeter();  break;
    case "log":    renderLog();    break;
  }

  window.scrollTo({ top: 0, behavior: "smooth" });
}

/* ── Domain picker ───────────────────────────── */
function renderDomain() {
  const wrap = el("div", "screen visible");

  wrap.appendChild(el("div", "kicker", "Step 1 · Choose a scenario"));
  wrap.appendChild(el("h1", null, "Pick a scenario to read."));
  wrap.appendChild(el("p", "sub",
    "Each scenario is a real question with one model answer. " +
    "You'll judge the answer's confidence on a spectrum — then see where the model's other runs land, and where the grounded position sits."
  ));

  // Session tally
  if (S.log.length > 0) {
    const tally = el("div", "tally-strip");
    const counts = { shak: 0, zann: 0, yaqeen: 0, wahm: 0 };
    S.log.forEach(l => counts[l.state]++);
    ["shak", "zann", "yaqeen", "wahm"].forEach(k => {
      const chip = el("div", "tally-chip " + k,
        ZONES.find(z => z.key === k).name + " · " + counts[k]);
      tally.appendChild(chip);
    });
    wrap.appendChild(tally);
  }

  const list = el("div", "domains");
  DOMAINS.forEach(d => {
    const card = el("button", "domain");
    card.innerHTML = `
      <div class="d-left">
        <div class="d-name">${esc(d.name)}</div>
        <div class="d-desc">${esc(d.tagline)}</div>
      </div>
      <div class="d-icon">${d.icon}</div>
    `;
    card.addEventListener("click", () => {
      S.domainId = d.id;
      S.phase = "meter";
      S.userPos = 0.5;
      S.hasDragged = false;
      S.revealed = false;
      S.dragging = false;
      render();
    });
    list.appendChild(card);
  });
  wrap.appendChild(list);

  screenEl.appendChild(wrap);
}

/* ── Meter screen ────────────────────────────── */
function renderMeter() {
  const d = currentDomain();
  const wrap = el("div", "screen visible");

  wrap.appendChild(el("div", "kicker", "Step 2 · Read & judge"));
  wrap.appendChild(el("h1", null, "Read this answer."));
  wrap.appendChild(el("p", "sub",
    "Then drag the slider below to place it on the confidence spectrum. Where does this answer sit?"
  ));

  // Query
  const qBox = el("div", "query-box");
  qBox.innerHTML = `
    <div class="q-label">The prompt</div>
    <div class="q-text">"${esc(d.prompt)}"</div>
  `;
  wrap.appendChild(qBox);

  // Answer
  const aBox = el("div", "answer-box");
  aBox.innerHTML = `
    <div class="a-label">Model response</div>
    <p>${esc(d.run1)}</p>
  `;
  wrap.appendChild(aBox);

  // Spectrum card
  const spectrumWrap = el("div", "spectrum-wrap");
  spectrumWrap.innerHTML = `
    <div class="spectrum-heading">Where does this answer sit?</div>
    <div class="spectrum-hint">Drag the marker along the spectrum. Release when you're happy.</div>
    <div class="spectrum ${S.revealed ? "revealed" : ""}" id="spectrum">
      <div class="zone-labels">
        ${ZONES.map(z => `
          <div class="zlabel ${z.key}">
            ${z.name}
            <span class="z-arabic">${z.arabic}</span>
          </div>
        `).join("")}
      </div>
      <div class="marker-layer" id="markerLayer"></div>
      <div class="track">
        <div class="zones">
          ${ZONES.map(z => `<div class="zone zone-${z.key}"></div>`).join("")}
        </div>
      </div>
      <div class="axis-labels">
        <span>Hedging too much</span>
        <span>About right</span>
        <span>Too sure of itself</span>
      </div>
    </div>
    ${!S.revealed ? `
      <div class="drag-hint" id="dragHint">
        <span class="dot-pulse"></span>
        <span>${S.hasDragged ? "Release to confirm" : "Drag to set your read"}</span>
      </div>
    ` : ``}
  `;
  wrap.appendChild(spectrumWrap);

  screenEl.appendChild(wrap);

  // ── Marker rendering ──────────────────────────
  const markerLayer = document.getElementById("markerLayer");
  renderMarkers(markerLayer);

  // ── Slider interaction (only if not yet revealed) ──
  if (!S.revealed) {
    setupSlider();
  }

  // ── Reveal content ────────────────────────────
  if (S.revealed) {
    const d = currentDomain();
    const userZone = zoneOf(S.userPos);
    const stateZone = ZONES.find(z => z.key === d.state);
    const gtZone = zoneOf(d.groundTruth);
    const run1Zone = zoneOf(d.positions[0]);

    // Comparison card
    const comparison = el("div", "comparison");
    comparison.innerHTML = `
      <div class="c-kicker">Your read vs. the model's spread</div>
      <div class="c-state">
        ${stateZone.name}
        <span class="c-arabic">${stateZone.arabic}</span>
      </div>
      <div class="c-state-gloss">${stateZone.gloss} — the state of this distribution</div>
      <div class="c-grid">
        <div class="c-item">
          <div class="ci-label">Your read of run 1</div>
          <div class="ci-val"><span class="zone-pill ${userZone.key}">${userZone.name}</span></div>
        </div>
        <div class="c-item">
          <div class="ci-label">Run 1 actually sits in</div>
          <div class="ci-val"><span class="zone-pill ${run1Zone.key}">${run1Zone.name}</span></div>
        </div>
        <div class="c-item">
          <div class="ci-label">Grounded position</div>
          <div class="ci-val"><span class="zone-pill ${gtZone.key}">${gtZone.name}</span></div>
        </div>
        <div class="c-item">
          <div class="ci-label">Model's spread</div>
          <div class="ci-val">3 runs · ${(Math.max(...d.positions) - Math.min(...d.positions)).toFixed(2)} wide</div>
        </div>
      </div>
    `;
    wrap.appendChild(comparison);

    // Insight
    const insight = el("div", "insight");
    insight.innerHTML = `
      <h3>What the spread shows</h3>
      <p>${d.insight}</p>
    `;
    wrap.appendChild(insight);

    // Raw runs (runs 2 and 3)
    const details = el("details", "raw-runs");
    details.innerHTML = `
      <summary>See the full text of runs 2 and 3</summary>
      <div class="details-body">
        <div class="run-block">
          <div class="rb-label">Run 2</div>
          <p>${esc(d.run2)}</p>
        </div>
        <div class="run-block">
          <div class="rb-label">Run 3</div>
          <p>${esc(d.run3)}</p>
        </div>
      </div>
    `;
    wrap.appendChild(details);

    // Action buttons
    const btnRow = el("div", "btn-row");
    const logBtn = el("button", "btn", "Log the result →");
    logBtn.addEventListener("click", () => {
      S.log.push({
        domain: d.name,
        state: d.state,
        userZone: userZone.key,
        userPos: S.userPos
      });
      S.phase = "log";
      render();
    });
    btnRow.appendChild(logBtn);

    const retryBtn = el("button", "btn ghost", "Try a different scenario");
    retryBtn.addEventListener("click", () => {
      S.phase = "domain";
      S.domainId = null;
      S.revealed = false;
      S.hasDragged = false;
      S.userPos = 0.5;
      render();
    });
    btnRow.appendChild(retryBtn);

    wrap.appendChild(btnRow);
  }

  screenEl.appendChild(wrap);

  // Re-setup slider after re-render
  if (!S.revealed) setupSlider();
}

/* ── Render markers on the spectrum ──────────── */
function renderMarkers(layer) {
  const d = currentDomain();

  // User marker (always visible)
  const userMarker = el("div", "user-marker");
  userMarker.id = "userMarker";
  userMarker.style.left = (S.userPos * 100) + "%";
  userMarker.innerHTML = `
    <div class="um-label">Your read</div>
    <div class="um-tri"></div>
    <div class="um-stem"></div>
  `;
  layer.appendChild(userMarker);

  // Revealed markers: model runs + ground truth
  if (S.revealed) {
    // Ground truth (behind dots)
    const truth = el("div", "truth-marker");
    truth.style.left = (d.groundTruth * 100) + "%";
    truth.innerHTML = `
      <div class="tm-label">Grounded</div>
      <div class="tm-line"></div>
    `;
    layer.appendChild(truth);

    // Model runs
    d.positions.forEach((pos, i) => {
      const mk = el("div", "model-marker");
      mk.style.left = (pos * 100) + "%";
      mk.style.animationDelay = (0.15 + i * 0.2) + "s";
      mk.innerHTML = `
        <div class="mm-dot">${i + 1}</div>
        <div class="mm-label">Run ${i + 1}</div>
      `;
      layer.appendChild(mk);
    });
  }
}

/* ── Slider setup ────────────────────────────── */
function setupSlider() {
  const spectrum = document.getElementById("spectrum");
  if (!spectrum) return;

  const updateFromClientX = (clientX) => {
    const rect = spectrum.getBoundingClientRect();
    let pct = (clientX - rect.left) / rect.width;
    pct = Math.max(0, Math.min(1, pct));
    S.userPos = pct;
    const um = document.getElementById("userMarker");
    if (um) um.style.left = (pct * 100) + "%";
  };

  const onPointerDown = (e) => {
    S.dragging = true;
    S.hasDragged = true;
    spectrum.setPointerCapture(e.pointerId);
    updateFromClientX(e.clientX);
  };

  const onPointerMove = (e) => {
    if (!S.dragging) return;
    updateFromClientX(e.clientX);
  };

  const onPointerUp = (e) => {
    if (!S.dragging) return;
    S.dragging = false;
    // On release: trigger the reveal
    if (S.hasDragged && !S.revealed) {
      setTimeout(() => {
        S.revealed = true;
        render();
      }, 250);
    }
  };

  spectrum.addEventListener("pointerdown", onPointerDown);
  spectrum.addEventListener("pointermove", onPointerMove);
  spectrum.addEventListener("pointerup", onPointerUp);
  spectrum.addEventListener("pointercancel", onPointerUp);
}

/* ── Log screen ──────────────────────────────── */
function renderLog() {
  const wrap = el("div", "screen visible");
  const last = S.log[S.log.length - 1];

  wrap.appendChild(el("div", "kicker", "Step 3 · Log"));
  wrap.appendChild(el("h1", null, "Logged."));
  wrap.appendChild(el("p", "sub",
    "This is what one meter reading looks like when the model is treated as a distribution, not a single answer."
  ));

  const stateZone = ZONES.find(z => z.key === last.state);
  const userZone = ZONES.find(z => z.key === last.userZone);

  const table = el("div", "log-table");
  [
    ["Scenario", last.domain],
    ["Your read of run 1", userZone.name + " (" + userZone.gloss + ")"],
    ["Model's state", stateZone.name + " (" + stateZone.gloss + ")"],
    ["Runs observed", "3"],
    ["Model", "Same model, same prompt"],
    ["Insight", "One run is a sample, not evidence"]
  ].forEach(([k, v]) => {
    const r = el("div", "log-row");
    r.innerHTML = `<span class="k">${esc(k)}</span><span class="v">${esc(v)}</span>`;
    table.appendChild(r);
  });
  wrap.appendChild(table);

  // Session summary
  if (S.log.length > 1) {
    const tally = el("div", "tally-strip");
    const counts = { shak: 0, zann: 0, yaqeen: 0, wahm: 0 };
    S.log.forEach(l => counts[l.state]++);
    ["shak", "zann", "yaqeen", "wahm"].forEach(k => {
      const chip = el("div", "tally-chip " + k,
        ZONES.find(z => z.key === k).name + " · " + counts[k]);
      tally.appendChild(chip);
    });
    wrap.appendChild(el("div", "kicker", "Session so far"));
    wrap.appendChild(tally);
  }

  const closing = el("div", "closing");
  closing.innerHTML = `
    <h3>What the meter taught you</h3>
    <p>
      You placed one answer on a spectrum. Then you watched the same model — same prompt —
      drop two more markers on the same bar. Sometimes they clustered where you placed the first one.
      Sometimes they scattered. And in every scenario, a grounded position appeared on the same bar.
    </p>
    <p>
      The four states aren't labels you apply to a single answer. They're names for the
      <em>shape of a distribution</em> — how tightly the runs cluster, and whether they cluster
      where the truth actually sits. <strong>Yaqeen</strong> is tight and grounded.
      <strong>Zann</strong> leans appropriately. <strong>Shak</strong> is honestly uncertain.
      <strong>Wahm</strong> is confident in the wrong place.
    </p>
    <p>
      <strong>One run is a sample. A sample of one is not evidence.</strong>
    </p>
  `;
  wrap.appendChild(closing);

  const btnRow = el("div", "btn-row immediate");
  const nextBtn = el("button", "btn", "Next scenario →");
  nextBtn.addEventListener("click", () => {
    S.phase = "domain";
    S.domainId = null;
    S.revealed = false;
    S.hasDragged = false;
    S.userPos = 0.5;
    render();
  });
  btnRow.appendChild(nextBtn);

  const resetBtn = el("button", "btn ghost", "Reset session");
  resetBtn.addEventListener("click", () => {
    S.log = [];
    S.phase = "domain";
    S.domainId = null;
    S.revealed = false;
    S.hasDragged = false;
    S.userPos = 0.5;
    render();
  });
  btnRow.appendChild(resetBtn);

  wrap.appendChild(btnRow);

  screenEl.appendChild(wrap);
  topRight.textContent = "Logged";
}

/* ═══════════════════════════════════════════════════
   INIT
   ═══════════════════════════════════════════════════ */

render();
</script>
