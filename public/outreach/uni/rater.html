<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CETALab Uni — Epistemic Awareness in Academic Sourcing</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f7f6f3;
    color: #1a1a1a;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 32px 20px 80px;
  }

  .app { width: 100%; max-width: 760px; }

  /* ── Top bar ─────────────────────────────────── */
  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    font-size: 12px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #8a8580;
  }

  .progress {
    display: flex;
    gap: 3px;
    margin-bottom: 36px;
  }
  .progress span {
    height: 3px;
    flex: 1;
    background: #e0ded8;
    border-radius: 2px;
    transition: background 0.4s;
  }
  .progress span.active { background: #1a1a1a; }
  .progress span.done   { background: #1a1a1a; }

  /* ── Screens ─────────────────────────────────── */
  .screen { display: none; animation: fadeUp 0.35s ease both; }
  .screen.visible { display: block; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ── Typography ──────────────────────────────── */
  .kicker {
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #8a8580;
    margin-bottom: 10px;
  }

  h1 { font-size: 25px; font-weight: 600; line-height: 1.3; margin-bottom: 8px; letter-spacing: -0.01em; }
  h2 { font-size: 18px; font-weight: 600; line-height: 1.35; margin-bottom: 10px; }

  .sub {
    font-size: 14.5px;
    color: #6b6660;
    line-height: 1.55;
    margin-bottom: 24px;
  }

  /* ── Intro screen ────────────────────────────── */
  .intro-card {
    background: #fff;
    border: 1px solid #e8e5df;
    border-radius: 16px;
    padding: 26px 28px;
    margin-bottom: 22px;
  }
  .intro-card h3 {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .intro-card h3 .ico {
    display: inline-flex;
    width: 26px; height: 26px;
    border-radius: 7px;
    background: #1a1a1a;
    color: #fff;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 700;
    flex-shrink: 0;
  }
  .intro-card ul {
    list-style: none;
    padding: 0;
    margin-bottom: 16px;
  }
  .intro-card li {
    font-size: 13.5px;
    line-height: 1.6;
    color: #4a4640;
    padding: 8px 0 8px 22px;
    position: relative;
    border-bottom: 1px solid #f0ede8;
  }
  .intro-card li:last-child { border-bottom: none; }
  .intro-card li::before {
    content: "→";
    position: absolute;
    left: 0;
    color: #a09b95;
    font-family: "SF Mono", monospace;
  }

  .intro-states {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 16px;
  }
  @media (max-width: 560px) {
    .intro-states { grid-template-columns: 1fr; }
  }
  .intro-state {
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid #e8e5df;
    background: #faf9f6;
  }
  .intro-state .is-name {
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 3px;
  }
  .intro-state.yaqeen .is-name { color: #2a5a2a; }
  .intro-state.zann   .is-name { color: #8a6510; }
  .intro-state.shak   .is-name { color: #3a5a7a; }
  .intro-state.wahm   .is-name { color: #7a2020; }
  .intro-state .is-desc {
    font-size: 12px;
    line-height: 1.5;
    color: #6b6660;
  }

  /* ── Scenario card ───────────────────────────── */
  .scenario {
    background: #fff;
    border: 1px solid #e8e5df;
    border-radius: 14px;
    padding: 22px 24px;
    margin-bottom: 14px;
  }
  .scenario .mode-chips {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 12px;
  }
  .scenario .mode-chip {
    font-size: 10.5px;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: #6b6660;
    background: #f0ede8;
    padding: 3px 9px;
    border-radius: 5px;
    font-weight: 600;
  }
  .scenario .mode-chip.primary {
    background: #1a1a1a;
    color: #fff;
  }
  .scenario p {
    font-size: 16px;
    line-height: 1.5;
    font-weight: 500;
    color: #1a1a1a;
  }

  /* ── Runs ────────────────────────────────────── */
  .runs {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 24px;
  }
  .run {
    background: #fff;
    border: 1px solid #e8e5df;
    border-radius: 12px;
    padding: 16px 18px;
  }
  .run .tag {
    font-size: 10.5px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #a09b95;
    margin-bottom: 7px;
    font-family: "SF Mono", monospace;
  }
  .run p {
    font-size: 14px;
    line-height: 1.6;
    color: #3a3632;
  }

  /* ── Options ─────────────────────────────────── */
  .opts {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
    margin-bottom: 24px;
  }
  @media (max-width: 560px) {
    .opts { grid-template-columns: 1fr; }
  }

  .opt {
    background: #fff;
    border: 1.5px solid #e0ded8;
    border-radius: 10px;
    padding: 14px 12px;
    cursor: pointer;
    font-size: 13.5px;
    font-weight: 500;
    color: #1a1a1a;
    font-family: inherit;
    text-align: center;
    transition: border-color 0.2s, background 0.2s, color 0.2s, transform 0.15s;
    line-height: 1.35;
  }
  .opt:hover { border-color: #b0aba5; transform: translateY(-1px); }
  .opt.selected {
    border-color: #1a1a1a;
    background: #1a1a1a;
    color: #fff;
  }

  /* ── Reveal ──────────────────────────────────── */
  .reveal {
    background: #1a1a1a;
    color: #fff;
    border-radius: 12px;
    padding: 20px 24px;
    margin-bottom: 22px;
    animation: fadeUp 0.3s ease both;
  }
  .reveal .rk {
    font-size: 10.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #a09b95;
    margin-bottom: 8px;
    font-family: "SF Mono", monospace;
  }
  .reveal p {
    font-size: 14px;
    line-height: 1.6;
    color: #d5d0ca;
  }
  .reveal strong { color: #fff; }

  /* ── States ──────────────────────────────────── */
  .states {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 22px;
    animation: fadeUp 0.3s ease both;
  }
  @media (max-width: 560px) {
    .states { grid-template-columns: 1fr; }
  }

  .state {
    background: #fff;
    border: 1.5px solid #e0ded8;
    border-radius: 12px;
    padding: 16px 18px;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s, color 0.2s, transform 0.15s;
    text-align: left;
    font-family: inherit;
  }
  .state:hover { border-color: #b0aba5; transform: translateY(-1px); }
  .state.selected {
    border-color: #1a1a1a;
    background: #1a1a1a;
    color: #fff;
  }
  .state .sn {
    font-size: 14.5px;
    font-weight: 600;
    margin-bottom: 2px;
  }
  .state .sa {
    font-size: 12px;
    color: #a09b95;
    margin-bottom: 6px;
    font-weight: 400;
  }
  .state .sd {
    font-size: 12.5px;
    line-height: 1.45;
    color: #8a8580;
  }
  .state.selected .sa,
  .state.selected .sd { color: #a09b95; }

  /* ── Feedback ────────────────────────────────── */
  .feedback {
    border-radius: 12px;
    padding: 20px 24px;
    margin-bottom: 22px;
    animation: fadeUp 0.3s ease both;
    font-size: 14px;
    line-height: 1.65;
  }
  .feedback.match {
    background: #eef5ee;
    border: 1px solid #cfe3cf;
    color: #2a4a2a;
  }
  .feedback.miss {
    background: #fdf3e7;
    border: 1px solid #f0dcc0;
    color: #5a4328;
  }
  .feedback .fb-head {
    font-size: 12px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    font-weight: 600;
    margin-bottom: 8px;
    opacity: 0.7;
  }
  .feedback strong { font-weight: 700; }

  /* ── Buttons ─────────────────────────────────── */
  .btn-row {
    display: flex;
    gap: 12px;
    align-items: center;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: #1a1a1a;
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 13px 26px;
    font-size: 14.5px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.2s, transform 0.15s, opacity 0.2s;
  }
  .btn:hover { background: #333; transform: translateY(-1px); }
  .btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }
  .btn.ghost {
    background: transparent;
    color: #1a1a1a;
    border: 1.5px solid #d5d0ca;
  }
  .btn.ghost:hover { border-color: #1a1a1a; }

  /* ── Summary ─────────────────────────────────── */
  .summary-grid {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 26px;
  }
  .sum-row {
    display: grid;
    grid-template-columns: 36px 1fr auto auto;
    gap: 12px;
    align-items: center;
    background: #fff;
    border: 1px solid #e8e5df;
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 13.5px;
  }
  .sum-row .num {
    font-size: 12px;
    color: #a09b95;
    font-weight: 600;
    font-family: "SF Mono", monospace;
  }
  .sum-row .mode-name {
    font-weight: 500;
    color: #3a3632;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .sum-row .chip {
    font-size: 11px;
    padding: 3px 9px;
    border-radius: 5px;
    background: #f0ede8;
    color: #6b6660;
    font-weight: 600;
    letter-spacing: 0.03em;
    white-space: nowrap;
  }
  .sum-row .chip.yaqeen { background: #dcecdc; color: #2a5a2a; }
  .sum-row .chip.zann   { background: #f0e6c8; color: #6a5010; }
  .sum-row .chip.shak   { background: #dce6f0; color: #2a4a6a; }
  .sum-row .chip.wahm   { background: #f0dcdc; color: #6a2a2a; }

  .tally {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-bottom: 26px;
  }
  @media (max-width: 560px) {
    .tally { grid-template-columns: 1fr 1fr; }
  }
  .tally-item {
    background: #fff;
    border: 1px solid #e8e5df;
    border-radius: 10px;
    padding: 14px;
    text-align: center;
  }
  .tally-item .tn {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 2px;
    font-family: "SF Mono", monospace;
  }
  .tally-item .tl {
    font-size: 11px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: #8a8580;
  }

  /* ── Category breakdown ──────────────────────── */
  .cat-breakdown {
    background: #fff;
    border: 1px solid #e8e5df;
    border-radius: 12px;
    padding: 18px 22px;
    margin-bottom: 24px;
  }
  .cat-breakdown h3 {
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 14px;
  }
  .cat-row {
    display: grid;
    grid-template-columns: 160px 1fr 60px;
    gap: 14px;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid #f0ede8;
    font-size: 13px;
  }
  .cat-row:last-child { border-bottom: none; }
  @media (max-width: 560px) {
    .cat-row { grid-template-columns: 1fr auto; gap: 8px; }
    .cat-row .cat-bar-wrap { grid-column: 1 / -1; }
  }
  .cat-name { color: #4a4640; font-weight: 500; }
  .cat-bar-wrap {
    height: 6px;
    background: #f0ede8;
    border-radius: 3px;
    overflow: hidden;
  }
  .cat-bar {
    height: 100%;
    background: #1a1a1a;
    border-radius: 3px;
    transition: width 0.6s cubic-bezier(0.34, 1.2, 0.64, 1);
  }
  .cat-count {
    font-size: 11.5px;
    color: #8a8580;
    font-family: "SF Mono", monospace;
    text-align: right;
    font-weight: 600;
  }

  /* ── Closing ─────────────────────────────────── */
  .closing {
    background: #1a1a1a;
    color: #fff;
    border-radius: 14px;
    padding: 26px 28px;
    margin-bottom: 24px;
  }
  .closing h3 {
    font-size: 17px;
    font-weight: 600;
    margin-bottom: 12px;
  }
  .closing p {
    font-size: 14px;
    line-height: 1.7;
    color: #c5c0ba;
    margin-bottom: 10px;
  }
  .closing p:last-child { margin-bottom: 0; }
  .closing strong { color: #fff; }
  .closing em { color: #e0ded8; font-style: italic; }
</style>
</head>
<body>

<div class="app">
  <div class="topbar">
    <span id="topLeft">CETALab Uni</span>
    <span id="topRight"></span>
  </div>
  <div class="progress" id="progress"></div>

  <div id="screen"></div>
</div>

<script>
/* ═══════════════════════════════════════════════════
   STATES — epistemic framework
   ═══════════════════════════════════════════════════ */

const STATES = {
  yaqeen: {
    name: "Yaqeen",
    arabic: "يقين",
    gloss: "Certainty",
    short: "Certainty",
    desc: "Stable, consistent runs. The output is firm and repeatable."
  },
  zann: {
    name: "Zann",
    arabic: "ظن",
    gloss: "Conjecture",
    short: "Conjecture",
    desc: "Runs lean the same way, with variation. The model reasons from partial knowledge."
  },
  shak: {
    name: "Shak",
    arabic: "شك",
    gloss: "Doubt",
    short: "Doubt",
    desc: "Runs disagree, and the model acknowledges uncertainty. Honest doubt."
  },
  wahm: {
    name: "Wahm",
    arabic: "وهم",
    gloss: "Illusion",
    short: "Illusion",
    desc: "Runs sound confident but cannot all be true. Certainty without grounding."
  }
};

/* ═══════════════════════════════════════════════════
   14 QUESTIONS — academic sourcing & source evaluation
   ═══════════════════════════════════════════════════ */

const QUESTIONS = [
  /* ── YAQEEN ──────────────────────────────────── */
  {
    mode: "Citation Standard",
    category: "Citation Format",
    prompt: "How do I cite a journal article in APA 7th edition?",
    runs: [
      "In APA 7th, a journal article citation follows: Author, A. A., & Author, B. B. (Year). Title of article. Title of Journal, volume(issue), page range. https://doi.org/xxxxx",
      "The APA 7th format for a journal article is: Author, A. A. (Year). Article title. Journal Name, volume(issue), pages. DOI or URL.",
      "APA 7th journal citation: Author, A. A., & Author, B. B. (Year). Title of article in sentence case. Title of Journal, volume(issue), page–page. https://doi.org/xxxxx"
    ],
    state: "yaqeen",
    why: "All three runs reproduce the same APA 7th structure. This is a documented, standardised reference style — the model has clear knowledge of it and the runs are stable. This is yaqeen: grounded certainty in a well-defined domain."
  },
  {
    mode: "Methodology",
    category: "Research Methods",
    prompt: "What is the difference between qualitative and quantitative research?",
    runs: [
      "Qualitative research explores meaning, experience, and context through non-numerical data like interviews and observations. Quantitative research tests hypotheses through numerical data and statistical analysis.",
      "Qualitative research focuses on understanding phenomena through words and meaning. Quantitative research uses numbers, measurable variables, and statistics to test hypotheses.",
      "Qualitative: interpretive, text-based, meaning-oriented. Quantitative: numerical, statistical, hypothesis-testing. The two differ in epistemology, data type, and analytical approach."
    ],
    state: "yaqeen",
    why: "All three runs give consistent, correct definitions. This is a foundational methodology distinction that appears in every research methods textbook. Stable and grounded — yaqeen."
  },

  /* ── ZANN ────────────────────────────────────── */
  {
    mode: "Database Selection",
    category: "Database Selection",
    prompt: "What's the best database for finding Islamic studies journal articles?",
    runs: [
      "For Islamic studies, try Index Islamicus first — it's the standard bibliographic database. Supplement with ATLA Religion Database and JSTOR. Brill's Islamic Reference Shelf is also useful. For Malaysian scholarship, check MyJurnal and IIUM's repository.",
      "Index Islamicus is the primary resource. For broader coverage, use ATLA Religion, JSTOR, and your university library's subject-specific databases. Scopus indexes some Islamic studies journals.",
      "The standard is Index Islamicus. Add ATLA Religion and JSTOR for broader context. For regional work, MyJurnal and university repositories like IIUM's are useful."
    ],
    state: "zann",
    why: "All three runs name similar databases with slightly different emphasis. The advice leans in a consistent direction — Index Islamicus is the anchor — but the supplementary recommendations vary. This is zann: reasoned conjecture based on general knowledge, not a fixed fact."
  },
  {
    mode: "Literature Search",
    category: "Search Strategy",
    prompt: "How do I find recent literature on AI in higher education?",
    runs: [
      "Use Scopus or Web of Science with keywords like 'generative AI' AND 'higher education'. Filter to 2020–2024. Also try Google Scholar for citation chaining and ERIC for education-specific results.",
      "Start with Google Scholar for a broad sweep, then narrow with Scopus or ERIC. Try keyword combinations like 'AI literacy' + 'university students'. Follow citations both forward and backward.",
      "Search Scopus and ERIC with terms like 'GenAI' or 'ChatGPT' AND 'higher education'. Limit to recent years. Use citation chaining from key papers to expand the set."
    ],
    state: "zann",
    why: "The runs agree on the general strategy — Scopus, ERIC, citation chaining — but vary in order and emphasis. This is a standard research skill, and the model leans in a consistent direction without declaring a single right answer. Zann."
  },
  {
    mode: "Source Evaluation",
    category: "Source Evaluation",
    prompt: "Is Wikipedia a reliable source for my academic paper?",
    runs: [
      "Wikipedia is not typically acceptable as a citable source for academic work. However, it can be useful as a starting point — check the references at the bottom of articles and follow them to primary sources.",
      "Generally not recommended for citation. Its open-edit model means accuracy varies. Use it for orientation only, then verify claims in peer-reviewed sources.",
      "For academic writing, Wikipedia shouldn't be cited directly. It's useful for an overview, but always trace claims back to primary or peer-reviewed sources before citing."
    ],
    state: "zann",
    why: "All three runs advise the same thing — don't cite Wikipedia directly, use it as a starting point. The nuance and emphasis vary, but the direction is consistent. This is zann: reasoned, appropriately hedged advice."
  },

  /* ── SHAK ────────────────────────────────────── */
  {
    mode: "Recent Publication",
    category: "Source Verification",
    prompt: "Find me a 2024 study on AI epistemic awareness in Malaysian universities.",
    runs: [
      "I'm not certain a specific 2024 study exists. I can suggest searching Scopus or MyJurnal for recent work by Malaysian scholars on this topic, but I can't confirm a 2024 publication.",
      "I can't verify whether a specific 2024 study exists. The topic is emerging, so there may be very recent publications. Search Scopus, ERIC, or IIUM's repository for current work.",
      "There may be recent work on this, but I can't confirm it. Try Google Scholar with a 2024 filter, or check MyJurnal and Scopus for Malaysian authors on this topic."
    ],
    state: "shak",
    why: "All three runs appropriately acknowledge that they cannot verify the existence of a specific recent publication. The model is honest about the limits of its knowledge. This is shak: appropriate doubt, especially for a question that requires live database access."
  },
  {
    mode: "Scholarly Consensus",
    category: "Consensus Reading",
    prompt: "Do scholars agree on the effectiveness of inquiry-based learning?",
    runs: [
      "There's broad support for inquiry-based learning in the literature, but it's not universal. Some studies show strong effects; others are mixed. It depends on implementation and context.",
      "Scholars generally support it, but there's debate about how effective it is across contexts. Some argue it works best with scaffolding; others question its universal applicability.",
      "This is contested. There's substantial research supporting it, but some scholars critique its effectiveness in certain settings. There is no universal consensus."
    ],
    state: "shak",
    why: "All three runs acknowledge genuine scholarly disagreement. The model doesn't declare a settled answer because there isn't one. This is shak: honest doubt about a genuinely contested question in education research."
  },
  {
    mode: "Journal Quality",
    category: "Journal Evaluation",
    prompt: "Is the journal 'International Journal of Advanced Research' reputable?",
    runs: [
      "I can't confirm this specific journal's status. 'International Journal of Advanced Research' is a common-sounding name, and some journals with similar names have been flagged as predatory. Verify via DOAJ, Scopus, or predatory journal watchlists.",
      "I'm not certain about this specific title. Many journals use similar names. Check whether it's indexed in Scopus, Web of Science, or DOAJ — and whether it appears on predatory journal lists.",
      "I can't verify this journal directly. To assess it, check if it's indexed in major databases (Scopus, WoS), whether it's in DOAJ, and whether it appears on watchlists."
    ],
    state: "shak",
    why: "All three runs appropriately decline to give a definitive answer and instead point to verification tools. The model knows it cannot reliably assess a specific journal's reputation. This is shak: the right epistemic stance for a question that requires external verification."
  },
  {
    mode: "Statistical Verification",
    category: "Source Verification",
    prompt: "Is it true that 70% of AI-generated citations are fabricated?",
    runs: [
      "I'm not aware of a specific study that establishes that exact figure. Some studies have found high rates of fabricated citations in certain contexts, but I can't confirm this specific percentage.",
      "I can't verify this specific statistic. There is research on AI hallucination rates, but the numbers vary by study and context. Check the original source before citing this.",
      "I can't confirm that exact figure. Studies exist on AI citation fabrication, but percentages vary widely depending on model, task, and evaluation method."
    ],
    state: "shak",
    why: "The model correctly refuses to confirm a specific statistic it cannot verify. All three runs acknowledge the limits of their knowledge. This is shak: honest doubt about a claim that requires a specific source — the right response from a responsible research assistant."
  },

  /* ── WAHM ────────────────────────────────────── */
  {
    mode: "Citation Retrieval",
    category: "Source Verification",
    prompt: "Give me the full citation for the study 'Epistemic Awareness in AI-Supported Learning' by Ahmad and colleagues, published in 2023.",
    runs: [
      "Ahmad, M., Hassan, N., & Ismail, S. (2023). Epistemic Awareness in AI-Supported Learning. Journal of Educational Technology & Society, 26(2), 145–162. https://doi.org/10.30191/ETS.202304_26(2).0011",
      "Here's the citation: Ahmad, M., Hassan, N., & Ismail, S. (2023). Epistemic awareness in AI-supported learning. Journal of Educational Technology & Society, 26(2), 145–162.",
      "Ahmad, M., et al. (2023). Epistemic Awareness in AI-Supported Learning. Journal of Educational Technology & Society, 26(2), 145–162."
    ],
    state: "wahm",
    why: "The model generated a full citation — authors, year, journal, volume, pages, and even a DOI — for a study that does not exist. All three runs fabricate the same citation, confidently. This is wahm at its most dangerous for academic work: a hallucinated source that looks entirely real and would pass a student's initial reading."
  },
  {
    mode: "Research Findings",
    category: "Source Verification",
    prompt: "What did the 2022 Nature study by Professor Lim find about AI in Malaysian classrooms?",
    runs: [
      "The 2022 Nature study by Professor Lim found that AI-assisted instruction improved student engagement by 34% and learning outcomes by 22% in Malaysian secondary schools.",
      "Professor Lim's 2022 Nature paper reported significant improvements — around 30% in engagement — from AI-assisted learning in Malaysian classrooms.",
      "Lim's 2022 Nature study found that AI tools improved engagement and learning outcomes in Malaysian classrooms, with effect sizes ranging from moderate to strong."
    ],
    state: "wahm",
    why: "There is no such study by 'Professor Lim' in Nature in 2022 about AI in Malaysian classrooms. All three runs fabricated details — percentages, effect sizes, findings — for a paper that doesn't exist. The confidence is real; the certainty is false. This is wahm, and the operational risk is severe: a student could cite this and destroy their academic credibility."
  },
  {
    mode: "Journal Evaluation",
    category: "Journal Evaluation",
    prompt: "Is the 'International Journal of Emerging Research and Innovation' a good journal to publish in?",
    runs: [
      "Yes, it's a reputable international journal indexed in major databases. It has a strong peer-review process and is widely cited in its field. A good choice for publication.",
      "It appears to be a legitimate international journal. Many researchers publish there. It's indexed and has a reasonable impact factor.",
      "Yes, it's a well-established journal in its field. It's a reasonable venue for publication, especially for emerging research areas."
    ],
    state: "wahm",
    why: "The model confidently recommends a journal it cannot verify — and the name pattern matches many predatory journals. In reality, the model has no way to assess this specific title, and its confident endorsement is fabricated. This is wahm: certainty without grounding, on a question with real consequences for a researcher's career."
  },
  {
    mode: "Quote Attribution",
    category: "Source Verification",
    prompt: "Did Einstein say 'The important thing is not to stop questioning'?",
    runs: [
      "Yes, Einstein said this. It's one of his most famous quotes, often cited in discussions of curiosity and lifelong learning. It appears in many collections of his writings.",
      "Yes, this is attributed to Einstein. He wrote it in a 1955 letter, and it's widely quoted in educational contexts.",
      "Yes, Einstein said this. The quote reflects his view that curiosity is central to scientific inquiry. It is frequently cited."
    ],
    state: "wahm",
    why: "The quote's origin is actually uncertain and it is often misattributed to Einstein. The model asserts it confidently and even invents a source — 'a 1955 letter' — to make the attribution look grounded. All three runs are confidently wrong. This is wahm: misattribution backed by fabricated provenance, a common trap in academic writing."
  }
];

/* ═══════════════════════════════════════════════════
   STATE
   ═══════════════════════════════════════════════════ */

let currentQ = 0;
let phase = "intro"; // intro | confidence | classify | feedback | summary
let answers = [];
let currentConfidence = null;
let currentClassification = null;

const screenEl = document.getElementById("screen");
const progressEl = document.getElementById("progress");
const topLeft = document.getElementById("topLeft");
const topRight = document.getElementById("topRight");

/* ═══════════════════════════════════════════════════
   RENDER
   ═══════════════════════════════════════════════════ */

function render() {
  renderProgress();
  screenEl.innerHTML = "";

  if (phase === "intro")     return renderIntro();
  if (phase === "summary")   return renderSummary();
  renderQuestion();
}

function renderProgress() {
  progressEl.innerHTML = "";
  if (phase === "intro") {
    topLeft.textContent = "CETALab Uni";
    topRight.textContent = "Introduction";
    return;
  }
  for (let i = 0; i < QUESTIONS.length; i++) {
    const s = document.createElement("span");
    if (i < currentQ) s.className = "done";
    else if (i === currentQ) s.className = "active";
    progressEl.appendChild(s);
  }
  topLeft.textContent = "CETALab Uni";
  topRight.textContent = `Question ${currentQ + 1} of ${QUESTIONS.length}`;
}

/* ── Intro ────────────────────────────────────── */
function renderIntro() {
  const wrap = document.createElement("div");
  wrap.className = "screen visible";

  wrap.innerHTML = `
    <div class="kicker">Epistemic Awareness · Academic Sourcing</div>
    <h1>Beyond AI Answers</h1>
    <p class="sub">
      A training module for higher education. You will read how an AI research assistant
      responds to real academic sourcing questions — and learn to distinguish four epistemic
      states in what it produces.
    </p>

    <div class="intro-card">
      <h3><span class="ico">1</span>What you will do</h3>
      <ul>
        <li>Read a sourcing or research question posed to an AI assistant.</li>
        <li>Read <strong>three separate responses</strong> — all from the same model, same prompt, run three times.</li>
        <li>Judge whether the confidence across the three responses differed.</li>
        <li>Then classify the whole set into one of four epistemic states.</li>
        <li>Read the explanation, then continue to the next question.</li>
      </ul>
    </div>

    <div class="intro-card">
      <h3><span class="ico">2</span>The four epistemic states</h3>
      <p style="font-size: 13.5px; color: #6b6660; line-height: 1.6; margin-bottom: 14px;">
        These terms come from the Islamic epistemological tradition. Each one describes a
        different relationship between the model's confidence and the grounding of its claims.
      </p>
      <div class="intro-states">
        <div class="intro-state yaqeen">
          <div class="is-name">Yaqeen · يقين · Certainty</div>
          <div class="is-desc">All runs are stable and grounded in well-established knowledge.</div>
        </div>
        <div class="intro-state zann">
          <div class="is-name">Zann · ظن · Conjecture</div>
          <div class="is-desc">Runs lean the same way, with variation. Reasoned from partial knowledge.</div>
        </div>
        <div class="intro-state shak">
          <div class="is-name">Shak · شك · Doubt</div>
          <div class="is-desc">Runs disagree, and the model admits it. Honest uncertainty.</div>
        </div>
        <div class="intro-state wahm">
          <div class="is-name">Wahm · وهم · Illusion</div>
          <div class="is-desc">Runs sound confident but cannot all be true. Certainty without grounding.</div>
        </div>
      </div>
    </div>

    <div class="intro-card">
      <h3><span class="ico">3</span>Why sourcing matters</h3>
      <p style="font-size: 13.5px; color: #4a4640; line-height: 1.7; margin-bottom: 0;">
        In academic work, the danger is not that AI is wrong — it is that AI is <em>confidently</em> wrong.
        A fabricated citation with a plausible DOI, a predatory journal endorsed as reputable,
        a misattributed quote with an invented source — these can slip past a reader who trusts
        fluent output. This module trains you to see the difference between <strong>sounding
        sure</strong> and <strong>being grounded</strong>.
      </p>
    </div>

    <div class="btn-row">
      <button class="btn" id="startBtn">Begin · ${QUESTIONS.length} questions</button>
    </div>
  `;

  screenEl.appendChild(wrap);
  wrap.querySelector("#startBtn").addEventListener("click", () => {
    currentQ = 0;
    phase = "confidence";
    answers = [];
    currentConfidence = null;
    currentClassification = null;
    render();
  });
}

/* ── Question ─────────────────────────────────── */
function renderQuestion() {
  const q = QUESTIONS[currentQ];
  const wrap = document.createElement("div");
  wrap.className = "screen visible";

  let html = `
    <div class="kicker">${q.mode}</div>
    <div class="scenario">
      <div class="mode-chips">
        <span class="mode-chip primary">${q.mode}</span>
        <span class="mode-chip">${q.category}</span>
      </div>
      <p>"${q.prompt}"</p>
    </div>
    <div class="runs">
  `;

  q.runs.forEach((r, i) => {
    const label = ["Response A", "Response B", "Response C"][i] || `Run ${i + 1}`;
    html += `
      <div class="run">
        <div class="tag">${label}</div>
        <p>${r}</p>
      </div>
    `;
  });

  html += `</div>`;

  if (phase === "confidence") {
    html += `
      <h2>Did their confidence differ?</h2>
      <p class="sub" style="margin-bottom:16px;">Pick one to continue.</p>
      <div class="opts" id="confOpts">
        <button class="opt" data-val="same">Same</button>
        <button class="opt" data-val="slightly">Slightly</button>
        <button class="opt" data-val="alot">A lot</button>
      </div>
    `;
  }

  if (phase === "classify" || phase === "feedback") {
    html += `
      <div class="reveal">
        <div class="rk">What you just read</div>
        <p><strong>Same model. Same prompt. Run three times.</strong> The differences you noticed are not differences between tools — they are the ordinary non-determinism of a single system. This is what an AI research assistant actually produces.</p>
      </div>
      <h2>Classify the set.</h2>
      <p class="sub" style="margin-bottom:16px;">Given all three runs together, which state describes this distribution?</p>
      <div class="states" id="stateOpts">
    `;

    Object.keys(STATES).forEach(key => {
      const s = STATES[key];
      html += `
        <button class="state" data-state="${key}">
          <div class="sn">${s.name} <span style="font-weight:400;color:#a09b95;">${s.arabic}</span></div>
          <div class="sa">${s.gloss}</div>
          <div class="sd">${s.desc}</div>
        </button>
      `;
    });

    html += `</div>`;
  }

  if (phase === "feedback") {
    const expected = STATES[q.state];
    const match = currentClassification === q.state;
    const userState = STATES[currentClassification];

    html += `
      <div class="feedback ${match ? "match" : "miss"}">
        <div class="fb-head">${match ? "Your read matches" : "The expected read"}</div>
        <p style="margin-bottom:8px;">
          You classified this as <strong>${userState.name}</strong>.
          ${match
            ? "That's the intended pattern."
            : `The clearest read is <strong>${expected.name} — ${expected.gloss}</strong>.`}
        </p>
        <p style="margin-bottom:0;">${q.why}</p>
      </div>
      <div class="btn-row">
        <button class="btn" id="nextBtn">
          ${currentQ < QUESTIONS.length - 1 ? "Next question →" : "See summary →"}
        </button>
      </div>
    `;
  }

  wrap.innerHTML = html;
  screenEl.appendChild(wrap);

  // Wire events
  if (phase === "confidence") {
    const opts = wrap.querySelectorAll("#confOpts .opt");
    opts.forEach(o => {
      o.addEventListener("click", () => {
        opts.forEach(x => x.classList.remove("selected"));
        o.classList.add("selected");
        currentConfidence = o.dataset.val;
        setTimeout(() => { phase = "classify"; render(); }, 220);
      });
    });
  }

  if (phase === "classify") {
    const cards = wrap.querySelectorAll("#stateOpts .state");
    cards.forEach(c => {
      c.addEventListener("click", () => {
        cards.forEach(x => x.classList.remove("selected"));
        c.classList.add("selected");
        currentClassification = c.dataset.state;
        answers[currentQ] = {
          confidence: currentConfidence,
          classification: currentClassification
        };
        setTimeout(() => { phase = "feedback"; render(); }, 220);
      });
    });
  }

  if (phase === "feedback") {
    const btn = wrap.querySelector("#nextBtn");
    if (btn) {
      btn.addEventListener("click", () => {
        if (currentQ < QUESTIONS.length - 1) {
          currentQ++;
          phase = "confidence";
          currentConfidence = null;
          currentClassification = null;
          render();
        } else {
          phase = "summary";
          render();
        }
      });
    }
  }

  window.scrollTo({ top: 0, behavior: "smooth" });
}

/* ── Summary ──────────────────────────────────── */
function renderSummary() {
  const wrap = document.createElement("div");
  wrap.className = "screen visible";

  const tally = { yaqeen: 0, zann: 0, shak: 0, wahm: 0 };
  answers.forEach(a => { if (a) tally[a.classification]++; });

  // Per-category accuracy
  const catStats = {};
  QUESTIONS.forEach((q, i) => {
    const a = answers[i];
    if (!a) return;
    const cat = q.category;
    if (!catStats[cat]) catStats[cat] = { correct: 0, total: 0 };
    catStats[cat].total++;
    if (a.classification === q.state) catStats[cat].correct++;
  });

  let html = `
    <div class="kicker">Summary · ${QUESTIONS.length} questions</div>
    <h1>You just read ${QUESTIONS.length} distributions.</h1>
    <p class="sub">
      Each question showed three responses from the same AI research assistant, same prompt. You
      classified the set — not any single answer. Here is what you found.
    </p>

    <div class="summary-grid">
  `;

  QUESTIONS.forEach((q, i) => {
    const a = answers[i] || {};
    const cls = a.classification || "—";
    const s = STATES[cls];
    const label = s ? s.short : "—";
    html += `
      <div class="sum-row">
        <span class="num">${String(i + 1).padStart(2, "0")}</span>
        <span class="mode-name">${q.mode} — ${truncate(q.prompt, 50)}</span>
        <span class="chip">${a.confidence || "—"}</span>
        <span class="chip ${cls}">${label}</span>
      </div>
    `;
  });

  html += `</div>`;

  // Tally
  html += `
    <h2>Your distribution</h2>
    <p class="sub" style="margin-bottom:14px;">How many of the ${QUESTIONS.length} you read as each state.</p>
    <div class="tally">
      <div class="tally-item"><div class="tn" style="color:#2a5a2a;">${tally.yaqeen}</div><div class="tl">Yaqeen</div></div>
      <div class="tally-item"><div class="tn" style="color:#8a6510;">${tally.zann}</div><div class="tl">Zann</div></div>
      <div class="tally-item"><div class="tn" style="color:#3a5a7a;">${tally.shak}</div><div class="tl">Shak</div></div>
      <div class="tally-item"><div class="tn" style="color:#7a2020;">${tally.wahm}</div><div class="tl">Wahm</div></div>
    </div>
  `;

  // Category breakdown
  const cats = Object.keys(catStats);
  if (cats.length > 0) {
    html += `
      <div class="cat-breakdown">
        <h3>Awareness by sourcing skill</h3>
    `;
    cats.forEach(cat => {
      const s = catStats[cat];
      const pct = Math.round((s.correct / s.total) * 100);
      html += `
        <div class="cat-row">
          <span class="cat-name">${cat}</span>
          <div class="cat-bar-wrap"><div class="cat-bar" style="width:${pct}%;"></div></div>
          <span class="cat-count">${s.correct}/${s.total}</span>
        </div>
      `;
    });
    html += `</div>`;
  }

  html += `
    <div class="closing">
      <h3>What this exercise was about</h3>
      <p>
        You did not judge an AI. You read its <strong>distribution</strong>. Every question showed the
        same model, the same prompt, run three times — and in every question, the runs varied.
      </p>
      <p>
        Sometimes they converged on a well-grounded answer (<em>yaqeen</em>). Sometimes they
        reasoned from partial knowledge (<em>zann</em>). Sometimes they disagreed and one
        admitted doubt (<em>shak</em>). And sometimes — the most dangerous case for academic
        work — they were confidently contradictory, or confidently fabricated
        (<em>wahm</em>): a hallucinated citation, an endorsed predatory journal, a
        misattributed quote with an invented source.
      </p>
      <p>
        The four states are properties of a <strong>set of runs</strong>, not of a single answer.
        You cannot see them if you look only once.
      </p>
      <p style="margin-bottom:0;">
        <strong>For academic sourcing, one AI answer is not evidence. It is a sample — and a
        sample of one tells you almost nothing about the distribution it came from.</strong>
      </p>
    </div>

    <div class="btn-row">
      <button class="btn ghost" id="restartBtn">Run it again</button>
    </div>
  `;

  wrap.innerHTML = html;
  screenEl.appendChild(wrap);

  topLeft.textContent = "CETALab Uni";
  topRight.textContent = "Summary";

  progressEl.innerHTML = "";
  for (let i = 0; i < QUESTIONS.length; i++) {
    const s = document.createElement("span");
    s.className = "done";
    progressEl.appendChild(s);
  }

  wrap.querySelector("#restartBtn").addEventListener("click", () => {
    currentQ = 0;
    phase = "intro";
    answers = [];
    currentConfidence = null;
    currentClassification = null;
    render();
  });

  window.scrollTo({ top: 0, behavior: "smooth" });
}

function truncate(str, n) {
  return str.length > n ? str.slice(0, n - 1) + "…" : str;
}

/* ═══════════════════════════════════════════════════
   INIT
   ═══════════════════════════════════════════════════ */

render();
</script>
</body>
</html>
