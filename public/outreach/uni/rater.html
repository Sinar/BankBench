<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CETALab Uni — Pilot Study · RKFF 0413</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f7f6f3; color: #1a1a1a;
    min-height: 100vh; display: flex; justify-content: center;
    padding: 32px 20px 80px;
    -webkit-font-smoothing: antialiased;
  }
  .app { width: 100%; max-width: 780px; }

  .topbar {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 10px;
    font-size: 11.5px; letter-spacing: 0.06em; text-transform: uppercase;
    color: #8a8580;
  }
  .progress { display: flex; gap: 3px; margin-bottom: 36px; }
  .progress span {
    height: 3px; flex: 1; background: #e0ded8;
    border-radius: 2px; transition: background 0.4s;
  }
  .progress span.active { background: #1a1a1a; }
  .progress span.done   { background: #1a1a1a; }

  .screen { display: none; animation: fadeUp 0.35s ease both; }
  .screen.visible { display: block; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .kicker {
    font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
    color: #8a8580; margin-bottom: 10px;
  }
  h1 { font-size: 25px; font-weight: 600; line-height: 1.3; margin-bottom: 8px; letter-spacing: -0.01em; }
  h2 { font-size: 18px; font-weight: 600; line-height: 1.35; margin-bottom: 10px; }
  h3 { font-size: 15px; font-weight: 600; margin-bottom: 10px; }
  .sub { font-size: 14.5px; color: #6b6660; line-height: 1.55; margin-bottom: 24px; }

  .card {
    background: #fff; border: 1px solid #e8e5df; border-radius: 16px;
    padding: 26px 28px; margin-bottom: 18px;
  }
  .card.tight { padding: 22px 24px; }
  .card h3 {
    font-size: 15px; font-weight: 600; margin-bottom: 12px;
    display: flex; align-items: center; gap: 10px;
  }
  .card h3 .ico {
    display: inline-flex; width: 26px; height: 26px;
    border-radius: 7px; background: #1a1a1a; color: #fff;
    align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700; flex-shrink: 0;
    font-family: "SF Mono", monospace;
  }
  .card p { font-size: 13.5px; line-height: 1.7; color: #4a4640; }
  .card p:last-child { margin-bottom: 0; }
  .card ul { list-style: none; padding: 0; }
  .card li {
    font-size: 13.5px; line-height: 1.6; color: #4a4640;
    padding: 8px 0 8px 22px; position: relative;
    border-bottom: 1px solid #f0ede8;
  }
  .card li:last-child { border-bottom: none; }
  .card li::before {
    content: "→"; position: absolute; left: 0;
    color: #a09b95; font-family: "SF Mono", monospace;
  }

  .study-banner {
    background: linear-gradient(135deg, #1a3a5a 0%, #2a4a6a 100%);
    color: #fff; border-radius: 14px;
    padding: 18px 22px; margin-bottom: 20px;
    display: flex; gap: 14px; align-items: flex-start;
  }
  .study-banner .sb-icon { font-size: 20px; flex-shrink: 0; line-height: 1; margin-top: 2px; }
  .study-banner .sb-body { font-size: 13px; line-height: 1.6; color: #d8e2ec; }
  .study-banner strong { color: #fff; }
  .study-banner .sb-id {
    display: inline-block; font-family: "SF Mono", monospace;
    font-size: 11.5px; background: rgba(255,255,255,0.15);
    padding: 3px 9px; border-radius: 5px;
    letter-spacing: 0.04em; margin-top: 8px; color: #fff;
  }

  .survey-item {
    padding: 18px 0; border-bottom: 1px solid #f0ede8;
  }
  .survey-item:last-child { border-bottom: none; padding-bottom: 0; }
  .survey-item:first-child { padding-top: 0; }

  .si-q {
    font-size: 14px; font-weight: 500;
    line-height: 1.55; color: #1a1a1a; margin-bottom: 12px;
  }
  .si-q .si-num {
    font-family: "SF Mono", monospace;
    color: #a09b95; font-weight: 700;
    margin-right: 8px; font-size: 12px;
  }

  .likert {
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px;
  }
  .likert-opt {
    display: flex; flex-direction: column;
    align-items: center; gap: 6px;
    padding: 10px 4px; background: #faf9f6;
    border: 1.5px solid #e8e5df; border-radius: 9px;
    cursor: pointer; font-family: inherit;
    transition: border-color 0.15s, background 0.15s, transform 0.15s;
  }
  .likert-opt:hover { border-color: #b0aba5; transform: translateY(-1px); }
  .likert-opt.selected { border-color: #1a1a1a; background: #1a1a1a; color: #fff; }
  .likert-opt .lo-dot {
    width: 12px; height: 12px; border-radius: 50%;
    border: 1.5px solid #b0aba5; transition: all 0.15s;
  }
  .likert-opt.selected .lo-dot { background: #fff; border-color: #fff; }
  .likert-opt .lo-num { font-size: 13px; font-weight: 700; font-family: "SF Mono", monospace; }
  .likert-opt .lo-lbl {
    font-size: 9.5px; line-height: 1.25; text-align: center;
    color: #8a8580; letter-spacing: 0.02em; min-height: 24px;
    display: flex; align-items: center;
  }
  .likert-opt.selected .lo-lbl { color: #c5c0ba; }

  .mcq { display: flex; flex-direction: column; gap: 8px; }
  .mcq-opt {
    background: #faf9f6; border: 1.5px solid #e8e5df;
    border-radius: 10px; padding: 12px 16px;
    cursor: pointer; text-align: left;
    font-family: inherit; font-size: 13.5px;
    line-height: 1.5; color: #1a1a1a;
    transition: border-color 0.15s, background 0.15s, transform 0.15s;
    display: flex; align-items: flex-start; gap: 10px;
  }
  .mcq-opt:hover { border-color: #b0aba5; transform: translateY(-1px); }
  .mcq-opt.selected { border-color: #1a1a1a; background: #1a1a1a; color: #fff; }
  .mcq-opt .mo-key {
    font-family: "SF Mono", monospace;
    font-weight: 700; font-size: 11.5px;
    color: #a09b95; flex-shrink: 0; min-width: 16px;
  }
  .mcq-opt.selected .mo-key { color: #c5c0ba; }

  .open-text {
    width: 100%; min-height: 80px;
    padding: 12px 14px; background: #faf9f6;
    border: 1.5px solid #e8e5df; border-radius: 10px;
    font-family: inherit; font-size: 13.5px;
    line-height: 1.55; color: #1a1a1a;
    resize: vertical; transition: border-color 0.15s;
  }
  .open-text:focus { outline: none; border-color: #1a1a1a; background: #fff; }

  .intro-card {
    background: #fff; border: 1px solid #e8e5df; border-radius: 16px;
    padding: 26px 28px; margin-bottom: 18px;
  }
  .intro-card h3 {
    font-size: 15px; font-weight: 600; margin-bottom: 12px;
    display: flex; align-items: center; gap: 10px;
  }
  .intro-card h3 .ico {
    display: inline-flex; width: 26px; height: 26px;
    border-radius: 7px; background: #1a1a1a; color: #fff;
    align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700; flex-shrink: 0;
    font-family: "SF Mono", monospace;
  }
  .intro-card ul { list-style: none; padding: 0; margin-bottom: 4px; }
  .intro-card li {
    font-size: 13.5px; line-height: 1.6; color: #4a4640;
    padding: 8px 0 8px 22px; position: relative;
    border-bottom: 1px solid #f0ede8;
  }
  .intro-card li:last-child { border-bottom: none; }
  .intro-card li::before {
    content: "→"; position: absolute; left: 0;
    color: #a09b95; font-family: "SF Mono", monospace;
  }
  .intro-card p { font-size: 13.5px; line-height: 1.7; color: #4a4640; }
  .intro-card p:last-child { margin-bottom: 0; }

  .models-grid {
    display: grid; grid-template-columns: repeat(2, 1fr);
    gap: 10px; margin-top: 14px;
  }
  @media (max-width: 560px) { .models-grid { grid-template-columns: 1fr; } }
  .model-vendor {
    background: #faf9f6; border: 1px solid #ebe8e2;
    border-radius: 10px; padding: 12px 14px;
  }
  .model-vendor .mv-name {
    font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
    color: #8a8580; font-weight: 700; margin-bottom: 8px;
    font-family: "SF Mono", monospace;
  }
  .model-vendor .mv-item {
    font-size: 12.5px; line-height: 1.5; color: #1a1a1a;
    font-family: "SF Mono", monospace; padding: 2px 0;
    word-break: break-all;
  }

  .intro-states {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px;
  }
  @media (max-width: 560px) { .intro-states { grid-template-columns: 1fr; } }
  .intro-state {
    padding: 12px 14px; border-radius: 10px;
    border: 1px solid #e8e5df; background: #faf9f6;
  }
  .intro-state .is-name {
    font-size: 13px; font-weight: 700; margin-bottom: 3px;
    display: flex; align-items: baseline; gap: 6px;
  }
  .intro-state .is-arabic { font-size: 12px; font-weight: 400; color: #a09b95; }
  .intro-state.yaqeen .is-name { color: #2a5a2a; }
  .intro-state.zann   .is-name { color: #8a6510; }
  .intro-state.shak   .is-name { color: #3a5a7a; }
  .intro-state.wahm   .is-name { color: #7a2020; }
  .intro-state .is-desc { font-size: 12px; line-height: 1.5; color: #6b6660; }

  .assign-map {
    background: #fff; border: 1px solid #e8e5df; border-radius: 14px;
    padding: 20px 24px; margin-bottom: 18px;
  }
  .assign-map h4 {
    font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase;
    color: #8a8580; margin-bottom: 12px; font-weight: 700;
  }
  .assign-row {
    display: grid; grid-template-columns: 90px 1fr; gap: 14px;
    padding: 9px 0; border-bottom: 1px solid #f0ede8;
    align-items: baseline; font-size: 13px;
  }
  .assign-row:last-child { border-bottom: none; }
  .assign-tag {
    font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase;
    font-weight: 700; padding: 3px 8px; border-radius: 5px;
    text-align: center; font-family: "SF Mono", monospace;
  }
  .assign-tag.aqidah   { background: #e6ecf5; color: #2a3a6a; }
  .assign-tag.shariah  { background: #f0e6d4; color: #6a4a10; }
  .assign-topics { color: #4a4640; line-height: 1.55; font-size: 12.5px; }

  .scenario {
    background: #fff; border: 1px solid #e8e5df; border-radius: 14px;
    padding: 22px 24px; margin-bottom: 14px;
  }
  .scenario .mode-chips {
    display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px;
  }
  .scenario .mode-chip {
    font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase;
    color: #6b6660; background: #f0ede8; padding: 3px 9px;
    border-radius: 5px; font-weight: 600;
  }
  .scenario .mode-chip.primary { background: #1a1a1a; color: #fff; }
  .scenario .mode-chip.aqidah  { background: #e6ecf5; color: #2a3a6a; }
  .scenario .mode-chip.shariah { background: #f0e6d4; color: #6a4a10; }
  .scenario .q-label {
    font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase;
    color: #a09b95; margin-bottom: 6px;
  }
  .scenario p { font-size: 16px; line-height: 1.5; font-weight: 500; color: #1a1a1a; }

  .sysprompt-box {
    background: #faf9f6; border: 1px solid #e8e5df;
    border-radius: 10px; margin-bottom: 14px; overflow: hidden;
  }
  .sysprompt-box summary {
    padding: 12px 18px; cursor: pointer;
    font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
    color: #8a8580; font-weight: 700; list-style: none;
    display: flex; justify-content: space-between; align-items: center;
    font-family: "SF Mono", monospace;
  }
  .sysprompt-box summary::-webkit-details-marker { display: none; }
  .sysprompt-box summary::after {
    content: "▾"; color: #a09b95; font-size: 12px;
    transition: transform 0.2s;
  }
  .sysprompt-box[open] summary::after { transform: rotate(180deg); }
  .sysprompt-box .sp-body {
    padding: 14px 18px 18px; border-top: 1px solid #f0ede8; background: #fff;
  }
  .sysprompt-box .sp-body .sp-text {
    font-family: "SF Mono", "Monaco", monospace;
    font-size: 11.5px; line-height: 1.7; color: #4a4640;
    background: #faf9f6; padding: 12px 14px; border-radius: 8px;
    border-left: 3px solid #a09b95;
    white-space: pre-wrap; word-break: break-word;
  }
  .sysprompt-box .sp-body .sp-note {
    font-size: 11.5px; line-height: 1.6; color: #8a8580;
    margin-top: 10px; font-style: italic;
  }

  .runs { display: flex; flex-direction: column; gap: 10px; margin-bottom: 24px; }
  .run {
    background: #fff; border: 1px solid #e8e5df; border-radius: 12px;
    padding: 16px 18px;
  }
  .run .tag {
    font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase;
    color: #a09b95; margin-bottom: 7px;
    font-family: "SF Mono", monospace;
  }
  .run p {
    font-size: 14px; line-height: 1.6; color: #3a3632;
    white-space: pre-wrap; word-wrap: break-word;
  }

  .opts {
    display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px;
    margin-bottom: 24px;
  }
  @media (max-width: 560px) { .opts { grid-template-columns: 1fr; } }
  .opt {
    background: #fff; border: 1.5px solid #e0ded8; border-radius: 10px;
    padding: 14px 12px; cursor: pointer;
    font-size: 13.5px; font-weight: 500; color: #1a1a1a;
    font-family: inherit; text-align: center;
    transition: border-color 0.2s, background 0.2s, color 0.2s, transform 0.15s;
    line-height: 1.35;
  }
  .opt:hover { border-color: #b0aba5; transform: translateY(-1px); }
  .opt.selected { border-color: #1a1a1a; background: #1a1a1a; color: #fff; }

  .reveal {
    background: #1a1a1a; color: #fff; border-radius: 12px;
    padding: 20px 24px; margin-bottom: 22px;
    animation: fadeUp 0.3s ease both;
  }
  .reveal .rk {
    font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase;
    color: #a09b95; margin-bottom: 8px;
    font-family: "SF Mono", monospace;
  }
  .reveal p { font-size: 14px; line-height: 1.6; color: #d5d0ca; }
  .reveal strong { color: #fff; }

  .states {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
    margin-bottom: 22px; animation: fadeUp 0.3s ease both;
  }
  @media (max-width: 560px) { .states { grid-template-columns: 1fr; } }
  .state {
    background: #fff; border: 1.5px solid #e0ded8; border-radius: 12px;
    padding: 16px 18px; cursor: pointer;
    transition: border-color 0.2s, background 0.2s, color 0.2s, transform 0.15s;
    text-align: left; font-family: inherit;
  }
  .state:hover { border-color: #b0aba5; transform: translateY(-1px); }
  .state.selected { border-color: #1a1a1a; background: #1a1a1a; color: #fff; }
  .state .sn { font-size: 14.5px; font-weight: 600; margin-bottom: 2px; }
  .state .sa { font-size: 12px; color: #a09b95; margin-bottom: 6px; font-weight: 400; }
  .state .sd { font-size: 12.5px; line-height: 1.45; color: #8a8580; }
  .state.selected .sa, .state.selected .sd { color: #a09b95; }

  .feedback {
    border-radius: 12px; padding: 20px 24px; margin-bottom: 18px;
    animation: fadeUp 0.3s ease both;
    font-size: 14px; line-height: 1.65;
  }
  .feedback.match { background: #eef5ee; border: 1px solid #cfe3cf; color: #2a4a2a; }
  .feedback.miss  { background: #fdf3e7; border: 1px solid #f0dcc0; color: #5a4328; }
  .feedback .fb-head {
    font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase;
    font-weight: 600; margin-bottom: 8px; opacity: 0.7;
  }
  .feedback strong { font-weight: 700; }
  .feedback .fb-assign {
    display: block; margin-top: 12px; padding-top: 12px;
    border-top: 1px dashed rgba(0,0,0,0.12);
    font-size: 13px; line-height: 1.6;
  }
  .feedback .fb-assign .fba-label {
    font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase;
    font-weight: 700; opacity: 0.65; margin-bottom: 4px; display: block;
    font-family: "SF Mono", monospace;
  }

  .model-reveal {
    background: #f0ede8; border-radius: 12px; padding: 18px 22px;
    margin-bottom: 22px;
    animation: fadeUp 0.3s ease both;
    animation-delay: 0.1s;
  }
  .model-reveal .mr-label {
    font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
    color: #8a8580; margin-bottom: 6px;
    font-family: "SF Mono", monospace; font-weight: 700;
  }
  .model-reveal .mr-name {
    font-size: 15px; font-weight: 700;
    font-family: "SF Mono", monospace; color: #1a1a1a;
    margin-bottom: 10px; word-break: break-all;
  }
  .model-reveal .mr-note { font-size: 13px; line-height: 1.6; color: #4a4640; }

  .btn-row {
    display: flex; gap: 12px; align-items: center;
    margin-bottom: 16px; flex-wrap: wrap;
  }
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    background: #1a1a1a; color: #fff; border: none; border-radius: 10px;
    padding: 13px 26px; font-size: 14.5px; font-weight: 600;
    cursor: pointer; font-family: inherit;
    transition: background 0.2s, transform 0.15s, opacity 0.2s;
  }
  .btn:hover { background: #333; transform: translateY(-1px); }
  .btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }
  .btn.ghost {
    background: transparent; color: #1a1a1a; border: 1.5px solid #d5d0ca;
  }
  .btn.ghost:hover { border-color: #1a1a1a; }

  .summary-grid {
    display: flex; flex-direction: column; gap: 8px; margin-bottom: 26px;
  }
  .sum-row {
    display: grid; grid-template-columns: 34px 1fr auto; gap: 12px;
    align-items: center; background: #fff;
    border: 1px solid #e8e5df; border-radius: 10px;
    padding: 12px 16px; font-size: 13.5px;
  }
  .sum-row .num {
    font-size: 12px; color: #a09b95; font-weight: 600;
    font-family: "SF Mono", monospace;
  }
  .sum-row .sum-body { min-width: 0; }
  .sum-row .sum-topic {
    font-weight: 600; color: #1a1a1a; font-size: 13.5px; margin-bottom: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .sum-row .sum-meta {
    font-size: 11px; color: #8a8580; letter-spacing: 0.02em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .sum-row .sum-model {
    font-family: "SF Mono", monospace; color: #6b6660; font-size: 10.5px;
  }
  .sum-row .chip {
    font-size: 11px; padding: 3px 10px; border-radius: 5px;
    background: #f0ede8; color: #6b6660;
    font-weight: 700; letter-spacing: 0.04em; white-space: nowrap;
    text-transform: uppercase; font-family: "SF Mono", monospace;
  }
  .sum-row .chip.yaqeen { background: #dcecdc; color: #2a5a2a; }
  .sum-row .chip.zann   { background: #f0e6c8; color: #6a5010; }
  .sum-row .chip.shak   { background: #dce6f0; color: #2a4a6a; }
  .sum-row .chip.wahm   { background: #f0dcdc; color: #6a2a2a; }

  .tally {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
    margin-bottom: 26px;
  }
  @media (max-width: 560px) { .tally { grid-template-columns: 1fr 1fr; } }
  .tally-item {
    background: #fff; border: 1px solid #e8e5df; border-radius: 10px;
    padding: 14px; text-align: center;
  }
  .tally-item .tn {
    font-size: 22px; font-weight: 700; margin-bottom: 2px;
    font-family: "SF Mono", monospace;
  }
  .tally-item .tl {
    font-size: 10.5px; letter-spacing: 0.05em; text-transform: uppercase;
    color: #8a8580; font-weight: 600;
  }

  /* ── Proximity / closeness scoring ───────────── */
  .prox-row {
    display: grid;
    grid-template-columns: 30px 1fr 100px 70px 80px;
    gap: 10px; align-items: center;
    padding: 12px 0; border-bottom: 1px solid #f0ede8;
    font-size: 13px;
  }
  .prox-row:last-child { border-bottom: none; }
  .prox-row .pr-num {
    font-family: "SF Mono", monospace;
    font-size: 11px; color: #a09b95; font-weight: 700;
  }
  .prox-row .pr-topic {
    min-width: 0;
  }
  .prox-row .pr-topic .pr-name {
    font-weight: 600; color: #1a1a1a;
    font-size: 13px; margin-bottom: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .prox-row .pr-topic .pr-model {
    font-family: "SF Mono", monospace;
    font-size: 10px; color: #8a8580;
  }
  .prox-row .pr-user, .prox-row .pr-expected {

const STORAGE_KEY = "cetavals_study_v1";

function generateParticipantId() {
  const now = new Date();
  const y = now.getFullYear();
  const m = String(now.getMonth() + 1).padStart(2, "0");
  const d = String(now.getDate()).padStart(2, "0");
  const hex = Math.floor(Math.random() * 65536).toString(16).toUpperCase().padStart(4, "0");
  return `UIA-${y}${m}${d}-${hex}`;
}
function loadStudy() {
  try { const raw = localStorage.getItem(STORAGE_KEY); if (raw) return JSON.parse(raw); } catch (e) {}
  return null;
}
function saveStudy() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(study)); } catch (e) {}
}

let study = loadStudy() || {
  participantId: generateParticipantId(),
  startedAt: new Date().toISOString(),
  pre: {},
  module: { answers: [], tally: { yaqeen: 0, zann: 0, shak: 0, wahm: 0 }, correctCount: 0 },

};

function render() {
  renderProgress();
  screenEl.innerHTML = "";

  const prevQ = lastRenderedQ;
  const prevPhase = lastRenderedPhase;

  switch (phase) {
    case "consent":  renderConsent();  break;
    case "pre":      renderPre();      break;
    case "intro":    renderIntro();    break;
    case "confidence":
    case "classify":
    case "feedback": renderQuestion(); break;
    case "summary":  renderSummary();  break;
    case "post":     renderPost();     break;
    case "results":  renderResults();  break;
    case "thanks":   renderThanks();   break;
  }

  lastRenderedQ = currentQ;
  lastRenderedPhase = phase;

  const phaseChanged = prevPhase !== phase;
  const questionChanged = currentQ !== prevQ;

  if (["intro","summary","pre","post","results","thanks","consent"].includes(phase)) {
    window.scrollTo({ top: 0, behavior: "auto" });
  } else if (questionChanged) {
    requestAnimationFrame(() => {
      const el = document.querySelector(".scenario");
      if (el) {
        const y = el.getBoundingClientRect().top + window.pageYOffset - 24;
        window.scrollTo({ top: Math.max(0, y), behavior: "auto" });
      }
    });
  } else if (phaseChanged && phase === "feedback") {
    requestAnimationFrame(() => {
      const el = document.querySelector(".feedback");
      if (el) {
        const y = el.getBoundingClientRect().top + window.pageYOffset - 24;
        window.scrollTo({ top: Math.max(0, y), behavior: "smooth" });
      }
    });
  }
}

function renderProgress() {
  progressEl.innerHTML = "";
  topLeft.textContent = "CETALab Uni · RKFF 0413";
  if (!PHASES_WITH_PROGRESS.includes(phase)) {
    topRight.textContent = study.participantId;
    return;
  }
  for (let i = 0; i < QUESTIONS.length; i++) {
    const s = document.createElement("span");
    if (i < currentQ) s.className = "done";
    else if (i === currentQ) s.className = "active";
    progressEl.appendChild(s);
  }
  topRight.textContent = `Q${currentQ + 1} / ${QUESTIONS.length}`;
}

      });
      html += `</div>`;
    } else {
      html += `<div class="mcq" data-qid="${item.id}">`;
      item.options.forEach((opt, i) => {
        const key = String.fromCharCode(65 + i);
        const sel = val === opt.k ? " selected" : "";

  const update = () => {
    const answered = PRE_QUESTIONS.every(q => study.pre[q.id] !== undefined);

  wrap.querySelectorAll(".likert-opt").forEach(btn => {

      </div>
      <h2>Classify the set.</h2>
      <p class="sub" style="margin-bottom:16px;">Given all three runs together, which state describes this distribution?</p>
      <div class="states" id="stateOpts">
    `;
    Object.keys(STATES).forEach(key => {
      const s = STATES[key];
      html += `<button class="state" data-state="${key}">
        <div class="sn">${s.name} <span style="font-weight:400;color:#a09b95;">${s.arabic}</span></div>
        <div class="sa">${s.gloss}</div>
        <div class="sd">${s.desc}</div>
      </button>`;
    });
    html += `</div>`;
  }

  if (phase === "feedback") {
    const expected = STATES[q.state];
    const match = currentClassification === q.state;
    const userState = STATES[currentClassification];
    const dist = PROXIMITY[currentClassification][q.state];
    const verdict = proximityLabel(dist);

    html += `
      <div class="feedback ${match ? "match" : "miss"}">
        <div class="fb-head">${match ? "Your read matches" : "The expected read"}</div>
        <p style="margin-bottom:8px;">
          You classified this as <strong>${userState.name}</strong>.
          ${match
            ? "That's the intended pattern."
            : `The clearest read is <strong>${expected.name} — ${expected.gloss}</strong>.`}
        </p>
        <p style="margin-bottom:0;">${q.why}</p>
        <span class="fb-assign">
          <span class="fba-label">For your assignment</span>
          ${q.assignNote}
        </span>
      </div>
      <div class="model-reveal">
        <div class="mr-label">Model used for this question</div>
        <div class="mr-name">${escapeHTML(q.model)}</div>
        <div class="mr-note">
          This question was answered by <strong>${escapeHTML(q.model)}</strong>. The 10 questions
          in this module were answered by ${MODELS_BY_VENDOR.reduce((a,g) => a + g.models.length, 0)}
          different models from six developers. The four epistemic states are not a property of
          any one model.
        </div>
      </div>
      <div class="btn-row">
        <button class="btn" id="nextBtn">
          ${currentQ < QUESTIONS.length - 1 ? "Next question →" : "See summary →"}
        </button>
      </div>
    `;
  }

  wrap.innerHTML = html;
  screenEl.appendChild(wrap);

  if (phase === "confidence") {
    const opts = wrap.querySelectorAll("#confOpts .opt");
    opts.forEach(o => {
      o.addEventListener("click", () => {
        opts.forEach(x => x.classList.remove("selected"));
        o.classList.add("selected");
        currentConfidence = o.dataset.val;
        setTimeout(() => { phase = "classify"; render(); }, 220);
      });
    });
  }

  if (phase === "classify") {
    const cards = wrap.querySelectorAll("#stateOpts .state");
    cards.forEach(c => {
      c.addEventListener("click", () => {
        cards.forEach(x => x.classList.remove("selected"));
        c.classList.add("selected");
        currentClassification = c.dataset.state;
        answers[currentQ] = { confidence: currentConfidence, classification: currentClassification };
        setTimeout(() => { phase = "feedback"; render(); }, 220);
      });
    });
  }

  if (phase === "feedback") {
    const btn = wrap.querySelector("#nextBtn");
    if (btn) {
      btn.addEventListener("click", () => {
        if (currentQ < QUESTIONS.length - 1) {
          currentQ++; phase = "confidence";
          currentConfidence = null; currentClassification = null;
          render();
        } else {
          phase = "summary"; render();
        }
      });
    }
  }
}

function renderSummary() {
  const wrap = document.createElement("div");
  wrap.className = "screen visible";

  const tally = { yaqeen: 0, zann: 0, shak: 0, wahm: 0 };
  let correct = 0;
  answers.forEach((a, i) => {
    if (!a) return;
    tally[a.classification]++;
    if (a.classification === QUESTIONS[i].state) correct++;
  });

  study.module.answers = answers.slice();
  study.module.tally = tally;
  study.module.correctCount = correct;
  saveStudy();

  let html = `
    <div class="kicker">Step 3 of 4 · Module summary</div>
    <h1>You read ${QUESTIONS.length} distributions.</h1>
    <p class="sub">
      Here's a review of what you classified — before the post-test. You will be asked to
      reflect on these results at the end.
    </p>
    <div class="summary-grid">
  `;
  QUESTIONS.forEach((q, i) => {
    const a = answers[i] || {};
    const cls = a.classification || "—";
    const expected = q.state;
    const isCorrect = cls === expected;
    const s = STATES[cls];
    const label = s ? s.short : "—";
    const assignLabel = q.assignment === "aqidah" ? "Aqidah" : "Shari'ah";
    html += `
      <div class="sum-row">
        <span class="num">${String(i + 1).padStart(2, "0")}</span>
        <span class="sum-body">
          <div class="sum-topic">${q.topic}</div>
          <div class="sum-meta">${assignLabel} · ${q.category} · <span class="sum-model">${escapeHTML(q.model)}</span></div>
        </span>
        <span class="chip ${cls}">${label}</span>
      </div>
    `;
  });
  html += `</div>
    <h2>Your distribution</h2>
    <p class="sub" style="margin-bottom:14px;">How many of the ${QUESTIONS.length} you read as each state.</p>
    <div class="tally">
      <div class="tally-item"><div class="tn" style="color:#2a5a2a;">${tally.yaqeen}</div><div class="tl">Yaqeen</div></div>
      <div class="tally-item"><div class="tn" style="color:#8a6510;">${tally.zann}</div><div class="tl">Zann</div></div>
      <div class="tally-item"><div class="tn" style="color:#3a5a7a;">${tally.shak}</div><div class="tl">Shak</div></div>
      <div class="tally-item"><div class="tn" style="color:#7a2020;">${tally.wahm}</div><div class="tl">Wahm</div></div>
    </div>
    <div class="closing">
      <h3>What this module was about</h3>
      <p>
        You did not judge the AI. You read its <strong>distribution</strong>. Every question showed
        the same model, the same prompt, run three times — and in every question, the runs varied.
      </p>
      <p>
        The four states are properties of a <strong>set of runs</strong>, not of any single answer.
        You cannot see them if you look only once.
      </p>
      <p style="margin-bottom:0;">
        <strong>One AI answer is not evidence. It is a sample.</strong>
      </p>
    </div>
  `;

  wrap.innerHTML = html;
  screenEl.appendChild(wrap);

  const btnRow = document.createElement("div");
  btnRow.className = "btn-row";
  btnRow.innerHTML = `<button class="btn" id="toPost">Continue to post-test →</button>`;
  wrap.appendChild(btnRow);
  wrap.querySelector("#toPost").addEventListener("click", () => { phase = "post"; render(); });
}

function renderPost() {
  const wrap = document.createElement("div");
  wrap.className = "screen visible";
  let currentSection = "";
  let html = `
    <div class="kicker">Step 4 of 4 · Post-test</div>
    <h1>What changed?</h1>
    <p class="sub">
      Now that you've read the module, a few final questions. Four items repeat the pre-test
      so we can measure change; the rest measure comprehension, behavioural intention,
      and what you took away.
    </p>
    <div class="card">
  `;
  POST_QUESTIONS.forEach((item, idx) => {
    if (item.section !== currentSection) {
      html += `</div><div class="section-divider">${item.section}</div><div class="card">`;
      currentSection = item.section;
    }
    const val = study.post[item.id];
    html += `<div class="survey-item">
      <div class="si-q"><span class="si-num">${String(idx + 1).padStart(2, "0")}</span>${item.q}</div>`;
    if (item.type === "likert") {
      html += `<div class="likert">`;
      item.labels.forEach((label, i) => {
        const v = i + 1;
        const sel = val === v ? " selected" : "";
        html += `<button class="likert-opt${sel}" data-qid="${item.id}" data-val="${v}">
          <span class="lo-dot"></span><span class="lo-num">${v}</span><span class="lo-lbl">${escapeHTML(label)}</span>
        </button>`;
      });
      html += `</div>`;
    } else if (item.type === "mcq") {
      html += `<div class="mcq">`;
      item.options.forEach((opt, i) => {
        const key = opt.k;
        const sel = val === opt.k ? " selected" : "";
        html += `<button class="mcq-opt${sel}" data-qid="${item.id}" data-val="${escapeHTML(opt.k)}">
          <span class="mo-key">${escapeHTML(key)}</span><span>${escapeHTML(opt.l)}</span>
        </button>`;
      });
      html += `</div>`;
    } else {
      html += `<textarea class="open-text" data-qid="${item.id}" placeholder="${escapeHTML(item.placeholder || '')}">${escapeHTML(val || '')}</textarea>`;
    }
    html += `</div>`;
  });
  html += `</div><div class="btn-row"><button class="btn" id="postNext" disabled>See my results →</button></div>`;

  wrap.innerHTML = html;
  screenEl.appendChild(wrap);

  const update = () => {
    const answered = POST_QUESTIONS.every(q => {
      const v = study.post[q.id];
      if (q.type === "open") return v && v.trim().length > 0;
      return v !== undefined;
    });
    document.getElementById("postNext").disabled = !answered;

  wrap.querySelectorAll(".likert-opt").forEach(btn => {
    btn.addEventListener("click", () => {
      const qid = btn.dataset.qid;
      study.post[qid] = Number(btn.dataset.val);
      wrap.querySelectorAll(`.likert-opt[data-qid="${qid}"]`).forEach(b => b.classList.remove("selected"));

}

/* ═══════════════════════════════════════════════════
   RESULTS — detailed

function renderResults() {
  const wrap = document.createElement("div");
  wrap.className = "screen visible";

  // ── Proximity analysis ─────────────────────────
  const moduleAnswers = study.module.answers || [];
  const proxRows = QUESTIONS.map((q, i) => {
    const a = moduleAnswers[i] || {};
    const user = a.classification || null;
    const expected = q.state;
    const dist = user ? PROXIMITY[user][expected] : null;
    return { q, i, user, expected, dist };
  });

  const exactCount = proxRows.filter(r => r.dist === 0).length;
  const closeCount = proxRows.filter(r => r.dist === 1).length;
  const farCount = proxRows.filter(r => r.dist === 2).length;
  const dangerousCount = proxRows.filter(r => r.dist === 3).length;
  const wrongCount = farCount + dangerousCount;

  // Areas of weakness: categories where the user got < 100%
  const catStats = {};
  proxRows.forEach(r => {
    const cat = r.q.category;
    if (!catStats[cat]) catStats[cat] = { exact: 0, close: 0, far: 0, dangerous: 0, total: 0 };
    catStats[cat].total++;
    if (r.dist === 0) catStats[cat].exact++;
    else if (r.dist === 1) catStats[cat].close++;
    else if (r.dist === 2) catStats[cat].far++;
    else if (r.dist === 3) catStats[cat].dangerous++;
  });

  const weakCats = Object.entries(catStats)
    .filter(([, s]) => s.far > 0 || s.dangerous > 0)
    .sort((a, b) => (b[1].far + b[1].dangerous) - (a[1].far + a[1].dangerous));

  // ── Proximity table HTML ───────────────────────
  let proxHTML = "";
  proxRows.forEach(r => {
    const userLabel = r.user ? STATES[r.user].short : "—";
    const expLabel = STATES[r.expected].short;
    const verdict = r.dist !== null ? proximityLabel(r.dist) : "—";
    const verdictClass = r.dist === 0 ? "exact" : r.dist === 1 ? "close" : r.dist === 2 ? "far" : "dangerous";
    const verdictText = r.dist === 0 ? "Exact"
      : r.dist === 1 ? "Close"
      : r.dist === 2 ? "Far"
      : r.dist === 3 ? "Dangerous" : "—";
    proxHTML += `
      <div class="prox-row">
        <span class="pr-num">${String(r.i + 1).padStart(2, "0")}</span>
        <div class="pr-topic">
          <div class="pr-name">${r.q.topic}</div>
          <div class="pr-model">${escapeHTML(r.q.model)}</div>
        </div>
        <span class="pr-user ${r.user || ''}">${userLabel}</span>
        <span class="pr-expected ${r.expected}">${expLabel}</span>
        <span class="pr-verdict ${verdictClass}">${verdictText}</span>
      </div>
    `;
  });

  // ── Pre/post deltas ────────────────────────────
  const sharedItems = [
    { id: "detect_unreliable",         label: "I can tell when AI is unreliable" },
    { id: "trust_ai_sourcing",         label: "AI tools are trustworthy for sourcing" },
    { id: "check_citations",           label: "I check AI-suggested sources" },
    { id: "know_confident_vs_correct", label: "I know 'confident' ≠ 'correct'" }
  ];
  let deltaHTML = "";
  sharedItems.forEach(item => {
    const pre = study.pre[item.id];
    const post = study.post[item.id];
    if (pre === undefined || post === undefined) return;
    const delta = post - pre;
    let deltaClass, deltaText;
    if (delta > 0) { deltaClass = "up"; deltaText = `+${delta}`; }
    else if (delta < 0) { deltaClass = "down"; deltaText = `${delta}`; }
    else { deltaClass = "flat"; deltaText = "0"; }
    deltaHTML += `
      <div class="delta-row">
        <div class="dr-label">${escapeHTML(item.label)}</div>
        <div class="dr-pre">${pre}</div>
        <div class="dr-arrow">→</div>
        <div class="dr-post">${post}</div>
        <div class="dr-delta ${deltaClass}">${deltaText}</div>
      </div>
    `;
  });

  // ── Comprehension ──────────────────────────────
  const compItems = POST_QUESTIONS.filter(q => q.correct);
  let compHTML = "";
  let compScore = 0;
  compItems.forEach(item => {
    const userAnswer = study.post[item.id];
    const isCorrect = userAnswer === item.correct;
    if (isCorrect) compScore++;
    compHTML += `
      <div class="comp-row">
        <div class="cr-icon ${isCorrect ? "correct" : "wrong"}">${isCorrect ? "✓" : "✕"}</div>
        <div class="cr-body">
          <strong>${item.q.replace(/<\/?em>/g, "")}</strong>
          <div class="cr-explanation">
            ${isCorrect
              ? `Correct. ${item.explanation}`
              : `You answered <strong>${escapeHTML(userAnswer || "—")}</strong>. The correct answer is <strong>${item.correct}</strong>. ${item.explanation}`}
          </div>
        </div>
      </div>
    `;
  });

  const moduleCorrect = study.module.correctCount || 0;
  const stayedWithYou = study.post.stayed_with_you || "";
  const surprised = study.post.surprised || "";

  // ── Weakness cards ─────────────────────────────
  let weaknessHTML = "";
  if (weakCats.length === 0) {
    weaknessHTML = `<div class="weakness-card" style="background:#eef5ee;border-color:#cfe3cf;border-left-color:#2a5a2a;">
      <div class="wc-title" style="color:#2a4a2a;">No weak areas detected</div>
      <div class="wc-body" style="color:#2a4a2a;">
        You got every question at least close. This is unusually strong performance — the kind of pattern that suggests you already have a well-developed sense of AI reliability.
      </div>
    </div>`;
  } else {
    weakCats.forEach(([cat, s]) => {
      const issues = [];
      if (s.dangerous > 0) issues.push(`${s.dangerous} dangerous confusion${s.dangerous > 1 ? "s" : ""}`);
      if (s.far > 0) issues.push(`${s.far} far miss${s.far > 1 ? "es" : ""}`);
      weaknessHTML += `
        <div class="weakness-card">
          <div class="wc-title">${escapeHTML(cat)} — ${issues.join(", ")}</div>
          <div class="wc-body">
            ${s.dangerous > 0
              ? `You classified at least one <strong>${escapeHTML(cat)}</strong> question in the dangerous zone — mistaking an illusion for grounded certainty, or grounded certainty for an illusion. This is the pattern most worth reflecting on.`
              : `You missed <strong>${s.far}</strong> ${escapeHTML(cat)} question${s.far > 1 ? "s" : ""} by a wide margin.`}
            ${s.exact > 0 ? ` You got ${s.exact} of ${s.total} exactly right.` : ""}
          </div>
        </div>
      `;
    });
  }

  let html = `
    <div class="kicker">Your results · ${study.participantId}</div>
    <h1>What changed in this session.</h1>
    <p class="sub">
      A comparison of your responses before and after the module, plus a detailed breakdown
      of how close your classifications were to the expected reading. This is your own view —
      the aggregated results across all participants will be discussed in class.
    </p>

    <div class="card">
      <h3><span class="ico">1</span>Classification accuracy — how close were you?</h3>
      <p style="margin-bottom:14px;">
        You got <strong>${moduleCorrect} of ${QUESTIONS.length}</strong> exactly right.
        Across the full set: <strong>${exactCount} exact</strong>,
        <strong>${closeCount} close</strong>,
        <strong>${farCount} far</strong>, and
        <strong>${dangerousCount} dangerous</strong>.
        ${wrongCount > 0
          ? `In total you missed <strong>${wrongCount} question${wrongCount > 1 ? "s" : ""}</strong> by a wide or dangerous margin.`
          : `You got everything at least close — no wide misses.`}
      </p>
      <div class="prox-row" style="border-bottom:2px solid #e8e5df;padding-bottom:8px;margin-bottom:4px;">
        <span class="pr-num" style="font-size:10px;color:#8a8580;">#</span>
        <span style="font-size:10px;font-weight:700;color:#8a8580;letter-spacing:0.06em;text-transform:uppercase;">Topic</span>
        <span style="font-size:10px;font-weight:700;color:#8a8580;text-align:center;">You</span>
        <span style="font-size:10px;font-weight:700;color:#8a8580;text-align:center;">Expected</span>
        <span style="font-size:10px;font-weight:700;color:#8a8580;text-align:center;">Verdict</span>
      </div>
      ${proxHTML}
    </div>

    <div class="card">
      <h3><span class="ico">2</span>Areas where you were less close</h3>
      <p style="margin-bottom:14px;">
        These are the categories where your classification was furthest from the expected
        reading. ${weakCats.length === 0 ? "None — you were close or exact on every question." : "This is where your epistemic awareness needs the most attention."}
      </p>
      ${weaknessHTML}
    </div>

    <div class="card">
      <h3><span class="ico">3</span>Pre → post comparison</h3>
      <p style="margin-bottom:14px;">
        Four items from the pre-test were repeated at the end. A movement upward on the first,
        third, and fourth items, and downward on the second, is the pattern we expect from
        epistemic-awareness training.
      </p>
      ${deltaHTML}
    </div>

    <div class="card">
      <h3><span class="ico">4</span>Comprehension check</h3>
      <p style="margin-bottom:14px;">
        Two questions tested your understanding of the two core concepts. You scored
        <strong>${compScore} of ${compItems.length}</strong>.
      </p>
      ${compHTML}
    </div>

    <div class="card">
      <h3><span class="ico">5</span>Your module performance</h3>
      <p style="margin-bottom:14px;">
        Across the 10 questions, you matched the intended classification on
        <strong>${moduleCorrect} of ${QUESTIONS.length}</strong>.
      </p>
      <div class="tally" style="margin-bottom:0;">
        <div class="tally-item"><div class="tn" style="color:#2a5a2a;">${study.module.tally.yaqeen || 0}</div><div class="tl">Yaqeen</div></div>
        <div class="tally-item"><div class="tn" style="color:#8a6510;">${study.module.tally.zann || 0}</div><div class="tl">Zann</div></div>
        <div class="tally-item"><div class="tn" style="color:#3a5a7a;">${study.module.tally.shak || 0}</div><div class="tl">Shak</div></div>
        <div class="tally-item"><div class="tn" style="color:#7a2020;">${study.module.tally.wahm || 0}</div><div class="tl">Wahm</div></div>
      </div>
    </div>
  `;

  if (stayedWithYou || surprised) {
    html += `<div class="card"><h3><span class="ico">6</span>Your reflections</h3>`;
    if (stayedWithYou) {
      html += `<div class="open-echo"><div class="oe-label">Which question stayed with you</div>${escapeHTML(stayedWithYou)}</div>`;
    }
    if (surprised) {
      html += `<div class="open-echo"><div class="oe-label">What surprised you most</div>${escapeHTML(surprised)}</div>`;
    }
    html += `</div>`;
  }

  // ── Discussion guide ───────────────────────────
  html += `
    <div class="section-divider">Class discussion guide</div>
    <div class="card">
      <h3><span class="ico">7</span>Points to discuss</h3>
      <p style="margin-bottom:14px;">
        These are the questions your lecturer will lead the class through. You do not need to
        answer them now — they are prompts for discussion.
      </p>
      <div class="disc-item">
        <div class="di-num">DISCUSSION 01</div>
        <div class="di-q">Different models fabricated differently. Why?</div>
        <div class="di-hint">
          Llama 3.3 70B fabricated a JAKIM fatwa (Q6). GPT-4o-mini fabricated a National Fatwa
          Council ruling — and contradicted itself across runs (Q9). GPT-4o honestly refused to
          fabricate a citation (Q8). Same developer, different behaviour. What does this tell us
          about relying on any single model — or any brand?
        </div>
      </div>
      <div class="disc-item">
        <div class="di-num">DISCUSSION 02</div>
        <div class="di-q">Which is more dangerous — variable hallucination, or consistent hallucination?</div>
        <div class="di-hint">
          In Q9, one run said "permissible," two said "haram." If you had seen only one, you would
          have walked away with false confidence. What does this mean for how we use AI in research?
        </div>
      </div>
      <div class="disc-item">
        <div class="di-num">DISCUSSION 03</div>
        <div class="di-q">The honest refusal (Q8) is not universal.</div>
        <div class="di-hint">
          GPT-4o refused to invent a citation. GPT-4o-mini invented a fatwa. Both are OpenAI models.
          What does this mean for users who trust a company name rather than verify the output?
        </div>
      </div>
      <div class="disc-item">
        <div class="di-num">DISCUSSION 04</div>
        <div class="di-q">Truncation as a failure mode.</div>
        <div class="di-hint">
          Gemini cut off all three runs on Q3 mid-sentence. This is not a hallucination — but it
          is a reliability failure. What should the user do when the answer is incomplete?
        </div>
      </div>
      <div class="disc-item">
        <div class="di-num">DISCUSSION 05</div>
        <div class="di-q">Non-determinism is a feature, not a bug.</div>
        <div class="di-hint">
          Even the well-grounded answers (Q1, Q2) varied in wording across runs. What does this
          mean for reproducibility in research?
        </div>
      </div>
      <div class="disc-item">
        <div class="di-num">DISCUSSION 06</div>
        <div class="di-q">The ethical dimension.</div>
        <div class="di-hint">
          A fabricated JAKIM fatwa is not just factually wrong — it misrepresents a real religious
          institution. What is the responsibility of the AI developer? Of the user who cites it?
          Of the university that accepts the assignment?
        </div>
      </div>
    </div>

    <div class="closing">
      <h3>Why this pilot matters</h3>
      <p>
        You have just participated in a pilot study. The results you see above are your own.
        When your class aggregates these responses, they will tell us whether the module
        changed how students understand AI reliability — and how to refine it before a larger study.
      </p>
      <p>
        The pilot is grounded in the framework of <em>yaqeen, zann, shak,</em> and <em>wahm</em>
        — and in a simple premise: that <strong>epistemic awareness is a trainable skill</strong>.
      </p>
      <p style="margin-bottom:0;"><strong>Thank you for taking part.</strong></p>
    </div>

    <div class="btn-row">
      <button class="btn" id="printBtn">🖨 Print all results</button>
      <button class="btn" id="submitBtn">Submit to study</button>
      <button class="btn ghost" id="toThanks">Export my responses →</button>
    </div>
  `;

  wrap.innerHTML = html;
  screenEl.appendChild(wrap);

  wrap.querySelector("#printBtn").addEventListener("click", printAllResults);
  wrap.querySelector("#submitBtn").addEventListener("click", submitToSheets);
  wrap.querySelector("#toThanks").addEventListener("click", () => { phase = "thanks"; render(); });
}

/* ═══════════════════════════════════════════════════
   PRINT ALL RESULTS
   ═══════════════════════════════════════════════════ */

function printAllResults() {
  const p = printRoot;
  p.innerHTML = "";

  const moduleAnswers = study.module.answers || [];

  // ── PAGE 1 — PRE-TEST ──────────────────────────
  p.innerHTML += `
    <div class="print-page">
      <div class="print-header">
        <h1>CETALab Uni — Pilot Study Results</h1>
        <div class="print-meta">
          Participant: ${study.participantId} · Collected: ${study.startedAt.slice(0,10)} · Printed: ${new Date().toLocaleString()}
        </div>
      </div>

      <h2>PART 1 — PRE-TEST</h2>
      <p><em>Baseline responses before the module.</em></p>
      <table style="width:100%;border-collapse:collapse;font-size:10pt;">
        <thead>
          <tr style="border-bottom:2px solid #1a1a1a;">
            <th style="text-align:left;padding:6pt 4pt;">Question</th>
            <th style="text-align:left;padding:6pt 4pt;width:40%;">Response</th>
          </tr>
        </thead>
        <tbody>
          ${PRE_QUESTIONS.map((item, i) => {
            const v = study.pre[item.id];
            let display = "—";
            if (v !== undefined) {
              if (item.type === "likert") display = `${v} — ${item.labels[v-1]}`;
              else {
                const opt = item.options.find(o => o.k === v);
                display = opt ? opt.l : String(v);
              }
            }
            return `<tr style="border-bottom:1px solid #e0ded8;">
              <td style="padding:6pt 4pt;">${i+1}. ${item.q.replace(/<\/?em>/g,'')}</td>
              <td style="padding:6pt 4pt;font-weight:600;">${display}</td>
            </tr>`;
          }).join("")}
        </tbody>
      </table>
    </div>
  `;

  // ── PAGE 2 — MODULE CLASSIFICATIONS ────────────
  p.innerHTML += `
    <div class="print-page">
      <h2>PART 2 — MODULE CLASSIFICATIONS</h2>
      <p><em>Your reading of each of the 10 questions, and how close it was to the expected classification.</em></p>
      <table style="width:100%;border-collapse:collapse;font-size:10pt;">
        <thead>
          <tr style="border-bottom:2px solid #1a1a1a;">
            <th style="text-align:left;padding:6pt 4pt;">#</th>
            <th style="text-align:left;padding:6pt 4pt;">Topic</th>
            <th style="text-align:left;padding:6pt 4pt;">Model</th>
            <th style="text-align:center;padding:6pt 4pt;">You</th>
            <th style="text-align:center;padding:6pt 4pt;">Expected</th>
            <th style="text-align:center;padding:6pt 4pt;">Verdict</th>
          </tr>
        </thead>
        <tbody>
          ${QUESTIONS.map((q, i) => {
            const a = moduleAnswers[i] || {};
            const user = a.classification || "—";
            const exp = q.state;
            const dist = user !== "—" ? PROXIMITY[user][exp] : null;
            const verdict = dist === 0 ? "Exact" : dist === 1 ? "Close" : dist === 2 ? "Far" : dist === 3 ? "Dangerous" : "—";
            const cls = dist === 0 ? "chip-exact" : dist === 1 ? "chip-close" : dist === 2 ? "chip-far" : dist === 3 ? "chip-danger" : "";
            const userShort = user !== "—" ? STATES[user].short : "—";
            const expShort = STATES[exp].short;
            return `<tr style="border-bottom:1px solid #e0ded8;">
              <td style="padding:6pt 4pt;">${i+1}</td>
              <td style="padding:6pt 4pt;">${q.topic}</td>
              <td style="padding:6pt 4pt;font-size:8pt;font-family:monospace;">${q.model}</td>
              <td style="text-align:center;padding:6pt 4pt;"><span class="print-chip chip-${user}">${userShort}</span></td>
              <td style="text-align:center;padding:6pt 4pt;"><span class="print-chip chip-${exp}">${expShort}</span></td>
              <td style="text-align:center;padding:6pt 4pt;"><span class="print-chip ${cls}">${verdict}</span></td>
            </tr>`;
          }).join("")}
        </tbody>
      </table>

      <h2 style="margin-top:20pt;">Accuracy Summary</h2>
      <table style="width:100%;border-collapse:collapse;font-size:10pt;">
        ${(() => {
          const counts = { exact:0, close:0, far:0, dangerous:0 };
          moduleAnswers.forEach((a, i) => {
            if (!a || !a.classification) return;
            const d = PROXIMITY[a.classification][QUESTIONS[i].state];
            if (d === 0) counts.exact++;
            else if (d === 1) counts.close++;
            else if (d === 2) counts.far++;
            else counts.dangerous++;
          });
          return `
            <tr><td style="padding:4pt;">Exact match</td><td style="text-align:right;font-weight:700;">${counts.exact} / ${QUESTIONS.length}</td></tr>
            <tr><td style="padding:4pt;">Close (adjacent state)</td><td style="text-align:right;font-weight:700;">${counts.close}</td></tr>
            <tr><td style="padding:4pt;">Far miss</td><td style="text-align:right;font-weight:700;">${counts.far}</td></tr>
            <tr><td style="padding:4pt;">Dangerous confusion</td><td style="text-align:right;font-weight:700;">${counts.dangerous}</td></tr>
            <tr style="border-top:2px solid #1a1a1a;"><td style="padding:4pt;font-weight:700;">Total wrong (far + dangerous)</td><td style="text-align:right;font-weight:700;">${counts.far + counts.dangerous}</td></tr>
          `;
        })()}
      </table>
    </div>
  `;

  // ── PAGE 3 — POST-TEST + REFLECTIONS ───────────
  p.innerHTML += `
    <div class="print-page">
      <h2>PART 3 — POST-TEST</h2>
      <p><em>Responses after the module.</em></p>

      <h3 style="margin-top:14pt;">Reflection (compared to pre-test)</h3>
      <table style="width:100%;border-collapse:collapse;font-size:10pt;">
        <thead>
          <tr style="border-bottom:2px solid #1a1a1a;">
            <th style="text-align:left;padding:6pt 4pt;">Item</th>
            <th style="text-align:center;padding:6pt 4pt;">Pre</th>
            <th style="text-align:center;padding:6pt 4pt;">Post</th>
            <th style="text-align:center;padding:6pt 4pt;">Δ</th>
          </tr>
        </thead>
        <tbody>
          ${sharedItems.map(item => {
            const pre = study.pre[item.id];
            const post = study.post[item.id];
            const d = (pre !== undefined && post !== undefined) ? post - pre : null;
            const sign = d > 0 ? `+${d}` : d === 0 ? "0" : d;
            return `<tr style="border-bottom:1px solid #e0ded8;">
              <td style="padding:6pt 4pt;">${item.label}</td>
              <td style="text-align:center;padding:6pt 4pt;">${pre ?? "—"}</td>
              <td style="text-align:center;padding:6pt 4pt;">${post ?? "—"}</td>
              <td style="text-align:center;padding:6pt 4pt;font-weight:700;">${d !== null ? sign : "—"}</td>
            </tr>`;
          }).join("")}
        </tbody>
      </table>

      <h3 style="margin-top:14pt;">Comprehension</h3>
      ${compItems.map(item => {
        const ans = study.post[item.id];
        const ok = ans === item.correct;
        return `<div style="padding:6pt 0;border-bottom:1px solid #e0ded8;font-size:10pt;">
          <strong>${ok ? "✓" : "✕"}</strong> ${item.q.replace(/<\/?em>/g,'')}<br>
          <span style="font-size:9pt;color:#6b6660;">Your answer: ${ans || "—"} · Correct: ${item.correct}</span>
        </div>`;
      }).join("")}

      <h3 style="margin-top:14pt;">Behaviour &amp; Module Perception</h3>
      <table style="width:100%;border-collapse:collapse;font-size:10pt;">
        ${POST_QUESTIONS.filter(q => q.section === "Behaviour" || q.section === "Module perception").map(item => {
          const v = study.post[item.id];
          let display = "—";
          if (item.type === "likert" && v !== undefined) display = `${v} — ${item.labels[v-1]}`;
          else if (item.options) {
            const opt = item.options.find(o => o.k === v);
            display = opt ? opt.l : String(v);
          }
          return `<tr style="border-bottom:1px solid #e0ded8;">
            <td style="padding:6pt 4pt;">${item.q.replace(/<\/?em>/g,'')}</td>
            <td style="text-align:right;padding:6pt 4pt;font-weight:600;">${display}</td>
          </tr>`;
        }).join("")}
      </table>

      <h3 style="margin-top:14pt;">Open Reflections</h3>
      <div style="font-size:10pt;line-height:1.6;">
        <p><strong>Which question stayed with you most?</strong><br>${stayedWithYou || "—"}</p>
        <p><strong>What surprised you most?</strong><br>${surprised || "—"}</p>
      </div>
    </div>
  `;

  // Show and print
  p.style.display = "block";
  setTimeout(() => {
    window.print();
    setTimeout(() => { p.style.display = "none"; }, 1000);
  }, 100);
}

/* ═══════════════════════════════════════════════════
   SUBMIT TO GOOGLE SHEETS
   ═══════════════════════════════════════════════════ */

function buildRowPayload() {
  const moduleAnswers = study.module.answers || [];
  const rows = [];

  // One row per participant — flattened for the "Result" sheet
  const row = {
    participant_id: study.participantId,
    started_at: study.startedAt,
    finished_at: study.finishedAt || "",
    // Pre-test
    pre_ai_use_freq: study.pre.ai_use_freq || "",
    pre_used_ai_refs: study.pre.used_ai_refs || "",
    pre_detect_unreliable: study.pre.detect_unreliable ?? "",
    pre_trust_ai_sourcing: study.pre.trust_ai_sourcing ?? "",
    pre_check_citations: study.pre.check_citations ?? "",
    pre_know_confident_vs_correct: study.pre.know_confident_vs_correct ?? "",
    pre_heard_four_states: study.pre.heard_four_states || "",
    // Module — one column per question: q1_user, q1_expected, q1_distance ...
    ...QUESTIONS.reduce((acc, q, i) => {
      const a = moduleAnswers[i] || {};
      const user = a.classification || "";
      const dist = user ? PROXIMITY[user][q.state] : "";
      acc[`q${i+1}_user`] = user;
      acc[`q${i+1}_expected`] = q.state;
      acc[`q${i+1}_distance`] = dist;
      return acc;
    }, {}),
    module_correct: study.module.correctCount ?? "",
    // Post-test
    post_detect_unreliable: study.post.detect_unreliable ?? "",
    post_trust_ai_sourcing: study.post.trust_ai_sourcing ?? "",
    post_check_citations: study.post.check_citations ?? "",
    post_know_confident_vs_correct: study.post.know_confident_vs_correct ?? "",
    post_wahm_comprehension: study.post.wahm_comprehension || "",
    post_nondeterminism_comprehension: study.post.nondeterminism_comprehension || "",
    post_verify_likelihood: study.post.verify_likelihood ?? "",
    post_fatwa_scenario: study.post.fatwa_scenario || "",
    post_module_helped: study.post.module_helped ?? "",
    post_module_relevant: study.post.module_relevant ?? "",
    post_stayed_with_you: (study.post.stayed_with_you || "").replace(/\n/g, " "),
    post_surprised: (study.post.surprised || "").replace(/\n/g, " "),
  };

  rows.push(row);
  return rows;
}

function submitToSheets() {
  if (!SHEETS_ENDPOINT || SHEETS_ENDPOINT.includes("YOUR_DEPLOYMENT_ID")) {
    alert("⚠️ Google Sheets endpoint not configured.");
    return;
  }

  const btn = document.getElementById("submitBtn");
  btn.disabled = true;
  btn.textContent = "Submitting…";

  const payload = {
    sheet: SHEET_NAME,
    rows: buildRowPayload()
  };

  const body = JSON.stringify(payload);
  console.log("[submit] sending", body.length, "bytes to", SHEETS_ENDPOINT);

  fetch(SHEETS_ENDPOINT, {
    method: "POST",
    mode: "no-cors",
    // text/plain keeps this a "simple request" — no CORS preflight,
    // and the body reliably survives Apps Script's 302 redirect.
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: body
  })
  .then(() => {
    // We can't verify — no-cors hides the response. Say so honestly.
    btn.textContent = "Sent — check your sheet ✓";
    btn.style.background = "#2a5a2a";
    setTimeout(() => {
      btn.textContent = "Submit to study";
      btn.disabled = false;
      btn.style.background = "";
    }, 4000);
  })
  .catch((err) => {
    console.error("[submit] failed", err);
    btn.textContent = "Submit failed — retry";
    btn.disabled = false;
    alert("Submission failed: " + err.message);
  });
}

function renderThanks() {
  const wrap = document.createElement("div");
  wrap.className = "screen visible";
  const json = JSON.stringify(study, null, 2);

  wrap.innerHTML = `
    <div class="kicker">Thank you</div>
    <h1>Your responses are ready.</h1>
    <p class="sub">
      Below is the anonymous dataset from your session. You may copy it, download it, or
      submit it directly to the study using the button in the previous screen. Nothing has
      been transmitted automatically.
    </p>
    <div class="card tight">
      <h3><span class="ico">◈</span>Participant ID · ${study.participantId}</h3>
      <p style="margin-bottom:14px;font-size:13px;">
        Collected ${study.startedAt.slice(0,10)} · Completed ${study.finishedAt ? study.finishedAt.slice(0,10) : "—"}
      </p>
      <div class="export-block">${escapeHTML(json)}</div>
      <div class="btn-row" style="margin-bottom:0;">
        <button class="btn" id="copyBtn">Copy JSON</button>
        <button class="btn ghost" id="downloadBtn">Download as file</button>
        <button class="btn ghost" id="restartBtn">New session</button>
      </div>
    </div>
    <div class="methods-note">
      <strong>What to do with this.</strong> Send the JSON to your lecturer, or paste it into
      the class data sheet. Your participant ID is the only identifier.
    </div>
  `;
  screenEl.appendChild(wrap);

  wrap.querySelector("#copyBtn").addEventListener("click", () => {
    navigator.clipboard.writeText(json).then(
      () => alert("Copied to clipboard."),
      () => alert("Copy failed. Please long-press to select the text.")
    );
  });
  wrap.querySelector("#downloadBtn").addEventListener("click", () => {
    const blob = new Blob([json], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `cetavals-${study.participantId}.json`;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a); URL.revokeObjectURL(url);
  });
  wrap.querySelector("#restartBtn").addEventListener("click", () => {
    if (confirm("Start a new session? This will clear your current responses.")) {
      localStorage.removeItem(STORAGE_KEY);
      location.reload();
    }
  });
}

/* ═══════════════════════════════════════════════════
   UTIL
   ═══════════════════════════════════════════════════ */

function escapeHTML(s) {
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

/* ═══════════════════════════════════════════════════
   INIT
   ═══════════════════════════════════════════════════ */

render();
</script>
