<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Receipt — Uni Cetavals</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f2f0eb;
    color: #1a1a1a;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 32px 16px 80px;
  }

  .app { width: 100%; max-width: 620px; }

  /* ── Top bar ─────────────────────────────────── */
  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 28px;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #8a8378;
    font-family: "SF Mono", "Monaco", "Courier New", monospace;
  }

  /* ── Screens ─────────────────────────────────── */
  .screen { display: none; animation: fade 0.35s ease both; }
  .screen.visible { display: block; }

  @keyframes fade {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ── Typography ──────────────────────────────── */
  h1 { font-size: 22px; font-weight: 600; line-height: 1.3; margin-bottom: 8px; letter-spacing: -0.01em; }
  h2 { font-size: 16px; font-weight: 600; line-height: 1.35; margin-bottom: 10px; }

  .sub {
    font-size: 14px;
    color: #6b6660;
    line-height: 1.6;
    margin-bottom: 22px;
  }

  .kicker {
    font-size: 10.5px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #a09b95;
    margin-bottom: 10px;
    font-family: "SF Mono", "Monaco", "Courier New", monospace;
  }

  /* ── Domain picker ───────────────────────────── */
  .domains {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 24px;
  }

  .domain {
    background: #fff;
    border: 1.5px solid #e5e1d8;
    border-radius: 12px;
    padding: 20px 22px;
    cursor: pointer;
    text-align: left;
    font-family: inherit;
    transition: border-color 0.2s, transform 0.15s, box-shadow 0.2s;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
  }
  .domain:hover {
    border-color: #b0aba5;
    transform: translateY(-1px);
    box-shadow: 0 4px 14px rgba(0,0,0,0.05);
  }
  .domain .d-left { flex: 1; }
  .domain .d-name {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 3px;
  }
  .domain .d-desc {
    font-size: 12.5px;
    color: #8a8378;
    line-height: 1.5;
  }
  .domain .d-icon {
    font-size: 22px;
    color: #c5c0ba;
    flex-shrink: 0;
  }

  /* ── Query screen ────────────────────────────── */
  .query-box {
    background: #fff;
    border: 1px solid #e5e1d8;
    border-radius: 12px;
    padding: 20px 22px;
    margin-bottom: 18px;
  }
  .query-box .q-label {
    font-size: 10.5px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #a09b95;
    margin-bottom: 8px;
    font-family: "SF Mono", "Monaco", "Courier New", monospace;
  }
  .query-box .q-text {
    font-size: 16px;
    font-weight: 500;
    line-height: 1.45;
  }

  .answer-box {
    background: #fff;
    border: 1px solid #e5e1d8;
    border-radius: 12px;
    padding: 20px 22px;
    margin-bottom: 22px;
    position: relative;
  }
  .answer-box .a-label {
    font-size: 10.5px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #a09b95;
    margin-bottom: 10px;
    font-family: "SF Mono", "Monaco", "Courier New", monospace;
  }
  .answer-box p {
    font-size: 14.5px;
    line-height: 1.65;
    color: #3a3632;
  }

  /* typing dots */
  .typing {
    display: inline-flex;
    gap: 4px;
    align-items: center;
    padding: 4px 0;
  }
  .typing span {
    width: 6px; height: 6px; border-radius: 50%;
    background: #c5c0ba;
    animation: blink 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink {
    0%, 80%, 100% { opacity: 0.3; }
    40% { opacity: 1; }
  }

  /* ── Receipt ─────────────────────────────────── */
  .receipt-wrap {
    display: flex;
    justify-content: center;
    margin-bottom: 22px;
  }

  .receipt {
    width: 100%;
    max-width: 480px;
    background: #fffdf7;
    padding: 26px 26px 22px;
    box-shadow:
      0 1px 2px rgba(0,0,0,0.04),
      0 6px 20px rgba(0,0,0,0.07);
    font-family: "SF Mono", "Monaco", "Courier New", monospace;
    color: #2a2622;
    position: relative;
    border-radius: 2px;
  }

  .receipt-head {
    text-align: center;
    padding-bottom: 14px;
    border-bottom: 1px dashed #c5bfb0;
    margin-bottom: 14px;
  }
  .receipt-head .rh-title {
    font-size: 12px;
    letter-spacing: 0.2em;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .receipt-head .rh-sub {
    font-size: 10px;
    letter-spacing: 0.1em;
    color: #8a8378;
    text-transform: uppercase;
  }

  .receipt-meta {
    font-size: 10.5px;
    color: #8a8378;
    line-height: 1.7;
    padding-bottom: 12px;
    border-bottom: 1px dashed #c5bfb0;
    margin-bottom: 4px;
  }
  .receipt-meta .m-row {
    display: flex;
    justify-content: space-between;
  }

  /* line items */
  .line {
    display: grid;
    grid-template-columns: 20px 1fr;
    gap: 12px;
    padding: 11px 0;
    border-bottom: 1px dotted #ddd6c6;
    align-items: start;
    cursor: pointer;
    transition: background 0.15s;
    border-radius: 3px;
  }
  .line:last-child { border-bottom: none; }
  .line.tappable:hover { background: rgba(0,0,0,0.02); }
  .line.locked { cursor: default; }

  .line .mark {
    width: 16px;
    height: 16px;
    border: 1.5px solid #b5aea0;
    border-radius: 3px;
    margin-top: 2px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
    color: #fff;
    transition: background 0.15s, border-color 0.15s;
  }
  .line.tapped .mark {
    background: #2a2622;
    border-color: #2a2622;
  }
  .line.tapped .mark::after {
    content: "✕";
    font-size: 10px;
  }

  .line .claim { min-width: 0; }

  .line .claim-text {
    font-size: 12.5px;
    line-height: 1.55;
    color: #2a2622;
    letter-spacing: 0.01em;
  }

  .line .meta {
    margin-top: 6px;
    font-size: 10.5px;
    letter-spacing: 0.05em;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    text-transform: uppercase;
  }

  .verdict {
    font-weight: 700;
    padding: 2px 6px;
    border-radius: 3px;
  }
  .verdict.ok   { background: #dcecdc; color: #2a5a2a; }
  .verdict.bad  { background: #f5dcdc; color: #7a2020; }

  .stability {
    color: #8a8378;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .dots { display: inline-flex; gap: 4px; }
  .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    border: 1px solid #b5aea0;
    background: transparent;
    display: inline-block;
  }
  .dot.on { background: #2a2622; border-color: #2a2622; }

  .stag {
    font-weight: 700;
    letter-spacing: 0.08em;
  }
  .stag.stable { color: #2a5a2a; }
  .stag.drift  { color: #8a5a1a; }

  /* note under claim */
  .line .note {
    margin-top: 7px;
    font-size: 11px;
    line-height: 1.5;
    color: #6b665c;
    font-style: italic;
    padding-left: 10px;
    border-left: 2px solid #e5e1d8;
  }

  .receipt-total {
    border-top: 1px dashed #c5bfb0;
    margin-top: 14px;
    padding-top: 14px;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #8a8378;
  }
  .receipt-total .t-row {
    display: flex;
    justify-content: space-between;
    margin-bottom: 5px;
  }
  .receipt-total .t-row:last-child { margin-bottom: 0; }
  .receipt-total .t-row.total {
    font-weight: 700;
    color: #2a2622;
    font-size: 12px;
    padding-top: 6px;
    margin-top: 6px;
    border-top: 1px solid #ddd6c6;
  }

  /* ── Instruction banner ──────────────────────── */
  .instruction {
    background: #fff;
    border: 1px solid #e5e1d8;
    border-radius: 12px;
    padding: 16px 20px;
    margin-bottom: 22px;
    font-size: 13.5px;
    line-height: 1.55;
    color: #3a3632;
  }
  .instruction strong { font-weight: 700; }
  .instruction .step-num {
    display: inline-block;
    background: #2a2622;
    color: #fff;
    font-size: 10px;
    font-weight: 700;
    width: 18px;
    height: 18px;
    line-height: 18px;
    text-align: center;
    border-radius: 50%;
    margin-right: 8px;
    vertical-align: 1px;
  }

  /* ── Score panel ─────────────────────────────── */
  .score {
    background: #2a2622;
    color: #fff;
    border-radius: 12px;
    padding: 22px 24px;
    margin-bottom: 22px;
  }
  .score .s-kicker {
    font-size: 10.5px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #a09b95;
    margin-bottom: 10px;
    font-family: "SF Mono", "Monaco", "Courier New", monospace;
  }
  .score .s-hit {
    font-size: 32px;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 4px;
    font-family: "SF Mono", "Monaco", "Courier New", monospace;
  }
  .score .s-label {
    font-size: 13px;
    color: #c5c0ba;
    margin-bottom: 16px;
  }
  .score .s-breakdown {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    font-size: 12.5px;
  }
  .score .s-breakdown > div {
    color: #c5c0ba;
    line-height: 1.5;
  }
  .score .s-breakdown .n {
    color: #fff;
    font-weight: 700;
    font-family: "SF Mono", "Monaco", "Courier New", monospace;
  }

  /* ── Insight panel ───────────────────────────── */
  .insight {
    background: #fff;
    border: 1px solid #e5e1d8;
    border-radius: 12px;
    padding: 20px 22px;
    margin-bottom: 22px;
  }
  .insight h3 {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 10px;
  }
  .insight p {
    font-size: 13.5px;
    line-height: 1.65;
    color: #4a4640;
    margin-bottom: 10px;
  }
  .insight p:last-child { margin-bottom: 0; }
  .insight strong { color: #1a1a1a; font-weight: 700; }
  .insight em { font-style: italic; color: #2a2622; }

  /* ── Log table ───────────────────────────────── */
  .log-table {
    background: #fff;
    border: 1px solid #e5e1d8;
    border-radius: 12px;
    padding: 6px 0;
    margin-bottom: 22px;
    overflow: hidden;
  }
  .log-row {
    display: flex;
    justify-content: space-between;
    padding: 12px 22px;
    border-bottom: 1px solid #f0ece4;
    font-size: 13.5px;
    gap: 16px;
  }
  .log-row:last-child { border-bottom: none; }
  .log-row .k { color: #8a8378; flex-shrink: 0; }
  .log-row .v { font-weight: 600; text-align: right; font-family: "SF Mono", "Monaco", "Courier New", monospace; font-size: 12.5px; }

  /* ── Buttons ─────────────────────────────────── */
  .btn-row {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: #1a1a1a;
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 13px 24px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.2s, transform 0.15s, opacity 0.2s;
  }
  .btn:hover { background: #333; transform: translateY(-1px); }
  .btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }
  .btn.ghost {
    background: transparent;
    color: #1a1a1a;
    border: 1.5px solid #d5d0ca;
  }
  .btn.ghost:hover { border-color: #1a1a1a; background: transparent; }

  /* ── Details toggle ──────────────────────────── */
  details.raw-runs {
    background: #fff;
    border: 1px solid #e5e1d8;
    border-radius: 12px;
    padding: 0;
    margin-bottom: 22px;
    overflow: hidden;
  }
  details.raw-runs summary {
    padding: 16px 22px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    list-style: none;
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: #4a4640;
  }
  details.raw-runs summary::-webkit-details-marker { display: none; }
  details.raw-runs summary::after {
    content: "▾";
    color: #a09b95;
    transition: transform 0.2s;
  }
  details.raw-runs[open] summary::after { transform: rotate(180deg); }
  details.raw-runs .details-body {
    padding: 0 22px 20px;
    border-top: 1px solid #f0ece4;
    padding-top: 16px;
  }
  details.raw-runs .run-block {
    margin-bottom: 16px;
  }
  details.raw-runs .run-block:last-child { margin-bottom: 0; }
  details.raw-runs .run-block .rb-label {
    font-size: 10.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #a09b95;
    margin-bottom: 6px;
    font-family: "SF Mono", "Monaco", "Courier New", monospace;
  }
  details.raw-runs .run-block p {
    font-size: 13.5px;
    line-height: 1.6;
    color: #4a4640;
  }

  /* ── Stagger animation for receipt lines ─────── */
  .receipt.printing .line {
    opacity: 0;
    animation: printIn 0.4s ease forwards;
  }
  @keyframes printIn {
    from { opacity: 0; transform: translateY(-4px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ── Closing note ────────────────────────────── */
  .closing {
    background: #2a2622;
    color: #fff;
    border-radius: 12px;
    padding: 24px 26px;
    margin-bottom: 22px;
  }
  .closing h3 {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 12px;
  }
  .closing p {
    font-size: 13.5px;
    line-height: 1.7;
    color: #c5c0ba;
    margin-bottom: 10px;
  }
  .closing p:last-child { margin-bottom: 0; }
  .closing strong { color: #fff; }
  .closing em { font-style: italic; color: #e0ded8; }
</style>
</head>
<body>

<div class="app">
  <div class="topbar">
    <span id="topLeft">Uni Cetavals</span>
    <span id="topRight">The Receipt</span>
  </div>
  <div id="screen"></div>
</div>

        note: "Largely rejected by modern historians. A popular but discredited theory.",
        r2: false, r3: false },
      { text: "The Eastern Empire fell at the same time as the Western Empire.",
        truth: "unsupported",
        note: "Flatly false. The Eastern Empire lasted until 1453.",
        r2: false, r3: false }
    ]
  }
};

/* ═══════════════════════════════════════════════════
   STATE
   ═══════════════════════════════════════════════════ */

const S = {
  phase: "domain",   // domain | query | receipt | reveal | runs | log
  domainKey: null,
  tapped: new Set(),
  typing: false
};

const screenEl = document.getElementById("screen");
const topLeft = document.getElementById("topLeft");
const topRight = document.getElementById("topRight");

/* ═══════════════════════════════════════════════════
   HELPERS
   ═══════════════════════════════════════════════════ */

function el(tag, cls, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html !== undefined) e.innerHTML = html;
  return e;
}

function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function domain() { return DOMAINS[S.domainKey]; }

/* ═══════════════════════════════════════════════════
   RENDER
   ═══════════════════════════════════════════════════ */

function render() {
  screenEl.innerHTML = "";
  topLeft.textContent = "Uni Cetavals";
  topRight.textContent = "The Receipt";

  switch (S.phase) {
    case "domain":  renderDomain();  break;
    case "query":   renderQuery();   break;
    case "receipt": renderReceipt(false, false); break;
    case "reveal":  renderReceipt(true, false);  break;
    case "runs":    renderReceipt(true, true);   break;
    case "log":     renderLog();     break;
  }

  window.scrollTo({ top: 0, behavior: "smooth" });
}

/* ── Screen: domain ──────────────────────────── */
function renderDomain() {
  const wrap = el("div", "screen visible");

  wrap.appendChild(el("div", "kicker", "Step 1 · Choose a domain"));
  wrap.appendChild(el("h1", null, "Pick a receipt to examine."));
  wrap.appendChild(el("p", "sub",
    "Each domain has an answer the model gave to a simple question. " +
    "You'll decompose it into claims, mark the ones you doubt, and see what holds up."
  ));

  const list = el("div", "domains");
  Object.keys(DOMAINS).forEach(key => {
    const d = DOMAINS[key];
    const card = el("button", "domain");
    card.innerHTML = `
      <div class="d-left">
        <div class="d-name">${esc(d.name)}</div>
        <div class="d-desc">${esc(d.desc)}</div>
      </div>
      <div class="d-icon">${d.icon}</div>
    `;
    card.addEventListener("click", () => {
      S.domainKey = key;
      S.phase = "query";
      render();
    });
    list.appendChild(card);
  });
  wrap.appendChild(list);

  screenEl.appendChild(wrap);
}

/* ── Screen: query → answer ──────────────────── */
function renderQuery() {
  const d = domain();
  const wrap = el("div", "screen visible");

  wrap.appendChild(el("div", "kicker", "Step 2 · The query"));
  wrap.appendChild(el("h1", null, "The model was asked:"));
  wrap.appendChild(el("p", "sub", "One prompt. One answer. Read it as a whole first."));

  const qBox = el("div", "query-box");
  qBox.innerHTML = `
    <div class="q-label">Prompt</div>
    <div class="q-text">"${esc(d.prompt)}"</div>
  `;
  wrap.appendChild(qBox);

  const aBox = el("div", "answer-box");
  aBox.innerHTML = `<div class="a-label">Model response</div>`;
  const p = el("p", null, esc(d.answer));
  aBox.appendChild(p);
  wrap.appendChild(aBox);

  const btnRow = el("div", "btn-row");
  const btn = el("button", "btn", "Decompose into claims →");
  btn.addEventListener("click", () => {
    S.phase = "receipt";
    S.tapped = new Set();
    render();
  });
  btnRow.appendChild(btn);
  wrap.appendChild(btnRow);

  screenEl.appendChild(wrap);
  topRight.textContent = d.name;
}

/* ── Screens: receipt / reveal / runs ────────── */
function renderReceipt(showTruth, showRuns) {
  const d = domain();
  const wrap = el("div", "screen visible");

  // Header
  let kickerText, h1Text, subText;
  if (!showTruth) {
    kickerText = "Step 3 · The receipt";
    h1Text = "The answer, broken into claims.";
    subText = "Each line is one claim the model made. Tap the ones you think are unsupported.";
  } else if (!showRuns) {
    kickerText = "Step 4 · The reveal";
    h1Text = "Here's what held up.";
    subText = "Each claim is now scored against what can actually be verified.";
  } else {
    kickerText = "Step 5 · Runs 2 and 3";
    h1Text = "The same prompt, run twice more.";
    subText = "Watch which claims reappear — and which don't.";
  }

  wrap.appendChild(el("div", "kicker", kickerText));
  wrap.appendChild(el("h1", null, h1Text));
  wrap.appendChild(el("p", "sub", subText));

  // Instruction banner (only on receipt phase)
  if (!showTruth) {
    const ib = el("div", "instruction");
    ib.innerHTML = `<span class="step-num">✕</span> Tap any claim you doubt. You can select as many or as few as you like. Then hit <strong>Check my read</strong>.`;
    wrap.appendChild(ib);
  }

  // Receipt
  const receiptWrap = el("div", "receipt-wrap");
  const receipt = el("div", "receipt printing");

  // Receipt head
  const head = el("div", "receipt-head");
  head.innerHTML = `
    <div class="rh-title">UNI CETAVALS</div>
    <div class="rh-sub">Claim Receipt · ${esc(d.name)}</div>
  `;
  receipt.appendChild(head);

  // Receipt meta
  const meta = el("div", "receipt-meta");
  meta.innerHTML = `
    <div class="m-row"><span>PROMPT</span><span>${esc(truncate(d.prompt, 26))}</span></div>
    <div class="m-row"><span>RUNS</span><span>3</span></div>
    <div class="m-row"><span>CLAIMS</span><span>${d.claims.length}</span></div>
  `;
  receipt.appendChild(meta);

  // Lines
  d.claims.forEach((claim, i) => {
    const line = el("div", "line");
    const tapped = S.tapped.has(i);

    if (!showTruth) line.classList.add("tappable");
    else line.classList.add("locked");
    if (tapped) line.classList.add("tapped");

    // stagger animation
    line.style.animationDelay = (i * 0.06) + "s";

    const mark = el("div", "mark");
    const claimDiv = el("div", "claim");
    const claimText = el("div", "claim-text", esc(claim.text));
    claimDiv.appendChild(claimText);

    // Meta row (after reveal)
    if (showTruth) {
      const metaRow = el("div", "meta");

      const verdict = el("span",
        "verdict " + (claim.truth === "supported" ? "ok" : "bad"),
        claim.truth === "supported" ? "✓ Supported" : "✕ Unsupported"
      );
      metaRow.appendChild(verdict);

      if (showRuns) {
        const stab = el("span", "stability");
        const isStable = claim.r2 && claim.r3;
        stab.innerHTML = `
          <span class="dots">
            <span class="dot on"></span>
            <span class="dot ${claim.r2 ? "on" : ""}"></span>
            <span class="dot ${claim.r3 ? "on" : ""}"></span>
          </span>
          <span class="stag ${isStable ? "stable" : "drift"}">${isStable ? "STABLE" : "DRIFT"}</span>
        `;
        metaRow.appendChild(stab);
      }

      claimDiv.appendChild(metaRow);

      // Note
      const note = el("div", "note", esc(claim.note));
      claimDiv.appendChild(note);
    }

    line.appendChild(mark);
    line.appendChild(claimDiv);

    // Tap handler (only during receipt phase)
    if (!showTruth) {
      line.addEventListener("click", () => {
        if (S.tapped.has(i)) S.tapped.delete(i);
        else S.tapped.add(i);
        line.classList.toggle("tapped");
        updateReceiptButton();
      });
    }

    receipt.appendChild(line);
  });

  // Receipt total
  const total = el("div", "receipt-total");
  if (!showTruth) {
    total.innerHTML = `
      <div class="t-row"><span>CLAIMS EXTRACTED</span><span>${d.claims.length}</span></div>
      <div class="t-row total"><span>YOUR FLAGS</span><span id="flagCount">0</span></div>
    `;
  } else {
    const unsupportedCount = d.claims.filter(c => c.truth === "unsupported").length;
    const supportedCount = d.claims.length - unsupportedCount;
    total.innerHTML = `
      <div class="t-row"><span>SUPPORTED</span><span>${supportedCount}</span></div>
      <div class="t-row"><span>UNSUPPORTED</span><span>${unsupportedCount}</span></div>
      <div class="t-row total"><span>BACKED / TOTAL</span><span>${supportedCount} / ${d.claims.length}</span></div>
    `;
  }
  receipt.appendChild(total);

  receiptWrap.appendChild(receipt);
  wrap.appendChild(receiptWrap);

  /* ── Action area below receipt ──────────────── */

  // Phase: receipt → button to reveal
  if (!showTruth) {
    const btnRow = el("div", "btn-row");
    const btn = el("button", "btn", "Check my read");
    btn.id = "checkBtn";
    btn.addEventListener("click", () => {
      S.phase = "reveal";
      render();
    });
    btnRow.appendChild(btn);
    wrap.appendChild(btnRow);

    // Flag counter updater
    setTimeout(() => {
      const fc = document.getElementById("flagCount");
      const b = document.getElementById("checkBtn");
      const update = () => {
        if (fc) fc.textContent = S.tapped.size;
        if (b) b.disabled = S.tapped.size === 0;
      };
      update();
      // Re-bind the button updater
      window.updateReceiptButton = update;
    }, 0);
  }

  // Phase: reveal → score + button to runs
  if (showTruth && !showRuns) {
    const score = computeScore();
    const scoreBox = el("div", "score");
    scoreBox.innerHTML = `
      <div class="s-kicker">Your hit rate</div>
      <div class="s-hit">${score.hitPct}%</div>
      <div class="s-label">${score.correct} of ${d.claims.length} claims read correctly</div>
      <div class="s-breakdown">
        <div><span class="n">${score.caught}</span> unsupported claims you caught</div>
        <div><span class="n">${score.falseAlarms}</span> false alarms (supported, flagged)</div>
        <div><span class="n">${score.missed}</span> unsupported claims you missed</div>
        <div><span class="n">${score.correctPasses}</span> supported claims correctly left alone</div>
      </div>
    `;
    wrap.appendChild(scoreBox);

    const insight = el("div", "insight");
    insight.innerHTML = `
      <h3>What you just saw</h3>
      <p>
        This is claim-level scoring. It's closer to how real evaluation works than rating
        a whole answer on a 1–5 scale — you can't audit a vibe, but you can audit a claim.
      </p>
      <p>
        Now: the same prompt was run twice more. Let's see which of these claims
        <em>reappear</em> — and which were one-off confabulations.
      </p>
    `;
    wrap.appendChild(insight);

    const btnRow = el("div", "btn-row");
    const btn = el("button", "btn", "Show runs 2 and 3 →");
    btn.addEventListener("click", () => {
      S.phase = "runs";
      render();
    });
    btnRow.appendChild(btn);
    wrap.appendChild(btnRow);
  }

  // Phase: runs → stability insight + button to log
  if (showTruth && showRuns) {
    // Raw runs toggle
    const details = el("details", "raw-runs");
    details.innerHTML = `
      <summary>See the full text of runs 2 and 3</summary>
      <div class="details-body">
        <div class="run-block">
          <div class="rb-label">Run 2</div>
          <p>${esc(d.run2)}</p>
        </div>
        <div class="run-block">
          <div class="rb-label">Run 3</div>
          <p>${esc(d.run3)}</p>
        </div>
      </div>
    `;
    wrap.appendChild(details);

    // Compute stability stats
    const stats = computeStability();

    const insight = el("div", "insight");
    insight.innerHTML = `
      <h3>What drifted, what stayed</h3>
      <p>
        <strong>${stats.stable}</strong> claims appeared in all three runs.
        <strong>${stats.drift}</strong> appeared only once — they were invented in the moment.
      </p>
      <p>
        Look at the split. <strong>${stats.stableUnsupported}</strong> of the stable claims
        were still unsupported. Consistency is not the same as truth — but
        <em>drift</em> is a strong signal that a claim was never grounded in the first place.
      </p>
    `;
    wrap.appendChild(insight);

    const btnRow = el("div", "btn-row");
    const btn = el("button", "btn", "Log the result →");
    btn.addEventListener("click", () => {
      S.phase = "log";
      render();
    });
    btnRow.appendChild(btn);
    wrap.appendChild(btnRow);
  }

  screenEl.appendChild(wrap);
  topRight.textContent = d.name;

  // Re-apply stagger
  const r = document.querySelector(".receipt");
  if (r) {
    r.classList.remove("printing");
    void r.offsetWidth;
    r.classList.add("printing");
  }
}

/* ── Screen: log ─────────────────────────────── */
function renderLog() {
  const d = domain();
  const score = computeScore();
  const stats = computeStability();
  const wrap = el("div", "screen visible");

  wrap.appendChild(el("div", "kicker", "Step 6 · Log"));
  wrap.appendChild(el("h1", null, "Receipt logged."));
  wrap.appendChild(el("p", "sub",
    "This is what a claim-level evaluation looks like when you treat the answer as a set of assertions, not a single block."
  ));

  const table = el("div", "log-table");
  const rows = [
    ["Domain", d.name],
    ["Prompt", truncate(d.prompt, 34)],
    ["Runs", "3 (same model, same prompt)"],
    ["Claims extracted", String(d.claims.length)],
    ["Unsupported claims", String(d.claims.filter(c => c.truth === "unsupported").length)],
    ["Your hit rate", score.hitPct + "%"],
    ["Stable across runs", String(stats.stable)],
    ["Drifted (one-off)", String(stats.drift)]
  ];
  rows.forEach(([k, v]) => {
    const r = el("div", "log-row");
    r.innerHTML = `<span class="k">${esc(k)}</span><span class="v">${esc(v)}</span>`;
    table.appendChild(r);
  });
  wrap.appendChild(table);

  const closing = el("div", "closing");
  closing.innerHTML = `
    <h3>What the receipt shows</h3>
    <p>
      A confident answer is not the same as a supported answer. The receipt makes that
      visible by pulling the answer apart into individual claims and checking each one —
      a task no whole-answer rating can do.
    </p>
    <p>
      Run the same prompt again and the picture sharpens further. The claims that
      <em>drift</em> across runs are the ones the model invented in the moment. The claims
      that persist are either well-grounded — or a <strong>consistent hallucination</strong>,
      which is worse, because it looks like knowledge.
    </p>
    <p>
      <strong>One answer tells you what the model said. The receipt tells you what it knew.</strong>
    </p>
  `;
  wrap.appendChild(closing);

  const btnRow = el("div", "btn-row");
  const btn = el("button", "btn ghost", "Run another receipt");
  btn.addEventListener("click", () => {
    S.phase = "domain";
    S.domainKey = null;
    S.tapped = new Set();
    render();
  });
  btnRow.appendChild(btn);
  wrap.appendChild(btnRow);

  screenEl.appendChild(wrap);
  topRight.textContent = "Logged";
}

/* ═══════════════════════════════════════════════════
   COMPUTE
   ═══════════════════════════════════════════════════ */

function computeScore() {
  const d = domain();
  let caught = 0, falseAlarms = 0, missed = 0, correctPasses = 0;

  d.claims.forEach((c, i) => {
    const flagged = S.tapped.has(i);
    if (c.truth === "unsupported") {
      if (flagged) caught++;
      else missed++;
    } else {
      if (flagged) falseAlarms++;
      else correctPasses++;
    }
  });

  const correct = caught + correctPasses;
  const hitPct = Math.round((correct / d.claims.length) * 100);

  return { caught, falseAlarms, missed, correctPasses, correct, hitPct };
}

function computeStability() {
  const d = domain();
  let stable = 0, drift = 0, stableUnsupported = 0;
  d.claims.forEach(c => {
    const isStable = c.r2 && c.r3;
    if (isStable) {
      stable++;
      if (c.truth === "unsupported") stableUnsupported++;
    } else {
      drift++;
    }
  });
  return { stable, drift, stableUnsupported };
}

function truncate(s, n) {
  return s.length > n ? s.slice(0, n - 1) + "…" : s;
}

/* ═══════════════════════════════════════════════════
   INIT
   ═══════════════════════════════════════════════════ */

// Global updater placeholder (set during receipt render)
window.updateReceiptButton = () => {};

render();
</script>
</body>
</html>
