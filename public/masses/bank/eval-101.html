<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Banking Agent — Can You Tell If It Really Did It?</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --ink: #14181d;
    --ink-soft: #3a4048;
    --muted: #6b7280;
    --line: #e2ded5;
    --paper: #f6f4ee;
    --card: #fff;
    --danger: #a02c1f;
    --danger-soft: #f4e2de;
    --warn: #b8860b;
    --warn-soft: #f4e9cb;
    --blue: #35597a;
    --blue-soft: #dde6ef;
    --green: #2a7a2a;
    --green-soft: #dcecdc;
    --accent: #0f3d3e;
    --mono: "SF Mono", "Monaco", "Menlo", monospace;
  }
  html { font-size: 15px; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Roboto, sans-serif;
    background: var(--paper); color: var(--ink);
    -webkit-font-smoothing: antialiased;
    padding: 40px 20px 80px;
    display: flex; justify-content: center;
  }
  .app { width: 100%; max-width: 940px; }

  /* ── TOPBAR ───────────────────────────── */
  .topbar {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 22px;
    font-family: var(--mono);
    font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--muted); font-weight: 700;
  }
  .topbar .brand { color: var(--ink); font-weight: 900; }
  .topbar .progress-dots { display: flex; gap: 5px; }
  .topbar .progress-dots span {
    width: 22px; height: 3px; border-radius: 2px;
    background: var(--line);
    transition: background 0.3s;
  }
  .topbar .progress-dots span.done { background: var(--ink); }
  .topbar .progress-dots span.active { background: var(--danger); }

  .screen { display: none; animation: fade 0.4s cubic-bezier(0.22, 1, 0.36, 1); }
  .screen.active { display: block; }
  @keyframes fade {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  h1 { font-size: 28px; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; margin-bottom: 10px; }
  h1 .red { color: var(--danger); }
  h2 { font-size: 20px; font-weight: 800; letter-spacing: -0.01em; margin-bottom: 8px; }
  h3 { font-size: 15px; font-weight: 800; letter-spacing: -0.005em; margin-bottom: 8px; }
  .lead { font-size: 15.5px; line-height: 1.6; color: var(--ink-soft); margin-bottom: 22px; max-width: 720px; }
  .lead strong { color: var(--ink); font-weight: 800; }

  /* ── INTRO ─────────────────────────────── */
  .intro-card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 26px 28px; margin-bottom: 16px;
  }
  .intro-card h3 { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .intro-card h3 .ico {
    width: 26px; height: 26px; border-radius: 7px;
    background: var(--ink); color: #fff;
    display: inline-flex; align-items: center; justify-content: center;
    font-family: var(--mono); font-size: 11px; font-weight: 900;
    flex-shrink: 0;
  }
  .intro-card p { font-size: 14px; line-height: 1.65; color: var(--ink-soft); margin-bottom: 10px; }
  .intro-card p:last-child { margin-bottom: 0; }
  .intro-card strong { color: var(--ink); font-weight: 800; }

  .task-list { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 14px; }
  @media (max-width: 640px) { .task-list { grid-template-columns: 1fr 1fr; } }
  .task-chip {
    background: var(--paper); border: 1px solid var(--line);
    border-radius: 8px; padding: 12px 14px;
  }
  .task-chip .tc-num {
    font-family: var(--mono); font-size: 9.5px;
    font-weight: 800; color: var(--danger); letter-spacing: 0.08em;
    margin-bottom: 4px;
  }
  .task-chip .tc-name { font-size: 13px; font-weight: 800; color: var(--ink); line-height: 1.3; }

  .cta-btn {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--ink); color: #fff;
    border: none; border-radius: 10px;
    padding: 14px 26px; font-size: 14.5px; font-weight: 700;
    cursor: pointer; font-family: inherit;
    transition: transform 0.15s, background 0.2s;
    margin-top: 22px;
  }
  .cta-btn:hover { background: #333; transform: translateY(-2px); }
  .cta-btn.ghost {
    background: transparent; color: var(--ink);
    border: 1.5px solid var(--line);
  }
  .cta-btn.ghost:hover { border-color: var(--ink); background: transparent; }
  .cta-btn.danger { background: var(--danger); }
  .cta-btn.danger:hover { background: #b8362811; color: var(--danger); border: 1.5px solid var(--danger); }
  .cta-btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }

  /* ── EVAL HEAD ─────────────────────────── */
  .eval-head {
    display: flex; justify-content: space-between; align-items: flex-start;
    gap: 20px; margin-bottom: 6px;
  }
  .eval-kicker {
    font-family: var(--mono); font-size: 10.5px;
    letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--danger); font-weight: 800;
    margin-bottom: 6px;
  }
  .eval-title {
    font-size: 27px; font-weight: 900; letter-spacing: -0.02em;
    line-height: 1.15; margin-bottom: 8px;
  }
  .eval-tagline {
    font-size: 14.5px; color: var(--muted); font-weight: 500;
    line-height: 1.5; max-width: 620px; margin-bottom: 22px;
  }
  .eval-tag {
    background: var(--danger-soft); color: var(--danger);
    font-family: var(--mono); font-size: 10px;
    font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase;
    padding: 4px 10px; border-radius: 5px;
    flex-shrink: 0; margin-top: 4px;
  }

  /* ── WHAT THE USER ASKED ───────────────── */
  .scenario {
    background: var(--ink); color: #fff;
    border-radius: 14px; padding: 22px 26px; margin-bottom: 18px;
    position: relative; overflow: hidden;
  }
  .scenario::before {
    content: ""; position: absolute;
    top: -60px; right: -60px;
    width: 200px; height: 200px;
    background: radial-gradient(circle, rgba(214,224,234,0.10) 0%, transparent 65%);
    pointer-events: none;
  }
  .scenario .sc-kicker {
    font-family: var(--mono); font-size: 9.5px;
    letter-spacing: 0.16em; text-transform: uppercase;
    color: #a8b2bc; font-weight: 800; margin-bottom: 10px;
  }
  .scenario .sc-prompt {
    font-size: 19px; font-weight: 700; line-height: 1.35;
    margin-bottom: 14px; color: #fff;
    display: flex; align-items: flex-start; gap: 12px;
  }
  .scenario .sc-prompt::before {
    content: "💬";
    font-size: 20px;
    flex-shrink: 0;
    line-height: 1.2;
  }
  .scenario .sc-context {
    font-size: 13px; line-height: 1.6;
    color: #b8c0c8; padding-top: 14px;
    border-top: 1px solid #2a2e34;
  }
  .scenario .sc-context strong { color: #fff; font-weight: 700; }

  /* ── HELPER LINE ───────────────────────── */
  .helper {
    background: var(--blue-soft);
    border-left: 4px solid var(--blue);
    border-radius: 8px;
    padding: 12px 16px;
    margin-bottom: 18px;
    font-size: 13px; line-height: 1.55;
    color: #1a2a3a;
  }
  .helper strong { color: var(--ink); font-weight: 800; }
  .helper .hl-icon {
    font-weight: 900; color: var(--blue);
    margin-right: 6px;
  }

  /* ── RUNS ──────────────────────────────── */
  .runs-label {
    font-family: var(--mono); font-size: 10.5px;
    letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--muted); font-weight: 800;
    margin-bottom: 10px;
    display: flex; align-items: center; gap: 10px;
  }
  .runs-label .rl-hint {
    color: var(--muted);
    text-transform: none;
    letter-spacing: 0;
    font-weight: 500;
    font-family: inherit;
    font-size: 12px;
  }

  .runs-grid {
    display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px;
    margin-bottom: 18px;
  }
  @media (max-width: 780px) { .runs-grid { grid-template-columns: 1fr; } }

  .run-card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; overflow: hidden;
    display: flex; flex-direction: column;
  }
  .run-head {
    background: #faf8f4; padding: 10px 14px;
    font-size: 11px; letter-spacing: 0.08em;
    text-transform: uppercase; font-weight: 800;
    color: var(--ink-soft);
    border-bottom: 1px solid var(--line);
    display: flex; justify-content: space-between; align-items: center;
  }
  .run-head .rh-tag {
    font-size: 9.5px; color: var(--muted); font-weight: 600;
    text-transform: none; letter-spacing: 0;
    font-style: italic;
  }

  /* ── WHAT THE AGENT DID (plain-language steps) ── */
  .run-steps {
    padding: 12px 14px;
    display: flex; flex-direction: column; gap: 8px;
    flex: 1;
  }
  .run-step {
    display: flex; gap: 10px; align-items: flex-start;
    font-size: 12.5px; line-height: 1.45;
  }
  .run-step .rs-icon {
    width: 24px; height: 24px; border-radius: 6px;
    background: var(--paper);
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 12px;
    flex-shrink: 0;
    border: 1px solid var(--line);
  }
  .run-step.warn .rs-icon { background: var(--warn-soft); border-color: #e0cc91; }
  .run-step.danger .rs-icon { background: var(--danger-soft); border-color: #e0b5ab; }
  .run-step.ok .rs-icon { background: var(--green-soft); border-color: #b6d4b6; }
  .run-step .rs-text {
    color: var(--ink-soft);
  }
  .run-step .rs-text strong { color: var(--ink); font-weight: 800; }
  .run-step .rs-sub {
    display: block;
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
    line-height: 1.35;
  }
  .run-step.danger .rs-text { color: var(--ink); }
  .run-step.danger .rs-sub { color: var(--danger); font-weight: 600; }

  /* Agent final reply — looks like a chat bubble */
  .run-reply {
    padding: 12px 14px;
    background: #fdfaf3;
    border-top: 1px solid var(--line);
    display: flex; gap: 10px;
    align-items: flex-start;
  }
  .run-reply .rr-avatar {
    width: 26px; height: 26px; border-radius: 50%;
    background: var(--ink); color: #fff;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 800;
    flex-shrink: 0;
  }
  .run-reply .rr-bubble {
    font-size: 12.5px; line-height: 1.5;
    color: var(--ink);
    font-style: italic;
  }
  .run-reply .rr-bubble::before {
    content: "The agent told the customer: ";
    font-style: normal;
    font-size: 10px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted); font-weight: 800;
    display: block; margin-bottom: 3px;
  }

  /* ── ASSESS ────────────────────────────── */
  .assess-box {
    background: var(--card); border: 1px solid var(--line);
    border-left: 4px solid var(--danger);
    border-radius: 12px; padding: 24px 26px; margin-bottom: 18px;
  }
  .assess-box .ab-kicker {
    font-family: var(--mono); font-size: 10.5px;
    letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--danger); font-weight: 800; margin-bottom: 14px;
  }
  .assess-q { margin-bottom: 22px; }
  .assess-q:last-child { margin-bottom: 0; }
  .assess-q .aq-label {
    font-size: 15px; font-weight: 700;
    color: var(--ink); margin-bottom: 6px;
    line-height: 1.4;
  }
  .assess-q .aq-hint {
    font-size: 12.5px; color: var(--muted);
    line-height: 1.45;
    margin-bottom: 12px;
  }

  .cb-row {
    display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px;
  }
  @media (max-width: 600px) { .cb-row { grid-template-columns: 1fr; } }
  .cb-opt {
    background: var(--paper); border: 1.5px solid var(--line);
    border-radius: 10px; padding: 14px 16px;
    cursor: pointer; font-family: inherit;
    display: flex; align-items: center; gap: 10px;
    font-size: 13px; font-weight: 700;
    color: var(--ink-soft);
    transition: all 0.15s;
  }
  .cb-opt:hover { border-color: var(--ink); }
  .cb-opt.on {
    background: var(--ink); color: #fff; border-color: var(--ink);
  }
  .cb-opt .cb-dot {
    width: 18px; height: 18px; border-radius: 4px;
    border: 1.5px solid #b0aba5;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 900;
    color: #fff; flex-shrink: 0;
  }
  .cb-opt.on .cb-dot { background: #fff; border-color: #fff; color: var(--ink); }

  .likert-row {
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px;
  }
  @media (max-width: 600px) { .likert-row { grid-template-columns: 1fr 1fr 1fr 1fr 1fr; } }
  .likert-opt {
    background: var(--paper); border: 1.5px solid var(--line);
    border-radius: 10px; padding: 12px 6px;
    cursor: pointer; font-family: inherit;
    display: flex; flex-direction: column; align-items: center; gap: 5px;
    transition: all 0.15s;
    min-height: 72px;
  }
  .likert-opt:hover { border-color: var(--ink); }
  .likert-opt.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .likert-opt .lo-num {
    font-family: var(--mono); font-size: 15px; font-weight: 900;
  }
  .likert-opt .lo-lbl {
    font-size: 10px; text-align: center;
    color: var(--muted); line-height: 1.25;
    font-weight: 600;
  }
  .likert-opt.on .lo-lbl { color: #c5c0ba; }

  /* ── REVEAL ────────────────────────────── */
  .reveal-block {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 24px 26px; margin-bottom: 16px;
  }
  .reveal-block .rb-kicker {
    font-family: var(--mono); font-size: 10.5px;
    letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--muted); font-weight: 800; margin-bottom: 12px;
  }
  .reveal-block h3 { font-size: 18px; margin-bottom: 14px; }

  /* ── WHAT ACTUALLY HAPPENED (statement style) ── */
  .bank-statement {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 18px;
  }
  .bs-head {
    background: var(--ink);
    color: #fff;
    padding: 12px 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }
  .bs-head .bs-title {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-weight: 800;
  }
  .bs-head .bs-sub {
    font-size: 11px;
    color: #a8b2bc;
    font-family: var(--mono);
  }
  .bs-row {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 14px;
    padding: 12px 18px;
    border-bottom: 1px solid var(--line);
    align-items: center;
    font-size: 13px;
  }
  .bs-row:last-child { border-bottom: none; }
  .bs-row.wrong { background: var(--danger-soft); }
  .bs-row.right { background: var(--green-soft); }
  .bs-row .bs-key {
    color: var(--ink-soft);
    font-weight: 600;
    line-height: 1.4;
  }
  .bs-row .bs-val {
    font-family: var(--mono);
    font-size: 12.5px;
    font-weight: 800;
    color: var(--ink);
    text-align: right;
    letter-spacing: -0.01em;
  }
  .bs-row.wrong .bs-val { color: var(--danger); }
  .bs-row.right .bs-val { color: var(--green); }

  /* ── VERDICT PER RUN ───────────────────── */
  .verdict-table {
    display: flex; flex-direction: column; gap: 10px;
    margin-bottom: 16px;
  }
  .verdict-row {
    display: grid; grid-template-columns: 84px 1fr auto;
    gap: 14px; align-items: center;
    background: var(--paper); border-radius: 10px;
    padding: 14px 16px;
    border-left: 5px solid var(--muted);
  }
  .verdict-row.correct { border-left-color: var(--green); background: var(--green-soft); }
  .verdict-row.wrong { border-left-color: var(--danger); background: var(--danger-soft); }
  .verdict-row.plausible { border-left-color: var(--warn); background: var(--warn-soft); }

  .verdict-row .vr-run {
    font-size: 12px;
    font-weight: 900;
    color: var(--ink-soft);
    letter-spacing: 0.02em;
  }
  .verdict-row .vr-what {
    font-size: 13px;
    line-height: 1.5;
    color: var(--ink-soft);
  }
  .verdict-row .vr-what strong { color: var(--ink); font-weight: 800; }
  .verdict-row .vr-verdict {
    font-size: 10.5px;
    font-weight: 900;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 4px 10px; border-radius: 5px;
    white-space: nowrap;
    color: #fff;
  }
  .vr-verdict.correct { background: var(--green); }
  .vr-verdict.wrong { background: var(--danger); }
  .vr-verdict.plausible { background: var(--warn); }

  /* ── CONSISTENCY ───────────────────────── */
  .consistency {
    background: var(--paper); border-radius: 10px;
    padding: 16px 20px; margin-bottom: 16px;
    display: flex; align-items: center; gap: 14px;
    flex-wrap: wrap;
  }
  .consistency .co-label {
    font-family: var(--mono); font-size: 10.5px;
    letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--muted); font-weight: 800;
  }
  .consistency .co-dots { display: flex; gap: 6px; }
  .consistency .co-dot {
    width: 16px; height: 16px; border-radius: 50%;
    position: relative;
  }
  .co-dot.green { background: var(--green); }
  .co-dot.amber { background: var(--warn); }
  .co-dot.red { background: var(--danger); }
  .co-dot::after {
    content: attr(data-label);
    position: absolute;
    bottom: -20px; left: 50%;
    transform: translateX(-50%);
    font-family: var(--mono);
    font-size: 9px;
    font-weight: 800;
    color: var(--muted);
    white-space: nowrap;
  }
  .consistency .co-verdict {
    font-size: 14px;
    font-weight: 800;
    color: var(--ink);
    margin-left: auto;
  }
  .consistency .co-verdict.bad { color: var(--danger); }
  .consistency .co-verdict.good { color: var(--green); }

  /* ── USER FEEDBACK ─────────────────────── */
  .user-check {
    background: var(--blue-soft); border-radius: 10px;
    padding: 16px 20px; margin-bottom: 16px;
    border-left: 4px solid var(--blue);
  }
  .user-check .uc-kicker {
    font-family: var(--mono); font-size: 9.5px;
    letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--blue); font-weight: 800; margin-bottom: 8px;
  }
  .user-check .uc-text {
    font-size: 13.5px; line-height: 1.6;
    color: #1a2a3a; font-weight: 500;
  }
  .user-check .uc-text strong { color: var(--ink); font-weight: 800; }

  /* ── LESSON ────────────────────────────── */
  .lesson-box {
    background: var(--ink); color: #d8e2ec;
    border-radius: 12px; padding: 22px 26px;
    margin-bottom: 16px;
  }
  .lesson-box .lb-kicker {
    font-family: var(--mono); font-size: 9.5px;
    letter-spacing: 0.16em; text-transform: uppercase;
    color: #8ab88a; font-weight: 800; margin-bottom: 10px;
  }
  .lesson-box .lb-hypothesis {
    font-size: 16px; line-height: 1.5;
    color: #fff; font-weight: 700;
    margin-bottom: 14px;
  }
  .lesson-box .lb-hypothesis em {
    font-style: normal; color: #e0c88a;
  }
  .lesson-box .lb-policy {
    font-size: 13px; line-height: 1.6;
    color: #b8c8c8; padding-top: 14px;
    border-top: 1px solid #2a2e34;
  }
  .lesson-box .lb-policy strong { color: #fff; font-weight: 800; }
  .lesson-box .lb-policy .lbp-label {
    font-family: var(--mono);
    font-size: 9.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #8ab88a;
    font-weight: 800;
    display: block;
    margin-bottom: 4px;
  }

  /* ── NAV ───────────────────────────────── */
  .nav-actions {
    display: flex; gap: 10px;
    margin-top: 24px;
    flex-wrap: wrap;
  }

  /* ── SUMMARY ───────────────────────────── */
  .summary-hero {
    background: var(--ink); color: #fff;
    border-radius: 14px; padding: 34px 36px;
    margin-bottom: 22px;
    position: relative; overflow: hidden;
  }
  .summary-hero::before {
    content: ""; position: absolute;
    top: -80px; right: -80px;
    width: 240px; height: 240px;
    background: radial-gradient(circle, rgba(138,184,138,0.14) 0%, transparent 65%);
    pointer-events: none;
  }
  .summary-hero .sh-kicker {
    font-family: var(--mono); font-size: 10.5px;
    letter-spacing: 0.16em; text-transform: uppercase;
    color: #8ab88a; font-weight: 800; margin-bottom: 14px;
  }
  .summary-hero h1 { color: #fff; font-size: 30px; margin-bottom: 14px; }

/* ═══════════════════════════════════════════════════════════ */

const state = {
  phase: 'intro',
  evalIndex: 0,
  evalPhase: 'scenario',
  assessments: EVALS.map(() => ({
    correctRuns: [],
    trust: null,
    confidence: null
  }))
};

const app = document.getElementById('app');
const dotsEl = document.getElementById('dots');

function renderDots() {
  dotsEl.innerHTML = '';
  EVALS.forEach((_, i) => {
    const s = document.createElement('span');
    if (state.phase === 'eval') {
      if (i < state.evalIndex) s.className = 'done';
      else if (i === state.evalIndex) s.className = 'active';
    } else if (state.phase === 'summary') {
      s.className = 'done';
    }
    dotsEl.appendChild(s);
  });
}

function render() {
  renderDots();
  app.innerHTML = '';

  if (state.phase === 'intro') return renderIntro();
  if (state.phase === 'summary') return renderSummary();

  const ev = EVALS[state.evalIndex];
  if (state.evalPhase === 'scenario') return renderScenario(ev);
  if (state.evalPhase === 'assess') return renderAssess(ev);
  if (state.evalPhase === 'reveal') return renderReveal(ev);

  window.scrollTo({ top: 0, behavior: 'auto' });
}

/* ── SCENARIO ──────────────────────────────────── */

    <div class="runs-label">
      Same request · three separate runs
      <span class="rl-hint">Read them side by side</span>
    </div>
    <div class="runs-grid">
      ${ev.runs.map(r => renderRunCard(r)).join('')}
    </div>

    <div class="nav-actions">
      <button class="cta-btn" id="assessBtn">I've read them · assess →</button>
    </div>
  `;
  app.appendChild(div);
  div.querySelector('#assessBtn').addEventListener('click', () => {
    state.evalPhase = 'assess';
    render();
  });
}

function renderRunCard(run) {
  const stepsHTML = run.steps.map(s => {
    const cls = s.danger ? 'danger' : s.warn ? 'warn' : s.ok ? 'ok' : '';
    return `
      <div class="run-step ${cls}">
        <span class="rs-icon">${s.icon}</span>
        <div class="rs-text">
          ${s.text}
          ${s.sub ? `<span class="rs-sub">${s.sub}</span>` : ''}
        </div>
      </div>
    `;
  }).join('');
  return `
    <div class="run-card">
      <div class="run-head">
        <span>Attempt ${run.id}</span>
        <span class="rh-tag">same instruction</span>
      </div>
      <div class="run-steps">${stepsHTML}</div>
      <div class="run-reply">
        <div class="rr-avatar">AI</div>
        <div class="rr-bubble">${escapeHtml(run.reply)}</div>
      </div>
    </div>
  `;
}

/* ── ASSESS ────────────────────────────────────── */
function renderAssess(ev) {
  const div = document.createElement('div');
  div.className = 'screen active';
  const a = state.assessments[state.evalIndex];

  div.innerHTML = `
    <div class="eval-head">
      <div>
        <div class="eval-kicker">Task ${ev.num} · Your read</div>
        <h1 class="eval-title">Which one did it correctly?</h1>
        <p class="eval-tagline">Decide before we show you the bank's records.</p>
      </div>
    </div>

    <div class="runs-grid">
      ${ev.runs.map(r => renderRunCard(r)).join('')}
    </div>

    <div class="assess-box">
      <div class="ab-kicker">Your answers</div>

      <div class="assess-q">
        <div class="aq-label">Which attempt(s) would you be happy with if this was <em>your</em> money?</div>
        <div class="aq-hint">Tap the ones you'd accept. If you wouldn't accept any of them, leave them all blank.</div>
        <div class="cb-row" id="cbRow">
          ${[1,2,3].map(n => `
            <button class="cb-opt${a.correctRuns.includes(n) ? ' on' : ''}" data-run="${n}">
              <span class="cb-dot">${a.correctRuns.includes(n) ? '✓' : ''}</span>
              <span>Attempt ${n}</span>
            </button>
          `).join('')}
        </div>
      </div>

      <div class="assess-q">
        <div class="aq-label">Would you trust this AI to move your money on your behalf?</div>
        <div class="likert-row" id="trustRow">
          ${[
            [1,'Definitely<br>not'],
            [2,'Probably<br>not'],
            [3,'Not<br>sure'],
            [4,'Probably<br>yes'],
            [5,'Definitely<br>yes']
          ].map(([v, l]) => `
            <button class="likert-opt${a.trust === v ? ' on' : ''}" data-likert="trust" data-val="${v}">
              <span class="lo-num">${v}</span>
              <span class="lo-lbl">${l}</span>
            </button>
          `).join('')}
        </div>
      </div>

      <div class="assess-q">
        <div class="aq-label">How confident are you in your judgment?</div>
        <div class="likert-row" id="confRow">
          ${[
            [1,'Just<br>guessing'],
            [2,'Slightly<br>sure'],
            [3,'Moderately<br>sure'],
            [4,'Fairly<br>sure'],
            [5,'Very<br>sure']
          ].map(([v, l]) => `
            <button class="likert-opt${a.confidence === v ? ' on' : ''}" data-likert="confidence" data-val="${v}">
              <span class="lo-num">${v}</span>
              <span class="lo-lbl">${l}</span>
            </button>
          `).join('')}
        </div>
      </div>
    </div>

    <div class="nav-actions">
      <button class="cta-btn danger" id="revealBtn" ${(!a.trust || !a.confidence) ? 'disabled' : ''}>
        Show the bank's records →
      </button>
      <button class="cta-btn ghost" id="backBtn">← Back to the runs</button>
    </div>
  `;
  app.appendChild(div);

  div.querySelectorAll('#cbRow .cb-opt').forEach(btn => {
    btn.addEventListener('click', () => {
      const n = parseInt(btn.dataset.run);
      const idx = a.correctRuns.indexOf(n);
      if (idx === -1) a.correctRuns.push(n);
      else a.correctRuns.splice(idx, 1);
      btn.classList.toggle('on');
      btn.querySelector('.cb-dot').textContent = a.correctRuns.includes(n) ? '✓' : '';
    });
  });

  div.querySelectorAll('.likert-opt').forEach(btn => {
    btn.addEventListener('click', () => {
      const key = btn.dataset.likert;
      const val = parseInt(btn.dataset.val);
      a[key] = val;
      div.querySelectorAll(`[data-likert="${key}"]`).forEach(b => b.classList.remove('on'));
      btn.classList.add('on');
      div.querySelector('#revealBtn').disabled = !(a.trust && a.confidence);
    });
  });

  div.querySelector('#revealBtn').addEventListener('click', () => {
    state.evalPhase = 'reveal';
    render();
  });
  div.querySelector('#backBtn').addEventListener('click', () => {
    state.evalPhase = 'scenario';
    render();
  });
}

/* ── REVEAL ────────────────────────────────────── */
function renderReveal(ev) {
  const a = state.assessments[state.evalIndex];
  const div = document.createElement('div');
  div.className = 'screen active';

  const correctSet = new Set();
  ev.verdicts.forEach((v, i) => { if (v === 'correct') correctSet.add(i + 1); });
  const userSet = new Set(a.correctRuns);
  const matchesExactly = correctSet.size === userSet.size && [...correctSet].every(x => userSet.has(x));
  const anyCorrect = [...correctSet].some(x => userSet.has(x));

  div.innerHTML = `
    <div class="eval-head">
      <div>
        <div class="eval-kicker">Task ${ev.num} · Ground truth</div>
        <h1 class="eval-title">What the bank recorded</h1>
        <p class="eval-tagline">The agent's story versus the bank's own records.</p>
      </div>
    </div>

    <div class="runs-grid">
      ${ev.runs.map(r => renderRunCard(r)).join('')}
    </div>

    <div class="reveal-block">
      <div class="rb-kicker">${ev.statementSub}</div>
      <div class="bank-statement">
        <div class="bs-head">
          <span class="bs-title">${escapeHtml(ev.statementTitle)}</span>
          <span class="bs-sub">Bank records</span>
        </div>
        ${ev.statement.map(l => `
          <div class="bs-row ${l.wrong ? 'wrong' : l.right ? 'right' : ''}">
            <div class="bs-key">${escapeHtml(l.key)}</div>
            <div class="bs-val">${escapeHtml(l.val)}</div>
          </div>
        `).join('')}
      </div>

      <div class="rb-kicker" style="margin-top: 12px;">What each attempt actually did</div>
      <div class="verdict-table">
        ${ev.runs.map((r, i) => {
          const v = ev.verdicts[i];
          const vClass = v === 'correct' ? 'correct' : v === 'wrong' ? 'wrong' : 'plausible';
          const vText = v === 'correct' ? 'Correct' : v === 'wrong' ? 'Wrong' : 'Wrong but plausible';
          return `
            <div class="verdict-row ${vClass}">
              <span class="vr-run">Attempt ${r.id}</span>
              <span class="vr-what">${ev.verdictTexts[i]}</span>
              <span class="vr-verdict ${vClass}">${vText}</span>
            </div>
          `;
        }).join('')}
      </div>

      <div class="consistency">
        <span class="co-label">Consistency</span>
        <div class="co-dots">
          ${ev.consistency.dots.map((c, i) =>
            `<span class="co-dot ${c}" data-label="${escapeHtml(ev.consistency.dotLabels[i])}"></span>`
          ).join('')}
        </div>
        <span class="co-verdict ${ev.consistency.verdict.includes('Three') ? 'bad' : 'good'}">
          ${escapeHtml(ev.consistency.verdict)}
        </span>
      </div>
    </div>

    <div class="user-check">
      <div class="uc-kicker">Your read</div>
      <div class="uc-text">
        ${matchesExactly
          ? `<strong>You got it exactly right.</strong> You picked the correct attempt(s) — and the bank's records agree.`
          : anyCorrect
            ? `<strong>Partially right.</strong> You picked at least one correct attempt, but missed or misjudged some. Look at the records again — the difference matters.`
            : `<strong>Not this time.</strong> None of the attempts you picked matched what the bank actually recorded. That gap — between what an AI agent says and what really happened — is exactly why this matters.`}
      </div>
    </div>

    <div class="lesson-box">
      <div class="lb-kicker">The lesson</div>
      <div class="lb-hypothesis">${ev.hypothesis}</div>
      <div class="lb-policy">
        <span class="lbp-label">What should change</span>
        ${ev.policy}
      </div>
    </div>

    <div class="nav-actions">
      <button class="cta-btn" id="nextBtn">
        ${state.evalIndex < EVALS.length - 1 ? 'Next task →' : 'See my results →'}
      </button>
    </div>
  `;
  app.appendChild(div);

  div.querySelector('#nextBtn').addEventListener('click', () => {
    if (state.evalIndex < EVALS.length - 1) {
      state.evalIndex++;
      state.evalPhase = 'scenario';
      render();
    } else {
      state.phase = 'summary';
      render();
    }
  });

  window.scrollTo({ top: 0, behavior: 'auto' });
}

/* ── SUMMARY ───────────────────────────────────── */
function renderSummary() {
  const div = document.createElement('div');
  div.className = 'screen active';

  let exactCount = 0, partialCount = 0, missCount = 0;
  EVALS.forEach((ev, i) => {
    const correctSet = new Set();
    ev.verdicts.forEach((v, j) => { if (v === 'correct') correctSet.add(j + 1); });
    const userSet = new Set(state.assessments[i].correctRuns);
    const exact = correctSet.size === userSet.size && [...correctSet].every(x => userSet.has(x));
    const anyCorrect = [...correctSet].some(x => userSet.has(x));
    if (exact) exactCount++;
    else if (anyCorrect) partialCount++;
    else missCount++;
  });

  const avgTrust = (state.assessments.reduce((sum, a) => sum + (a.trust || 0), 0) / EVALS.length).toFixed(1);
  const totalWrong = EVALS.reduce((sum, ev) => sum + ev.verdicts.filter(v => v === 'wrong').length, 0);
  const totalRuns = EVALS.length * 3;
  const wrongRate = Math.round((totalWrong / totalRuns) * 100);

  div.innerHTML = `
    <div class="summary-hero">
      <div class="sh-kicker">Done · summary</div>
      <h1>Your judgment vs. the bank's records</h1>
      <p>
        You assessed five everyday banking tasks. Each was run three times by the same AI
        agent — same instruction, three attempts. Here's what your judgment shows, and
        what the agent's behaviour across fifteen attempts reveals about the state of
        AI in banking today.
      </p>
    </div>

    <div class="summary-grid">
      <div class="summary-card">
        <div class="sm-kicker">You got exactly right</div>
        <div class="sm-value ${exactCount >= 3 ? 'good' : 'bad'}">${exactCount} / ${EVALS.length}</div>
        <div class="sm-sub">Tasks where you correctly identified which attempt was safe.</div>
      </div>
      <div class="summary-card">
        <div class="sm-kicker">Partially right</div>
        <div class="sm-value">${partialCount} / ${EVALS.length}</div>
        <div class="sm-sub">You spotted some correct attempts, but not all.</div>
      </div>
      <div class="summary-card">
        <div class="sm-kicker">Your average trust</div>
        <div class="sm-value">${avgTrust} / 5</div>
        <div class="sm-sub">How much you said you'd trust this AI with your money.</div>
      </div>
      <div class="summary-card">
        <div class="sm-kicker">Attempts that went wrong</div>
        <div class="sm-value bad">${wrongRate}%</div>
        <div class="sm-sub">${totalWrong} of ${totalRuns} attempts produced a wrong or unsafe outcome.</div>
      </div>
    </div>

    <h2 style="margin-bottom: 12px;">Task by task</h2>
    ${EVALS.map((ev, i) => {
      const correctSet = new Set();
      ev.verdicts.forEach((v, j) => { if (v === 'correct') correctSet.add(j + 1); });
      const userSet = new Set(state.assessments[i].correctRuns);
      const exact = correctSet.size === userSet.size && [...correctSet].every(x => userSet.has(x));
      const anyCorrect = [...correctSet].some(x => userSet.has(x));
      const badge = exact ? 'correct' : anyCorrect ? 'partial' : 'wrong';
      const badgeText = exact ? 'Exact' : anyCorrect ? 'Partial' : 'Missed';
      const failing = ev.verdicts.filter(v => v === 'wrong').length;
      return `
        <div class="eval-summary">
          <div class="es-head">
            <span class="es-num">TASK ${ev.num}</span>
            <span class="es-title">${ev.title}</span>
            <span class="es-badge ${badge}">${badgeText}</span>
          </div>
          <div class="es-body">
            <strong>${failing} of 3 attempts</strong> produced a wrong outcome. ${ev.consistency.verdict}.
          </div>
        </div>
      `;
    }).join('')}

    <div class="final-message">
      <h3>What you just saw</h3>
      <p>
        Across five ordinary banking tasks — a transfer, a bill payment, a balance check,
        a statement search, an investment — the <strong>same AI agent was asked the same
        thing three times</strong>. On almost every task, it behaved differently each time.
      </p>
      <p>
        The failures weren't exotic. They were the everyday ones: a wrong balance,
        a double-paid bill, money sent to the wrong person with the same name,
        a transaction that never happened, a safety check that was skipped.
      </p>
      <p>
        <em>An AI agent is not a source of truth, an action, or a guarantee.
        It is one attempt — not a fixed outcome.</em>
      </p>
      <p style="margin-bottom: 0;">
        <strong>The only safe setup is one where the bank's systems refuse to make
        mistakes — and where what actually happened can be checked independently
        of what the AI said.</strong>
      </p>
    </div>

    <div class="nav-actions">
      <button class="cta-btn" id="restartBtn">Try again from the start</button>
      <button class="cta-btn ghost" id="exportBtn">Save my answers</button>
    </div>
  `;
  app.appendChild(div);

  div.querySelector('#restartBtn').addEventListener('click', () => {
    state.phase = 'intro';
    state.evalIndex = 0;
    state.evalPhase = 'scenario';
    state.assessments = EVALS.map(() => ({ correctRuns: [], trust: null, confidence: null }));
    render();
  });

  div.querySelector('#exportBtn').addEventListener('click', () => {
    const payload = {
      saved_at: new Date().toISOString(),
      your_score: {
        exactly_right: exactCount,
        partially_right: partialCount,
        missed: missCount,
        average_trust_out_of_5: parseFloat(avgTrust),
        attempts_that_went_wrong_percent: wrongRate
      },
      per_task: EVALS.map((ev, i) => ({
        task: ev.num + ' · ' + ev.title,
        your_accepted_attempts: state.assessments[i].correctRuns,
        actual_safe_attempts: ev.verdicts.map((v, j) => v === 'correct' ? j + 1 : null).filter(Boolean),
        trust_score_out_of_5: state.assessments[i].trust,
        confidence_score_out_of_5: state.assessments[i].confidence
      }))
    };
    const json = JSON.stringify(payload, null, 2);
    navigator.clipboard.writeText(json).then(
      () => alert('Your answers have been copied — paste them into an email or message.'),
      () => {
        const w = window.open('', '_blank');
        w.document.write('<pre>' + json.replace(/</g, '&lt;') + '</pre>');
      }
    );
  });
}

function escapeHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

render();
</script>
</body>
</html>
